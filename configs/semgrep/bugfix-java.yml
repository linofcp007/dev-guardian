# dev-guardian Semgrep config bugfix-java.
# Bugs de implementação em Java. É a linguagem mais vazia de toda a sequência:
# o p/r2c-bug-scan traz 4 regras Java e NENHUMA cai numa classe de bug — são
# todas de igualdade e comparação. As seis subcategorias estavam todas a zero,
# na linguagem cujo defeito mais famoso é o NullPointerException. Medições em
#
# Cada regra tem um par de fixtures em
# mcp/test/fixtures/bugfix-java/{hits,misses}/: um ficheiro que tem de disparar
# a regra, outro parecido que NÃO pode. O ficheiro misses/ é a especificação
# do que é código correto — se ele disparar, a regra é que está errada.
#
# Duas palavras são proibidas nos ids: `unchecked`, que a regex de
# error_handling casa, e `concurren`, que a de race_condition casa e é testada
# primeiro no if-chain. É por isso que a regra de edge_case se chama
# modify-during-iteration e não concurrent-modification.
#
# CINCO CARACTERES SÃO PROIBIDOS NESTE FICHEIRO, incluindo nos comentários: o A
# maiúsculo com acento agudo (U+00C1), o I maiúsculo com acento agudo (U+00CD),
# e mais três que o português não usa (U+00CF, U+00D0, U+00DD). Em português,
# na prática, são dois.
#
# Porquê: o carregador de configuração do Semgrep descodifica este ficheiro com
# o codec do LOCALE e não em UTF-8. Num locale cp1252 (Windows) os bytes 0x81,
# 0x8D, 0x8F, 0x90 e 0x9D não existem na tabela, e são exatamente os segundos
# bytes UTF-8 desses cinco caracteres — U+00C1 é 0xC3 0x81. UM deles num
# comentário derruba o ficheiro inteiro. Repare-se que este aviso não pode
# sequer escrever os caracteres que proíbe: escrevê-los parte o ficheiro que os
# descreve.
#
# O que NÃO é proibido, e foi medido um a um em vez de suposto: todas as outras
# maiúsculas acentuadas do português passam — A-til, A-grave, A-circunflexo,
# E-agudo, E-circunflexo, O-agudo, O-circunflexo, O-til, U-agudo e C-cedilha.
# E todas as minúsculas passam, sem exceção (`á` é 0xC3 0xA1, que cp1252
# conhece), que é a razão por que toda a prosa em português deste ficheiro
# sempre funcionou. A regra larga — "nada de maiúsculas acentuadas" — foi a
# primeira versão deste aviso e estava errada por excesso, que é o mesmo defeito
# que esta série anda a corrigir há oito rondas.
#
# Medido no ficheiro partido: o scan devolve `results: 0`, `paths.scanned: 0` e
# `errors: 0` — quem leia só os findings vê um scan limpo. O teste de integração
# apanha isto por duas vias (`paths.scanned` e `semgrep --validate`).
#
# ---------------------------------------------------------------------------
# TRÊS FORMAS que aparecem em todo o ficheiro, todas medidas, todas com custo:
#
# 1. `{ $S1; return ...; }` em vez de `{ ... return ...; }`. O `...` de
#    statement faz DEEP MATCHING: `if (!m.containsKey(k)) { if (strict) {
#    return ""; } }` casa `{ ... return ...; }` e a guarda deixa de disparar —
#    mas essa guarda não cobre todos os caminhos e o deref a seguir É um bug.
#    Medido: com `...` o caso desaparece; com `$S1` continua a disparar. A
#    exclusão limitada engole um statement interposto, não uma árvore. CUSTO:
#    duas ou mais instruções entre a guarda e a saída voltam a disparar.
#
# 2. O recetor é ligado por `metavariable-pattern` com um `pattern-either`
#    interno de `$F` e `this.$F`, e só DEPOIS tipado. Sem isso o
#    `metavariable-type` não resolve um campo qualificado — `cache.get(k)`
#    disparava e `this.cache.get(k)` era invisível, na mesma classe e no mesmo
#    campo. Um ramo por tipo continua a ser um ramo por tipo; o `this.` sai de
#    graça e tem a sua própria fixture para não morrer sem se dar por isso.
#
# ---------------------------------------------------------------------------
# A RONDA DO CORPUS EXTERNO. Este pack levou nove rondas de correções e todas
# elas foram feitas a ler fixtures. A única coisa que alguma vez foi medida
# contra código que ninguém aqui escreveu — a `empty-catch` nos 12 593
# ficheiros do OpenJDK — refutou a premissa em que assentava o tier dela. A
# ronda seguinte apontou as OITO regras ao mesmo corpus e a um segundo, o
# Spring Framework (4 754 ficheiros), e leu os findings um a um:
#
#   | regra                     | JDK antes | JDK depois | Spring |
#   | ------------------------- | --------- | ---------- | ------ |
#   | empty-catch               | 1589      | 1589       | 193    |
#   | printstacktrace-only      |   78      |   78       |   0    |
#   | map-get-deref (apagada)   |   43      |   43       |  12    |
#   | optional-get-no-ispresent |   26      |   11       |   0    |
#   | stream-not-closed         |   12      |    4       |   0    |
#   | modify-during-iteration   |    1      |    1       |   0    |
#   | off-by-one-loop-lte-length|    0      |    0       |   0    |
#   | static-dateformat         |    0      |    0       |   0    |
#
# Das quatro regras que a ronda mexeu, DUAS foram apertadas e DUAS alargadas —
# e as duas alargadas são a razão para não ler esta tabela como "menos é
# melhor". A `static-dateformat` estava cega ao único formatter estático
# partilhado que os dois corpora tinham, um bug a sério; a `off-by-one` estava
# cega a `++i`, a `i += 1` e a `for (var i = 0;`. As duas apertadas fecharam
# formas de guarda que nenhuma fixture continha: oito try-with-resources de
# dois recursos e quinze guardas de Optional.
#
# O corpus está registado no harness de ablação em `GUARDIAN_JAVA_SRC`, por
# isso o eixo 3 deixou de ser N/A para este pack.
#
# ---------------------------------------------------------------------------
# A RONDA DO CORPUS DE APLICACAO, e o que ela apagou. A `map-get-deref` ficou
# no pack depois da ronda acima com uma condição escrita na sua própria
# cabeça: os 55 findings lidos no JDK e no Spring eram todos falsos positivos,
# mas os dois corpora são BIBLIOTECAS, em que um mapa dereferenciado é quase
# sempre um mapa que a própria classe preencheu. A regra ficava até alguém
# medir Java de APLICACAO. Foi medido:
#
#   | corpus         | findings | ficheiros | por 1000 |
#   | -------------- | -------- | --------- | -------- |
#   | Jenkins        |      1   |    1 274  |    0,8   |
#   | Kafka          |    224   |    3 892  |   57,5   |
#   | Elasticsearch  |    749   |   20 485  |   36,6   |
#
# 973 findings novos. 45 lidos um a um, escolhidos de propósito nas formas que
# a triagem automática NAO explicava. Defeitos defensáveis: CINCO sítios (11
# linhas). Todos os outros são invariantes que nenhum matcher sintático
# alcança.
#
# O NUMERO QUE DECIDIU, e não é a contagem: 88% dos findings do Elasticsearch e
# 97% dos do Kafka não têm guarda nenhuma perto do deref. São corretos por
# razões SEMANTICAS — mapas paralelos mantidos em sincronia, um mapa que a
# classe preencheu noutro método, chave constante, contrato de API. Não há
# `pattern-not-inside` que chegue a nada disso, por isso ESTREITAR A REGRA
# ESTAVA FORA DE QUESTAO, e isso também foi medido em vez de suposto: a única
# família fechável que apareceu foi o estilo `containsKey(k) == false` do
# Elasticsearch (as exclusões só cobriam `!containsKey`), e vale 34 dos 749 —
# 4,5%, e zero no Kafka.
#
# DUAS COISAS QUE A LEITURA MOSTROU e que valem mais do que a contagem:
#
#   * a regra é CEGA à forma mais perigosa. `X v = m.get(k); v.foo();` não
#     casa, porque o deref não está encadeado. Em KafkaAdminClient.java:2375 e
#     AbstractStickyAssignor.java:268 a regra assinala a leitura DERIVADA, que
#     é segura, e não vê a leitura original ao lado, que é a que arrisca.
#   * os cinco verdadeiros positivos têm todos a MESMA forma: um mapa vindo de
#     parsing de entrada externa (JSON de HTTP, /sys/fs/cgroup, output da JVM)
#     lido com chave literal e sem guarda — EnterpriseGeoIpDownloader.java:589,
#     GeoIpDownloader.java:160, OsProbe.java:811, JvmOption.java:63,
#     RemotePartitionMetadataStore.java:175. "Veio de parsing" é proveniência,
#     não sintaxe, e está fora do Semgrep OSS. Fica registado como candidato a
#     uma regra FUTURA e MEDIDA DE RAIZ, não como um aperto desta.
#
# Apagada, portanto, pelo mesmo critério que apagou a `as-cast-deref` do pack
# de C# e a `catch-returns-null`, com uma diferença registada de propósito: a
# taxa de verdadeiros positivos desta NAO era zero, era cerca de 1%. Um
# utilizador com 5 000 ficheiros de Java recebia ~200 findings e talvez dois
# valessem a pena. A contagem nunca decide — a `empty-catch` faz 1589 no JDK e
# está certa quase sempre. O que decide é a taxa, e a taxa é 1%.
#
# ---------------------------------------------------------------------------
# OS TIERS, e a consequência prática que ninguém quer descobrir sozinho.
#
# AS OITO REGRAS ESTAO EM WARNING. Nenhuma em ERROR. Não é desleixo: é o
# critério do §4 do design aplicado a frio, na sua forma geral — a pergunta
# não é "o que é que a regra procura?" mas "aquilo que a regra EMITE é sempre
# um bug?". Uma regra cuja correção depende de ter reconhecido uma GUARDA
# falha sempre que encontra uma guarda que ninguém enumerou, e a guarda pode
# estar a um método de distância, fora do alcance de qualquer matcher
# sintático. Num motor sem dataflow quase nada passa nesta barra; zero em oito
# é o resultado honesto, não uma falha do pack.
#
# A `empty-catch` esteve em ERROR durante toda a série, com o argumento de que
# a sua válvula de escape não era uma guarda mas uma DECLARACAO DE INTENCAO
# que a própria regra lê — a convenção Checkstyle/IntelliJ `ignore` /
# `ignored` / `expected`. O argumento era bom e a premissa era falsa, e foi
# preciso medi-la para o saber. MEDIDO em 12 593 ficheiros do OpenJDK (tag do
# dia, `src/*/share/classes`, código que ninguém aqui escreveu nem escolheu):
# 1589 findings em 770 ficheiros. 903 deles — 56,8 % — trazem um COMENTARIO
# explicativo dentro do próprio catch vazio ("// ignore", "// Expected or
# ignored", "// swallow, since it should never happen", "// Ignoring
# exception causes specified default to be returned"). Outros 27 declaram a
# intenção NO NOME, num nome que esta regra não reconhece: `cannotHappen`
# (13), `_` (10 — a variável sem nome do Java 21, que é precisamente "não uso
# este binding"), `unused` (2), `ignored0` e `ignored1` (a regex está
# ancorada, por isso o sufixo dispara). Amostra de 45 lidos um a um: cerca de
# 39 deliberados. A intenção ESTA declarada; está declarada num comentário que
# o Semgrep não lê e num vocabulário maior do que estas tres palavras. Isso é
# o critério, não uma exceção a ele — a mesma conclusão a que o pack de JS/TS,
# o de PHP e o de Ruby chegaram, cada um pela sua via.
#
# QUANTO É QUE A CONVENCAO COBRE, medido em vez de suposto: uma sonda com a
# regex invertida (`^(ignore|ignored|expected)$`) encontra 139 catches vazios
# assim nomeados no mesmo corpus. 139 + 1589 = 1728 catches vazios no total,
# por isso a convenção — a que sustentava o tier — cobre 8,0 % das ocorrencias
# reais. Existe, ao contrário do que se passa em JS/TS; simplesmente não é
# como o Java se escreve. (Para escala: em Ruby a grafia equivalente cobria
# 2,7 %.)
#
# A saída pelo nome fica onde está: continua a ser a única forma de silenciar
# um caso em código em vez de com `// nosemgrep`, e as tres palavras são as
# dos dois linters standard de Java. Só não é evidência de que a regra é
# precisa — no OpenJDK inteiro cobre 8 % das ocorrencias reais.
#
# CONSEQUÊNCIA, e agora é a manchete: o parser do Semgrep mapeia ERROR ->
# `high` e WARNING -> `medium`, e o `create_fix_pr` tem `severity_min` a
# `high` por omissão. Com as oito em WARNING, este pack NAO CONTRIBUI DE TODO
# para o conjunto de fixes por omissão. Quem quiser bugs de Java corrigidos
# tem de pedir: `severity_min: "medium"`. O `bug_hunt` não filtra por omissão,
# por isso nada desaparece de um scan — o que muda é só o fix-PR.
# ---------------------------------------------------------------------------
rules:
  # WARNING desde a ronda do corpus externo, e ESTEVE em ERROR até lá — a
  # única do pack. O argumento era o do §4: esta regra não depende de
  # reconhecer guarda nenhuma, porque a sua válvula de escape não é uma guarda
  # mas uma DECLARAÇÃO DE INTENÇÃO que a própria regra lê, escrita no nome da
  # variável; honrada essa, o que sobra seria um catch que engole a falha sem
  # o declarar em lado nenhum. O argumento estava certo e a premissa estava
  # errada: em 12 593 ficheiros do OpenJDK, 903 dos 1589 findings declaram a
  # intenção — num COMENTARIO, que o Semgrep não lê. A grafia que a regra
  # reconhece cobre 8,0 % dos catches vazios do corpus. O bloco OS TIERS, no
  # cabeçalho, tem os números e a leitura.
  #
  # A exclusão é pelo NOME da variável, não por comentário, e a razão é que o
  # Semgrep casa a AST — os comentários não estão lá. Um catch documentado
  # como ignorado de propósito é byte a byte igual a um catch que engole a
  # falha em silêncio, por isso o comentário nunca podia ser a válvula de
  # escape. O nome pode, e já é a convenção dos dois linters Java standard:
  # o EmptyCatchBlock do Checkstyle aceita `ignore` e `expected` por omissão,
  # a inspeção do IntelliJ aceita `ignored`. Medido: `e`, `ex`, `ignoreMe` e
  # `expectedly` continuam a disparar — a regra ganha vocabulário, não perde
  # força. O que a medição acrescenta é que o vocabulário REAL do OpenJDK é
  # maior do que estas tres palavras e não se sobrepõe a elas: `cannotHappen`
  # (13), `_` (10 — a variável sem nome do Java 21), `unused` (2). Alargar a
  # lista foi considerado e recusado: `_` é o caso forte, mas cada palavra
  # nova é mais uma forma de um bug real escapar por se chamar bem, e o tier
  # já não depende disto.
  #
  # DUAS FORMAS DE `try`, e a segunda foi um falso negativo publicado. Um `try`
  # COM finalizador é um nó de AST diferente de um `try` sem ele, por isso
  # `try { ... } catch ($E $V) { }` não casava um try/catch/finally: pendurar
  # `finally { cleanup(); }` num catch que engole silenciava a regra por
  # completo, e o bug que ela vigiava deixava de ser reportado. Medido em
  # hits/EmptyCatch.java: 3 de 6 antes, 6 de 6 depois. É o mesmo defeito que os
  # packs de JS/TS e Python tinham e fecharam — a mesma forma, medida três
  # vezes em três linguagens.
  #
  # O QUE FOI MEDIDO E NÃO É BURACO, em vez de suposto pela leitura do padrão:
  #   * try-with-resources — `try (R r = ...) { ... } catch ($E $V) { }` já
  #     casava. O cabeçalho de recursos não altera o nó para efeitos deste
  #     padrão;
  #   * MULTI-CATCH — `catch (A | B e) { }` já casava, e o `$V` liga o nome na
  #     mesma, por isso a exclusão por nome continua a valer. É a construção
  #     análoga ao tuplo de Python, onde a metavariável NÃO ligava e
  #     `except (ValueError, TypeError): pass` era silencioso; em Java não é.
  #   * dois `catch` seguidos, com o segundo vazio, também já casava.
  # As três formas têm fixture própria em hits/EmptyCatch.java, porque "já
  # casava" é uma medição com data e as contagens são asseridas.
  - id: bugfix-java-error-handling-empty-catch
    patterns:
      - pattern-either:
          - pattern: |
              try { ... } catch ($E $V) { }
          - pattern: |
              try { ... } catch ($E $V) { } finally { ... }
      - metavariable-regex:
          metavariable: $V
          regex: ^(?!(ignore|ignored|expected)$)
    message: >-
      Catch vazio. A exceção foi apanhada e deitada fora sem log, sem rethrow e
      sem tratamento, por isso a falha desaparece e o código segue como se
      nada fosse. Se o silencio for mesmo deliberado, declare-o no nome:
      `catch (NumberFormatException ignored)`.
    severity: WARNING
    languages: [java]

  # WARNING e não ERROR: num `main` descartável imprimir o stack trace e seguir
  # é uma escolha legítima. Em serviço não é — vai para o stderr, não para o
  # log, e a execução continua como se a exceção não tivesse acontecido.
  #
  # As duas formas de `try` são as mesmas da `empty-catch`, e pela mesma razão:
  # a regra estava ancorada no mesmo `try { ... } catch ($E $V) { ... }`, por
  # isso um `finally` silenciava-a de forma idêntica. Medido em
  # hits/PrintStackTraceOnly.java: 3 de 6 antes, 6 de 6 depois. O
  # try-with-resources e o multi-catch já casavam aqui também, e estão pinados
  # em fixture pela mesma razão.
  - id: bugfix-java-error-handling-printstacktrace-only
    pattern-either:
      - pattern: |
          try { ... } catch ($E $V) { $V.printStackTrace(); }
      - pattern: |
          try { ... } catch ($E $V) { $V.printStackTrace(); } finally { ... }
    message: >-
      O catch só faz `printStackTrace()`. Isso escreve no stderr em vez do log
      e não trata nada — a execução continua como se a exceção não tivesse
      acontecido. Registe no logger e trate ou relance.
    severity: WARNING
    languages: [java]

  # WARNING e não ERROR, e a razão é o critério do §4 do design aplicado a
  # frio: ERROR é para o padrão que é bug independentemente da intenção. Um
  # `o.get()` não é isso — só é bug quando está SEM GUARDA, e a lista de
  # exclusões abaixo é a prova direta de que a regra não consegue decidir isso
  # de forma fiável. Uma regra que precisa de uma lista de exclusões sem fim
  # para se manter correta em ERROR nunca foi ERROR segundo esta definição.
  # Descer de tier é aplicar o critério, não mudar o contrato.
  #
  # Sem o `metavariable-type`, `$O.get()` casa QUALQUER `get()` sem argumentos
  # — `AtomicInteger.get()`, `ThreadLocal.get()`, `Supplier.get()` — e a regra
  # nunca foi sobre `Optional`.
  #
  # O QUE A REGRA RECONHECE, medido e enumerado (a frase que aqui esteve dizia
  # "guardas escritas inline sobre a mesma variável" e era falsificável: uma
  # condição composta, uma saída com mais do que uma instrução, um `while` e um
  # `Optional.of` atribuído disparavam todos):
  #   * `if ($O.isPresent()) { … }`, incluindo em conjunção (`&&`) com outra
  #     condição de qualquer dos lados, NA CONDIÇÃO DE UM `if`, com o `get()`
  #     no ramo VERDADEIRO, com ou sem chavetas — o ramo `else` é um
  #     NoSuchElementException garantido e continua a disparar;
  #   * `while ($O.isPresent()) { … }`;
  #   * o mesmo teste usado como EXPRESSÃO e não como condição de coisa nenhuma
  #     (`return o.isPresent() && o.get().isEmpty();`), mais as disjunções
  #     negativa-primeiro `!o.isPresent() || …` e `o.isEmpty() || …`, que fazem
  #     curto-circuito da mesma maneira. `a.isPresent() || b` NÃO é excluída, e
  #     deliberadamente: não prova nada sobre `a`;
  #   * saída antecipada por `return`/`throw`/`continue`/`break`, sobre
  #     `!isPresent()` e sobre `isEmpty()`, com e sem uma instrução interposta;
  #   * as três formas ternárias, com o `get()` no ramo que a condição prova
  #     seguro;
  #   * o ramo `else` de um `if ($O.isEmpty())`, com ou sem chavetas, com a
  #     condição pura ou em DISJUNÇÃO (`o.isEmpty() || X`), e portanto também a
  #     cadeia `else if` — em Java `else if (C) A else B` é um `if` aninhado com
  #     bloco dos dois lados. A CONJUNÇÃO (`X && o.isEmpty()`) não prova nada e
  #     continua a disparar;
  #   * `assert $O.isPresent();` e `assert $O.isPresent() : msg;`, que são uma
  #     intenção declarada na AST e não uma guarda de runtime — as asserções
  #     estão desligadas por omissão. Um assert sobre OUTRO Optional, ou
  #     `assert $O.isEmpty()`, continuam a disparar;
  #   * `$O.filter(...).isPresent()`;
  #   * `Optional<T> o = Optional.of(...)`, que não pode estar vazio —
  #     `ofNullable` pode, e continua a disparar.
  #   * qualquer uma das formas de expressão acima numa CADEIA, com outra coisa
  #     a fazer curto-circuito à frente da guarda — `flag && o.isPresent() &&
  #     o.get()…`. Uma cláusula por guarda cobre cadeias de qualquer
  #     comprimento, porque o `$X` casa a subárvore INTEIRA aninhada à esquerda
  #     e não um operando: `a && b && c` é `(a && b) && c`, por isso
  #     `$X && GUARDA && DEREF` alcança uma cadeia de qualquer comprimento cuja
  #     penúltima posição seja a guarda. Uma segunda cláusula para "cadeias mais
  #     longas" seria inerte — medido, a de quatro operandos fecha com a mesma
  #     cláusula que a de três. Isto esteve documentado ao contrário durante
  #     quatro rondas, com duas justificações sucessivas, e as duas estavam
  #     erradas porque ninguém tinha olhado para o que o `$X` casa.
  # O que a regra NÃO reconhece, e não é exprimível em Semgrep OSS: qualquer
  # guarda que chegue através de outro método, como `if (!present(o)) { … }`,
  # que exige análise interprocedimental; e uma guarda guardada num booleano
  # local, que é dataflow.
  #
  # A cadeia de conjunção esteve aqui listada como não reconhecida, com a
  # explicação de que "exatamente dois operandos é a forma excluída". Era falso,
  # e foi falso durante quatro rondas: o `$X` casa a subárvore inteira, por isso
  # o comprimento da cadeia nunca decidiu nada. O que continua mesmo de fora é a
  # cadeia em que a guarda NÃO está na penúltima posição, porque guarda outra
  # coisa — `a.isPresent() && b.isPresent() && a.get()…` dispara sobre o
  # `a.get()`, e isso é uma cadeia que prova duas coisas, não um problema de
  # comprimento.
  - id: bugfix-java-null-safety-optional-get-no-ispresent
    patterns:
      - pattern: $O.get()
      - metavariable-type: {metavariable: $O, type: Optional}
      # --- guarda inline, LIMITADA AO RAMO QUE A GUARDA PROVA ----------------
      #
      # Duas cláusulas por guarda, e as duas são precisas: a
      # primeira alcança corpos com várias instruções e derefs aninhados, a
      # segunda alcança a forma sem chavetas. E as duas exigem que o deref
      # esteja no ramo VERDADEIRO — a forma anterior, `if ($O.isPresent()) {
      # ... }`, casava o statement if-else inteiro e excluía também o `else`,
      # onde o `get()` é um NoSuchElementException garantido.
      - pattern-not-inside: "if ($O.isPresent()) { ... $O.get(); ... }"
      - pattern-not-inside: "if ($O.isPresent()) { <... $O.get() ...>; }"
      - pattern-not-inside: "if ($O.isPresent() && ...) { ... $O.get(); ... }"
      - pattern-not-inside: "if ($O.isPresent() && ...) { <... $O.get() ...>; }"
      - pattern-not-inside: "if (... && $O.isPresent()) { ... $O.get(); ... }"
      - pattern-not-inside: "if (... && $O.isPresent()) { <... $O.get() ...>; }"
      - pattern-not-inside: while ($O.isPresent()) { ... }
      # --- o ramo `else` de um teste de VAZIO -------------------------------
      #
      # A regra reconhecia `if (isPresent()) { get() }` e a saida antecipada
      # sobre `isEmpty()`, e não reconhecia a dual das duas: o `else` de um
      # `if (o.isEmpty())`. MEDIDO em 12 593 ficheiros do OpenJDK: NOVE dos 26
      # findings eram esta forma, a maior família da regra no corpus. É o
      # idioma normal desde o Java 11, quando `isEmpty()` entrou —
      # `if (o.isEmpty()) { ... } else { … o.get() … }` — e cobre também a
      # cadeia `else if`, porque em Java `else if (C) A else B` É um `if`
      # aninhado com bloco dos dois lados.
      #
      # A DISJUNÇÃO na condição prova o mesmo e tem cláusula própria:
      # de `!(o.isEmpty() || X)` sai `!o.isEmpty()`, portanto presente no
      # `else`. A CONJUNÇÃO não prova nada — de `!(X && o.isEmpty())` não sai
      # coisa nenhuma sobre o Optional — e continua a disparar, o que é
      # medido na fixture e não suposto.
      #
      # O ramo THEN continua a disparar quando é lá que está o `get()`: aí o
      # Optional está provado VAZIO e o `get()` lança de certeza. O que estas
      # cláusulas exigem é que o `get()` esteja no `else`. O risco que sobra é
      # o mesmo das cláusulas de `isPresent()` acima — se AMBOS os ramos
      # tiverem um `get()`, o nó inteiro é excluído e o do ramo errado
      # desaparece com ele. É a limitação do `pattern-not-inside`, já
      # registada, e não uma nova.
      - pattern-not-inside: "if ($O.isEmpty()) { ... } else { ... $O.get(); ... }"
      - pattern-not-inside: "if ($O.isEmpty()) { ... } else { <... $O.get() ...>; }"
      - pattern-not-inside: "if ($O.isEmpty() || ...) { ... } else { ... $O.get(); ... }"
      - pattern-not-inside: "if ($O.isEmpty() || ...) { ... } else { <... $O.get() ...>; }"
      # --- `assert isPresent()`, uma DECLARAÇÃO DE INTENÇÃO na AST ----------
      #
      # SEIS dos 26 findings do OpenJDK são `assert o.isPresent();` seguido de
      # `o.get()`, e é o idioma da própria biblioteca standard para dizer "esta
      # invariante é minha e eu verifiquei-a". Ao contrário de um comentário,
      # está na AST e o Semgrep lê-o; é o mesmo estatuto que a `empty-catch` dá
      # ao nome `ignored`, e a mesma honestidade: as asserções estão DESLIGADAS
      # por omissão em produção, por isso isto não é uma guarda de runtime, é
      # uma intenção declarada. A regra existe para dizer "não verificou"; aqui
      # verificou, na única forma que o estilo do ficheiro oferece.
      #
      # UMA cláusula, e não duas. A intuição — `assert C;` e `assert C : msg;`
      # são nós de AST diferentes, logo precisam de um padrão cada — está
      # errada e foi medida: o `: ...` casa a MENSAGEM AUSENTE, por isso a
      # forma com mensagem cobre as duas. O par chegou a estar escrito aqui e a
      # ablação deu a de cima INERTE. Sétima ocorrência desta classe de defeito
      # na série, e a segunda apanhada antes de sair.
      #
      # Medido: um assert sobre OUTRO Optional continua a disparar, e
      # `assert o.isEmpty();` seguido de `o.get()` também — esse prova o
      # contrário.
      - pattern-not-inside: |
          assert $O.isPresent() : ...;
          ...
      # --- guarda como EXPRESSÃO, não como condição de um `if` ---------------
      #
      # Mesmo defeito e mesma correção que na regra do mapa: as cláusulas de
      # cima são todas `if (...) { ... }` e a prosa dizia "conjunção de
      # qualquer dos lados" sem qualificar. `return o.isPresent() &&
      # o.get().isEmpty();` disparava.
      #
      # A disjunção continua a NÃO ser excluída na forma `a.isPresent() || b`,
      # que não prova nada. A forma NEGATIVA-PRIMEIRO prova: `||` faz
      # curto-circuito, o operando direito só corre quando o esquerdo foi
      # falso, e aí o valor está presente.
      - pattern-not-inside: "$O.isPresent() && <... $O.get() ...>"
      - pattern-not-inside: "!$O.isPresent() || <... $O.get() ...>"
      - pattern-not-inside: "$O.isEmpty() || <... $O.get() ...>"
      # A mesma guarda numa CADEIA. `$X` casa a subárvore inteira aninhada à
      # esquerda, por isso uma cláusula por guarda cobre cadeias de qualquer
      # comprimento — a explicação completa, e o erro de raciocínio que a
      # atrasou várias rondas, estão na lista de formas reconhecidas acima.
      # Continuam a disparar, e são bugs: a cadeia que guarda OUTRO Optional, a
      # disjunção positiva-primeiro, e a guarda negada
      # (`flag && !o.isPresent() && o.get()`), em que o Optional está provado
      # VAZIO onde é lido. Fixadas em `b15`, `b17` e `b19`.
      - pattern-not-inside: "$X && $O.isPresent() && <... $O.get() ...>"
      - pattern-not-inside: "$X || !$O.isPresent() || <... $O.get() ...>"
      - pattern-not-inside: "$X || $O.isEmpty() || <... $O.get() ...>"
      # --- saída antecipada sobre !isPresent() -------------------------------
      - pattern-not-inside: |
          if (!$O.isPresent()) { return ...; }
          ...
      - pattern-not-inside: |
          if (!$O.isPresent()) { $S1; return ...; }
          ...
      - pattern-not-inside: |
          if (!$O.isPresent()) { throw ...; }
          ...
      - pattern-not-inside: |
          if (!$O.isPresent()) { $S1; throw ...; }
          ...
      - pattern-not-inside: |
          if (!$O.isPresent()) { continue; }
          ...
      - pattern-not-inside: |
          if (!$O.isPresent()) { $S1; continue; }
          ...
      - pattern-not-inside: |
          if (!$O.isPresent()) { break; }
          ...
      - pattern-not-inside: |
          if (!$O.isPresent()) { $S1; break; }
          ...
      # --- saída antecipada sobre isEmpty() ----------------------------------
      - pattern-not-inside: |
          if ($O.isEmpty()) { return ...; }
          ...
      - pattern-not-inside: |
          if ($O.isEmpty()) { $S1; return ...; }
          ...
      - pattern-not-inside: |
          if ($O.isEmpty()) { throw ...; }
          ...
      - pattern-not-inside: |
          if ($O.isEmpty()) { $S1; throw ...; }
          ...
      - pattern-not-inside: |
          if ($O.isEmpty()) { continue; }
          ...
      - pattern-not-inside: |
          if ($O.isEmpty()) { $S1; continue; }
          ...
      - pattern-not-inside: |
          if ($O.isEmpty()) { break; }
          ...
      - pattern-not-inside: |
          if ($O.isEmpty()) { $S1; break; }
          ...
      # As aspas são obrigatórias nas três, e por duas razões. Sem elas o YAML
      # lê o `?` como indicador de chave complexa e o `:` como mapeamento, e o
      # ficheiro inteiro deixa de carregar — `Invalid YAML file`, `scanned=0`.
      # É a mesma armadilha do RuleParseError: a corrida parece ter acontecido.
      #
      # E são LIMITADAS AO RAMO GUARDADO. A forma anterior casava o ternário
      # inteiro e excluía os dois ramos, incluindo aquele em que a guarda é
      # falsa e o `get()` lança de certeza.
      - pattern-not-inside: "$O.isPresent() ? <... $O.get() ...> : ..."
      - pattern-not-inside: "!$O.isPresent() ? ... : <... $O.get() ...>"
      - pattern-not-inside: "$O.isEmpty() ? ... : <... $O.get() ...>"
      # `filter` num Optional vazio devolve vazio, por isso um resultado
      # presente do filtro prova que o original está presente — o `get()` não
      # pode lançar. A exclusão do `isPresent()` não chegava aqui porque liga o
      # recetor a exatamente `$O`, e aqui quem recebe o `isPresent()` é
      # `o.filter(p)`.
      - pattern-not-inside: if ($O.filter(...).isPresent()) { ... }
      # `Optional.of` lança se o argumento for null, por isso um Optional
      # construído assim está sempre presente. `ofNullable` NÃO está aqui —
      # esse pode estar vazio e o `get()` a seguir é o bug que a regra procura.
      - pattern-not-inside: |
          Optional<$T> $O = Optional.of(...);
          ...
    message: >-
      `Optional.get()` sem `isPresent()`. Lança `NoSuchElementException` quando
      está vazio — que é exatamente aquilo que o Optional existia para evitar.
      Use `orElse`, `orElseThrow` com mensagem, ou guarde com `isPresent()`.
    severity: WARNING
    languages: [java]

  # O `$A` é restringido a um ARRAY, e sem isso a regra não era sobre arrays:
  # `$A.length` casa qualquer campo `int` chamado `length`, e disparava em
  # ERROR sobre `for (int i = 0; i <= seg.length; i++)` num objeto de domínio
  # com um campo `length` — um ciclo inclusivo de propósito, sobre nada que
  # tenha limites de array.
  #
  # O tipo é `"$T[]"`, com aspas obrigatórias: sem elas o `[` abre uma
  # sequência de fluxo YAML e o ficheiro não carrega. Um array de qualquer
  # elemento serve, e medido não custa recall nenhum: parâmetro, local,
  # campo, campo com `this.` e local inferido com `var` continuam todos a ser
  # vistos.
  #
  # WARNING e não ERROR, e a descida foi MEDIDA antes de ser decidida: se o
  # aperto óbvio funcionasse, a regra podia ter ficado em ERROR honestamente.
  # Não funciona. Exigir que o corpo indexe mesmo o array, com
  # `"for (int $I = 0; $I <= $A.length; $I++) { <... $A[$I] ...> }"`:
  #
  #   * MATA o ciclo que nunca indexa `a` —
  #     `for (int i = 0; i <= a.length; i++) { sum += i; }`, que é correto;
  #   * NÃO mata o array-sentinela — `int[] b = new int[a.length + 1]; ...
  #     b[i] = (i < a.length) ? a[i] : -1;` é correto, preenche um array MAIOR,
  #     e continua a disparar, porque o `a[i]` já guardado está mesmo ali dentro
  #     do ternário e a forma de expressão profunda encontra-o;
  #   * PERDE um bug real — `sum += at(a, i)`, em que o índice fora dos limites
  #     é passado a um helper, deixa de disparar.
  #
  # Ou seja: troca um falso positivo por um falso negativo e não resolve o caso
  # principal. Não foi aplicado. Os patterns ficam exatamente como estão e só o
  # tier muda — e muda porque o que a regra emite não é sempre um bug.
  # O INCREMENTO E O CORPO SÃO RETICÊNCIAS, e as duas entraram por medição na
  # ronda do corpus externo. A sintaxe opcional de um padrão FILTRA: escrever
  # `$I++` no cabeçalho é escrever "e o incremento é exatamente esta forma", e
  # a regra ficava cega a `++$I` e a `$I += 1`. É o mesmo defeito que o pack de
  # C# apanhou (`i++` casava, `++i` não) e a mesma classe que fez lá um
  # `foreach ($T $X in $C)` encontrar 0 de 5 bugs. `$I <= $A.length` com o
  # índice a começar em zero é o bug seja qual for o incremento, por isso o
  # incremento não tem de ser enumerado.
  #
  # O corpo escrito como `...` de statement em vez de `{ ... }` fecha a forma
  # SEM CHAVETAS de uma vez — medido: `{ ... }` não casa
  # `for (...) s += i;`, e o corpo como reticência casa as duas.
  #
  # O ramo do `var` é um segundo ramo porque `int` é literal no padrão:
  # `for (var i = 0; i <= a.length; i++)` era invisível. Medido nas quatro
  # combinações (int/var vezes com/sem chavetas) e nas três formas de
  # incremento; `$I < $A.length` e `int $I = 1` continuam silenciosos, que é o
  # que as near-misses asseridas provam.
  #
  # MEDIDO NO CORPUS EXTERNO, e é a razão por que alargar aqui não tem custo:
  # ZERO cabeçalhos `<= ....length` em 12 593 ficheiros do OpenJDK e em 4 754
  # do Spring Framework. A forma não aparece em Java maduro de todo, por isso
  # a regra não tem findings reais para perder precisão — o que tinha eram
  # falsos negativos.
  - id: bugfix-java-off-by-one-loop-lte-length
    patterns:
      - pattern-either:
          - pattern: |
              for (int $I = 0; $I <= $A.length; ...) ...
          - pattern: |
              for (var $I = 0; $I <= $A.length; ...) ...
      - metavariable-type:
          metavariable: $A
          type: "$T[]"
    message: >-
      Off-by-one. `i <= a.length` corre uma posição para lá do fim, e o índice
      `a.length` está sempre fora dos limites — é um
      ArrayIndexOutOfBoundsException. Queria provavelmente `i < a.length`.
    severity: WARNING
    languages: [java]

  # WARNING e não ERROR: um stream fechado num `finally` está correto e esta
  # regra não o vê.
  #
  # A ANCORA POSITIVA É UMA SEQUÊNCIA, e essa é a correção da ronda do corpus
  # externo. A regra tinha aqui um par de `pattern-not-inside` a nomear o
  # recurso — `try ($T2 $V2 = new FileInputStream(...)) { ... }`, com e sem
  # finalizador — porque `try (...) { ... }` NÃO é um padrão Java válido
  # (medido: `Invalid pattern for Java`, tal como `try ($...RES)` e
  # `try (...; $R; ...)`). Isso fecha o cabeçalho de UM recurso e mais nenhum:
  # um cabeçalho com DOIS recursos é outro nó, e o stream continuava a ser
  # acusado apesar de estar fechado. MEDIDO em 12 593 ficheiros do OpenJDK:
  # 12 findings, dos quais OITO eram try-with-resources de dois recursos —
  # `try (FileInputStream fis = ...; BufferedInputStream bis = new
  # BufferedInputStream(fis))`, que é como se abre um ficheiro em Java quando
  # se quer um buffer. Dois terços da regra eram esse falso positivo.
  #
  # Enumerar os comprimentos não era caminho: com `$X` a casar um recurso
  # inteiro são duas cláusulas para dois recursos, três para três, e vezes
  # duas com finalizador. O que funciona é exigir que a declaração esteja numa
  # SEQUÊNCIA DE INSTRUÇÕES — `pattern-inside` de `decl;` seguido de `...`.
  # Um recurso no cabeçalho de um `try` não está numa sequência de instruções,
  # por isso nenhuma forma de cabeçalho casa, com qualquer número de recursos e
  # com ou sem finalizador. Medido: continua a disparar quando a declaração é a
  # ÚLTIMA instrução do bloco e quando é a única instrução de um bloco aninhado
  # (o `...` casa zero instruções), e as duas exclusões de cabeçalho que aqui
  # estavam passaram a ser inertes — foram apagadas, não mantidas por via das
  # dúvidas. O `pattern-inside` é um termo positivo, por isso a regra continua
  # a ser válida com ele a substituir o `pattern` como ancora de contexto.
  #
  # As duas exclusões que SOBRAM são a forma do Java 9: um recurso já
  # declarado e efetivamente final pode ser nomeado direto no cabeçalho,
  # `try (in) { ... }`, e o stream É fechado. A declaração fica FORA do `try`,
  # numa sequência de instruções, por isso a ancora positiva alcança-a e é
  # preciso excluí-la explicitamente. Medido: o `$V` fica mesmo ligado nas duas
  # pontas, um `leaked` continua a disparar na mesma função onde um `managed`
  # é fechado assim.
  #
  # O `finally` DUPLICA a exclusão do Java 9 porque um `try` com finalizador é
  # um nó de AST diferente. O `catch` sozinho foi medido e NÃO é buraco: o
  # emparelhamento de `try` do Semgrep é insensível a cláusulas `catch` a mais
  # e sensível à presença do finalizador, e as duas formas estão pinadas em
  # separado na fixture para o dia em que isso deixe de ser verdade.
  - id: bugfix-java-memory-leak-stream-not-closed
    patterns:
      - pattern: $T $V = new FileInputStream(...);
      - pattern-inside: |
          $T $V = new FileInputStream(...);
          ...
      - pattern-not-inside: |
          $T $V = new FileInputStream(...);
          ...
          try ($V) { ... }
      - pattern-not-inside: |
          $T $V = new FileInputStream(...);
          ...
          try ($V) { ... } finally { ... }
    message: >-
      Stream aberto fora de um try-with-resources. Se algo lançar antes do
      `close()`, o descritor fica aberto — e em código que corre em ciclo isso
      esgota os descritores do processo.
    severity: WARNING
    languages: [java]

  # Um único pattern, e o `final` NÃO precisa de ramo próprio: o Semgrep casa
  # os modificadores Java por subconjunto, por isso `static SimpleDateFormat`
  # apanha também `static final SimpleDateFormat`.
  #
  # O nome está QUALIFICADO e a forma curta NÃO tem ramo, o que é o contrário
  # do que parece. Medido nas quatro combinações: com `import
  # java.text.SimpleDateFormat`, com `import java.text.*`, com declaração de
  # `package`, e sem import nenhum — o pattern qualificado casa a forma curta
  # em todas elas, porque o Semgrep resolve o nome pelo import. O pattern
  # curto não casa a forma qualificada em nenhuma. Um `pattern-either` com os
  # dois esteve aqui e o ramo curto era INERTE: as mesmas ocorrências, com e
  # sem ele. Um campo `static final java.text.SimpleDateFormat` num ficheiro
  # sem import — que é exatamente como se escreve quando não há import — era
  # invisível enquanto o ramo curto sozinho lá esteve.
  #
  # WARNING e não ERROR. O §8 do design argumentava que marcar um formatter
  # partilhado é "defensável de qualquer maneira", porque um formatter
  # partilhado serializa todos os chamadores mesmo quando o acesso está
  # sincronizado. Isso é um argumento de PRODUTO, não o critério do §4, e o
  # critério ganha. A correção desta regra depende de uma guarda que ela não
  # vê: um `static final SimpleDateFormat` cujos acessos passam todos por
  # métodos `synchronized` é código correto, e provar que TODOS os acessos
  # estão sincronizados é análise do programa inteiro, que o Semgrep OSS não
  # faz. Já estava documentado como falso positivo não corrigível; o tier passa
  # agora a dizer a mesma coisa.
  #
  # A DECLARAÇÃO SEPARADA DA ATRIBUIÇÃO é o segundo ramo, e entrou por
  # medição. O ramo de cima exige o inicializador na própria declaração; a
  # outra metade do idioma escreve `private static final SimpleDateFormat F;`
  # e atribui num bloco `static { ... }`, normalmente porque a seguir chama
  # `setTimeZone(...)`. MEDIDO: zero ocorrências em 12 593 ficheiros do
  # OpenJDK, UMA em 4 754 do Spring Framework — e essa uma é um bug a sério,
  # um formatter estático partilhado formatado sem lock nenhum
  # (`AbstractMockHttpServletRequestBuilder`). A única candidata dos dois
  # corpora era invisível para a regra. Um campo `static SimpleDateFormat` é
  # partilhado independentemente do sítio onde é atribuído, por isso o ramo
  # não precisa de ver o `new`.
  #
  # Medido no que o ramo NÃO casa, em vez de suposto: a forma COM
  # inicializador (fica para o primeiro ramo, sem duplicar o finding), um
  # campo de instância `final SimpleDateFormat`, um campo de instância sem
  # inicializador e um método estático que DEVOLVE um `SimpleDateFormat`.
  # Locais não entram: uma variável local não pode ser `static`.
  - id: bugfix-java-race-condition-static-dateformat
    pattern-either:
      - pattern: >-
          static java.text.SimpleDateFormat $N =
          new java.text.SimpleDateFormat(...);
      - pattern: static java.text.SimpleDateFormat $N;
    message: >-
      `SimpleDateFormat` num campo estático. A classe não é thread-safe e um
      campo estático é a definição de partilhado — sob concorrência devolve
      datas trocadas ou lança. Use `DateTimeFormatter`, que é imutável, ou uma
      instância por chamada.
    severity: WARNING
    languages: [java]

  # Ancorada na CHAMADA `remove`, não no `for`. Duas razões, ambas medidas.
  # A primeira é que o finding passa a apontar para a mutação em vez do
  # cabeçalho do ciclo. A segunda é a lição da ronda do Go: um pattern
  # positivo terminado em `...` mais uma exclusão emparelhada produz spans
  # sobrepostos que a exclusão só cancela a meio — ancorar na chamada única e
  # excluir sobre a sequência é a forma que funciona.
  #
  # AS FORMAS DE SAIR. O idioma mais comum de mutação de listas em Java é
  # procurar, remover, sair: não há `ConcurrentModificationException` possível
  # porque o `next()` nunca mais é chamado. As exclusões cobrem as formas de
  # sair — `return`, `throw`, `break` etiquetado e `break` simples — cada uma
  # com e sem UMA instrução interposta. Um terceiro ramo com `return;` sem
  # valor foi medido e é INERTE: o `return ...;` já casa o `return;` de um
  # método `void`.
  #
  # O `break` SIMPLES é o caso perigoso e tem tratamento próprio. Dentro de um
  # `switch`, `break` sai do `switch` e NÃO do ciclo — o `remove()` seguido de
  # `break` num `case` é uma CME real, e a exclusão emparelhada engolia-a.
  # A solução é o `pattern-either` de baixo: se o `remove` está dentro de um
  # `switch` (com `case` ou com `default` — medido, cada forma só casa a sua,
  # e as duas casam o `switch` de setas do Java 14), a exclusão do `break`
  # simples não se aplica. O `break` ETIQUETADO sai mesmo do ciclo, `switch`
  # ou não, por isso essa exclusão fica no nível de cima; e `return`/`throw`
  # saem do método a partir de qualquer profundidade, por isso também.
  #
  # O tipo do recetor é enumerado em vez de negado: as coleções concorrentes
  # ficam de fora por omissão. A `CopyOnWriteArrayList` itera sobre um snapshot
  # por design, e remover durante o for-each sobre ela é o idioma de remoção
  # seguro dessa coleção, não um bug.
  #
  # CUSTO, medido: tal como no mapa, o `metavariable-type` é o tipo declarado
  # EXATO, sem subtipagem — medido: `type: List` NÃO casa uma
  # `CopyOnWriteArrayList`, que é o que faz a enumeração funcionar, e é também
  # o que faz a regra ficar calada sobre qualquer coleção declarada com um tipo
  # que não esteja nesta lista (`Deque`, `Queue`, `SortedSet`, uma coleção do
  # próprio projeto).
  #
  # WARNING e não ERROR, pela mesma razão que as outras: aquilo que a
  # regra emite não é sempre um bug. A correção depende inteiramente de ter
  # reconhecido a FORMA DE SAIR que torna a remoção segura, e as exclusões abaixo
  # cobrem as formas enumeradas — não a seguinte. Bastam DUAS instruções entre
  # a remoção e a saída para a regra voltar a acusar código correto, e isso é
  # o falso positivo aceite (5) da documentação, assumido de propósito porque
  # a alternativa (uma reticência de statement) esconde bugs reais. Uma regra
  # com um falso positivo conhecido, assumido e não corrigível não é ERROR.
  - id: bugfix-java-edge-case-modify-during-iteration
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $COLL.remove(...)
              - metavariable-pattern:
                  metavariable: $COLL
                  patterns:
                    - pattern-either:
                        - pattern: $F
                        - pattern: this.$F
