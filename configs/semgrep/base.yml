# dev-guardian Semgrep config base.
# Multi-linguagem. Detalhe em https://semgrep.dev/p/owasp-top-ten
rules:
  # ============== SECRETS COMMITED ==============
  - id: hardcoded-aws-key
    pattern-regex: 'AKIA[0-9A-Z]{16}'
    message: Possível AWS Access Key hardcoded.
    severity: ERROR
    languages: [generic]

  - id: hardcoded-private-key
    pattern-regex: '-----BEGIN (RSA |DSA |EC |OPENSSH )?PRIVATE KEY-----'
    message: Chave privada hardcoded no código.
    severity: ERROR
    languages: [generic]

  # ============== JS/TS ==============
  # `new Function(...)`, não `new Function($X)`: a forma canónica do construtor
  # nomeia os parâmetros primeiro e passa o corpo no último argumento
  # (`new Function('a', 'b', body)`), pelo que a variante de um só argumento —
  # a única que `$X` apanhava — é a rara. Medido: 0 findings na forma de três
  # argumentos antes desta alteração.
  - id: js-eval-of-user-input
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
    message: Uso de eval/new Function. Evitar sempre que possível — risco de RCE se o argumento vier de input externo.
    severity: WARNING
    languages: [javascript, typescript]

  - id: js-insecure-randomness
    pattern: Math.random()
    message: Math.random() não é criptograficamente seguro. Para tokens/IDs sensíveis usa crypto.randomBytes ou crypto.getRandomValues.
    severity: INFO
    languages: [javascript, typescript]

  - id: js-document-write
    pattern-either:
      - pattern: document.write($X)
      - pattern: document.writeln($X)
    message: document.write/writeln é vetor de XSS quando $X contém input não-sanitizado.
    severity: WARNING
    languages: [javascript, typescript]

  - id: js-dangerouslySetInnerHTML
    pattern: |
      <$EL dangerouslySetInnerHTML={...} />
    message: dangerouslySetInnerHTML — verificar que o HTML é sanitizado (DOMPurify recomendado).
    severity: WARNING
    languages: [javascript, typescript]

  # ============== Python ==============
  - id: py-eval-exec
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
    message: eval/exec — risco de RCE se input vier de fora.
    severity: ERROR
    languages: [python]

  - id: py-shell-true
    pattern: subprocess.$F(..., shell=True, ...)
    message: subprocess com shell=True é injetável. Passa lista de args em vez de string.
    severity: WARNING
    languages: [python]

  - id: py-yaml-load
    pattern: yaml.load($X)
    message: yaml.load() sem Loader é inseguro (RCE). Usa yaml.safe_load().
    severity: ERROR
    languages: [python]

  - id: py-pickle-load
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
    message: pickle deserialization de dados não-confiáveis é RCE direto. Considera JSON.
    severity: WARNING
    languages: [python]

  # ============== PHP / WordPress ==============
  - id: php-eval
    pattern: eval($X)
    message: eval() em PHP — risco crítico de RCE.
    severity: ERROR
    languages: [php]

  - id: php-sql-injection-direct
    pattern-either:
      - pattern: mysql_query($X . $Y)
      - pattern: mysqli_query($CONN, $X . $Y)
    message: Concatenação direta em SQL query — usa prepared statements.
    severity: ERROR
    languages: [php]

  # Esta regra esteve MORTA desde que foi escrita: `echo $_GET[$X]` não é PHP
  # parsável (falta o terminador da instrução), pelo que falhava a compilar e
  # nunca chegou a fazer match em nada. Medida contra um ficheiro com um
  # `echo $_GET['name'];` real: results 0, errors 1, exit 2.
  #
  # A reescrita não tem lista de funções de escape, e isso é deliberado: o que
  # a regra emite é um superglobal EM CRU no caminho de output, seja como
  # argumento inteiro, operando literal de uma concatenação ou interpolação.
  # Assim que o valor passa por uma chamada — esc_html(), wp_kses(), intval()
  # ou um escapador da própria casa — deixa de haver match, sem que nenhuma
  # lista tenha de o prever. O `pattern-inside: echo $A . $B;` é o que mantém
  # a ramificação da concatenação fora de `echo esc_html($a . $_GET['b']);`.
  #
  # O `metavariable-regex` é carga estrutural, não cosmética: `$SUPER[...]`
  # sozinho apanha QUALQUER acesso a array, e sem ele todo o
  # `echo $row['title'];` de todos os templates WordPress do mundo passava a
  # ser um finding ERROR. Há near-misses em fixtures precisamente para isso.
  #
  # FALSO POSITIVO CONHECIDO, medido e fixado em
  # `mcp/test/fixtures/base/known-false-positives/output.php`: um superglobal
  # concatenado DENTRO de uma chamada de escape que por sua vez é operando de
  # outra concatenação — `echo esc_html($a . $_GET['b']) . "x";`. Não é
  # corrigível na sintaxe do Semgrep OSS, porque `echo` é um nó de CHAMADA na
  # AST de PHP e qualquer exclusão que apanhe o escapador apanha o echo também.
  - id: wp-unescaped-output
    patterns:
      - pattern-either:
          - pattern: echo $SUPER[...];
          - pattern: print $SUPER[...];
          - pattern: 'echo "...{$SUPER[...]}...";'
          - patterns:
              - pattern-either:
                  - pattern-inside: echo $A . $B;
                  - pattern-inside: print $A . $B;
              - pattern-either:
                  - pattern: $X . $SUPER[...]
                  - pattern: $SUPER[...] . $X
      - metavariable-regex:
          metavariable: $SUPER
          regex: '^\$_(GET|POST|REQUEST)$'
    message: Output direto de input do utilizador ($SUPER) — XSS. Usa esc_html(), esc_attr(), esc_url() ou wp_kses().
    severity: ERROR
    languages: [php]
