# dev-guardian Semgrep config bugfix-cs.
# Bugs de implementação em C#. É a linguagem mais vazia de toda a sequência, e
# desta vez o número é ZERO: o `p/r2c-bug-scan` reporta `paths.scanned = 0`
# nestas fixtures porque não traz UMA regra de C#, e o `p/csharp` e o
# `p/security-audit` varrem os ficheiros e não encontram nada. Cada regra deste
# ficheiro é aditiva por medição, com controlo positivo, e não por suposição.
# As medições estão em
# docs/superpowers/specs/2026-08-20-bugfix-rules-csharp-design.md.
#
# Cada regra tem um par de fixtures em
# mcp/test/fixtures/bugfix-cs/{hits,misses}/: um ficheiro que tem de disparar a
# regra, outro parecido que NAO pode. O ficheiro misses/ é a especificação do
# que é código correto — se ele disparar, a regra é que está errada. E todas as
# fixtures COMPILAM: `dotnet build` com `0 Error(s)`. A ronda de Go despachou
# uma regra cuja fixture de hit não era Go compilável, o que punha o conjunto
# de verdadeiros positivos a zero em qualquer projeto que construa.
#
# ---------------------------------------------------------------------------
# ESCREVA SEMPRE `var` NUM PADRAO DE C#. É a sexta forma de falha silenciosa
# desta série e a PRIMEIRA que o `paths.scanned` nao apanha.
#
# `$T $V = ...` só casa declarações com tipo EXPLICITO. `var x = ...` é outro
# nó, e é como quase todo o C# se escreve. Medido na sondagem:
# `foreach ($T $X in $C)` encontrou 0 de 5 bugs reais; `foreach (var $X in $C)`
# encontrou os cinco. O scan corre, os ficheiros sao varridos, os erros sao
# zero, e a resposta é 0. Uma regra portada do pack de Java por analogia
# textual nao encontra nada com todos os indicadores verdes.
#
# OUTRAS ARMADILHAS MEDIDAS:
#
# - `metavariable-regex` está ancorada no INICIO. `regex: "Async$"` nao casou
#   nada em `GetDataAsync`, sem erro e sem aviso. Use `".*Async"`. O
#   `^(?!...$)` deste ficheiro funciona por já estar ancorado no início.
# - Um `pattern-either` cujo ramo só tem `metavariable-type` carrega ZERO
#   regras no ficheiro inteiro. Repita o termo positivo em todos os ramos.
# - `try { ... } catch (...) { }` NAO faz parse: nao existe um wildcard de
#   "qualquer catch". Por isso a regra de catch vazio tem tres ramos.
# - Um `catch ($E $V) { ... }` sem `try` faz parse e nao casa nada — silencioso.
#
# - UM `finally` FINAL TORNA O `try` INVISIVEL, e por isso a FORMA DO TRY é
#   uma DIMENSAO das duas regras deste ficheiro, nao um detalhe. Medido, e nao
#   estava no design: o padrao `try { ... } catch (...) { ... }` NAO casa um
#   `try { ... } catch (...) { ... } finally { ... }`, e o padrao com
#   `finally` só casa esse. Os dois sao DISJUNTOS — nenhum contém o outro —,
#   por isso a correção é enumerar ambos e nao alargar um.
#
#   Foi o ORACULO INDEPENDENTE que o apanhou, e é o melhor argumento que este
#   pack tem para ter um: o `dotnet build` emitia CA2200 num `throw ex;` cujo
#   catch tinha um `finally` a seguir e o Semgrep nao emitia nada. Um falso
#   negativo, confirmado por uma segunda opiniao, e nao um falso positivo
#   evitado de propósito. Sem o CA2200 tinha passado — as fixtures originais
#   nao tinham a forma, e uma fixture que nao tem a forma nunca a testa.
#
#   Custo da correção: 3 ramos em vez de 1 na `empty-catch` (tres grafias de
#   catch x duas formas de try) e um `pattern-either` de dois
#   `pattern-inside` na `rethrow-loses-stacktrace`. O `try { ... } finally
#   { ... }` SEM catch continua a nao casar nada, medido — o `finally { }`
#   vazio nao é confundido com um catch vazio.
#
#   ESTAVA NA FAMILIA, e a família é mais estreita do que parecia: o pack de
#   JS/TS e o de Python fecharam o mesmo buraco na véspera (o de Python pela
#   mesma via, um produto cartesiano de {handler} x {try, try+finally,
#   try+else}). O de Java ainda o tem, e é de lá que este port o herdou; está
#   a ser corrigido em separado.
#
# ---------------------------------------------------------------------------
# CINCO CARACTERES SAO PROIBIDOS NESTE FICHEIRO, incluindo nos comentários: o A
# maiúsculo com acento agudo (U+00C1), o I maiúsculo com acento agudo (U+00CD),
# e mais tres que o português nao usa (U+00CF, U+00D0, U+00DD). Em português,
# na prática, sao dois — e é por isso que este bloco escreve "NAO" e "SAO" sem
# acento.
#
# Porque: o carregador de configuração do Semgrep descodifica este ficheiro com
# o codec do LOCALE e nao em UTF-8. Num locale cp1252 (Windows) os bytes 0x81,
# 0x8D, 0x8F, 0x90 e 0x9D nao existem na tabela, e sao exatamente os segundos
# bytes UTF-8 desses cinco caracteres. UM deles num comentário derruba o
# ficheiro inteiro, e o scan devolve `results: 0`, `paths.scanned: 0` e
# `errors: 0` — quem leia só os findings ve um scan limpo. O
# `semgrepPacks.test.ts` apanha isto em todos os packs, por duas vias.
#
# Todas as outras maiúsculas acentuadas do português passam, medidas uma a uma:
# A-til, A-grave, A-circunflexo, E-agudo, E-circunflexo, O-agudo,
# O-circunflexo, O-til, U-agudo e C-cedilha. E todas as minúsculas passam.
#
# ---------------------------------------------------------------------------
# TRES PALAVRAS SAO PROIBIDAS NOS IDS, e nao as duas do pack de Java:
#
#   `unchecked`  — a regex de error_handling casa-a, e em C# é uma palavra
#                  reservada, por isso é um nome plausível para uma regra.
#   `concurren`  — a regex de race_condition casa-a e corre PRIMEIRO no
#                  if-chain; em C# é um fragmento de nome de tipo vivo
#                  (`ConcurrentDictionary`, `ConcurrentBag`).
#   `disposed`   — a regex de memory_leak casa-a e corre ANTES de
#                  error_handling, por isso um id sobre a exceção de um objeto
#                  já libertado classifica como memory_leak, em silencio.
#
# ---------------------------------------------------------------------------
# OS TIERS. UMA regra em doze fica em ERROR, e isso nao é severidade a menos.
# O critério do §4 do design é uma pergunta sobre o OUTPUT: "aquilo que a
# regra EMITE é sempre um bug?". Uma regra cuja correção depende de ter
# reconhecido uma GUARDA falha sempre que encontra uma guarda que ninguém
# enumerou, e a guarda pode estar a um método de distância.
#
# A regra que passa nessa barra é a `rethrow-loses-stacktrace`, por uma razao
# que nenhuma outra regra da série teve: a forma CORRETA do código que ela
# assinala (`throw;`) é um NO DE AST DIFERENTE. Nao há guarda para reconhecer
# porque nao há nada a guardar.
#
# A `empty-catch` esteve em ERROR ao lado dela, portada do pack de Java com o
# mesmo argumento: a válvula de escape nao seria uma guarda mas uma DECLARACAO
# DE INTENCAO escrita no nome da variável, que a própria regra le. Medida
# contra código externo, a premissa cai, e cai em C# de forma mais completa do
# que em qualquer outra linguagem da série. Corpus: `dotnet/runtime`, ramo
# principal do dia, `src/libraries/*/src/**`, 11 800 ficheiros varridos,
# nenhum deles escrito ou escolhido por quem escreveu estas regras.
#
#   402 findings em 233 ficheiros.
#   374 deles — 93 % — estao escritos `catch (Tipo) { }` ou `catch { }`: NAO
#     TEM IDENTIFICADOR NENHUM a que uma convenção de nomes se possa agarrar.
#     É o mesmo buraco estrutural que o optional catch binding do ES2019 abriu
#     em JS/TS, só que aqui as duas grafias sem nome sempre existiram.
#   28 ligam um nome, e NENHUM deles é `ignore`, `ignored` ou `expected`
#     (os mais frequentes sao `ex` com 15 e `e` com 5).
#   Uma sonda com a regex invertida confirma-o pelo outro lado: `ignore` /
#     `ignored` / `expected` aparecem em ZERO catches vazios nos 11 800
#     ficheiros. A convenção nao tem adesão nenhuma em C#; é a de Java.
#   140 dos 402 trazem um COMENTARIO explicativo dentro do catch vazio — um
#     bloco só com comentário é vazio para a AST —, e mais 46 trazem-no na
#     linha imediatamente antes do `try`. Amostra de cerca de 45 lidos um a
#     um: a esmagadora maioria é deliberada.
#
# E HA UM ORACULO INDEPENDENTE, como para a `rethrow-loses-stacktrace`: o
# compilador. `catch (FormatException ignored) { }` — a grafia que a mensagem
# desta regra prescreve — emite **CS0168, "The variable 'ignored' is declared
# but never used"**. `catch (FormatException) { }` e `catch { }` compilam sem
# um aviso. A saída de emergencia da regra é exatamente a grafia que o
# compilador de C# desaconselha, o que explica os 0 em 11 800 sem recorrer a
# gosto ou a cultura. Medido com `dotnet build` em `mcr.microsoft.com/dotnet/
# sdk:8.0`.
#
# A exclusão por nome fica onde está — é a única forma de silenciar um caso em
# código em vez de com `// nosemgrep` —, mas nao sustenta um tier.
#
# CONSEQUENCIA: o parser do Semgrep mapeia ERROR -> `high` e WARNING ->
# `medium`, e o `create_fix_pr` tem `severity_min` a `high` por omissao. Quem
# quiser as regras em WARNING corrigidas tem de pedir `severity_min: "medium"`.
# O `bug_hunt` nao filtra por omissao, por isso nada desaparece de um scan.
#
# ---------------------------------------------------------------------------
# O EIXO 3 DA ABLACAO SINALIZA TODOS OS RAMOS POSITIVOS VIVOS DESTE PACK, e
# quem ler o relatório sem saber disto conta onze defeitos onde nao ha nenhum.
# Triado a 2026-08-21, os onze, um a um, com as linhas lidas — §4b do desenho.
#
# O eixo 3 diz "esta clausula ACRESCENTA findings ao seu próprio rule em código
# real". Um ramo de um `pattern-either` que casa alguma coisa faz exatamente
# isso, por construção: é para isso que la esta. Cinco das onze regras deste
# pack sao `pattern-either` de ramos positivos disjuntos, sem exclusao nenhuma,
# por isso CADA ramo que dispare em `dotnet/runtime` chega ao relatório
# sinalizado. Medido: as contagens por ramo sao aditivas e reconstroem o total
# da regra ao finding (a `empty-catch` parte-se em 28 + 214 + 15 + 145 + 8).
# Um pack sem falso positivo nenhum daria os mesmos onze sinais.
#
# O QUE ISTO NAO QUER DIZER: que os findings estejam certos. O sinal é uma
# ATRIBUICAO, e a leitura é que decide. Dos onze, tres carregam populações de
# falsos positivos e estao anotadas na regra respetiva:
#
#   `blocking-on-task`, ramo `$V.Result`  — 52 de 52 sao Tasks ja completas.
#   `ordefault-deref`, ramo `FirstOrDefault` — 1 de 1, e é o tipo por valor.
#   `off-by-one-lte-length`, ramo `$I++` — 2 de 2 eram ciclos sentinela, e
#       essa fechou-se: a exclusao esta na regra e a contagem foi a zero.
#
# As outras oito sao a regra a trabalhar. O que separa os dois casos nao é o
# verdicto, é ler os ficheiros.
# ---------------------------------------------------------------------------
rules:
  # ERROR, e é a única regra desta série cuja forma correta nao é uma guarda
  # mas outro nó da AST. `throw ex;` dentro de um `catch (E ex)` reescreve
  # Exception.StackTrace a partir do ponto do relançamento: o frame que
  # realmente falhou desaparece antes de alguém o registar. `throw;` preserva-o.
  #
  # ESTA REGRA DUPLICA A TOOLCHAIN, NAO O REGISTRY, e o design di-lo sem
  # rodeios: o `dotnet build` avisa disto por omissao como CA2200. Ganha o seu
  # lugar por duas razões — o dev-guardian varre sem construir (nao precisa do
  # SDK, das dependencias restauradas nem de um projeto que compile), e um
  # aviso de compilador que passa a correr no ecra nao é um finding com
  # fingerprint, baseline e histórico.
  #
  # E é por isso que esta é a única regra do pack com um ORACULO INDEPENDENTE.
  # Medido: o CA2200 dispara exatamente nos 8 sítios da fixture de hits e em
  # nenhum outro, e zero vezes na fixture de misses. A divisao hits/misses nao
  # foi avaliada por quem escreveu a regra.
  #
  # FORA DAS FIXTURES OS DOIS AINDA DIVERGEM, e vale mais a pena dize-lo do
  # que deixar o acordo perfeito sugerir que sao equivalentes:
  #   - `throw ex;` dentro de um lambda declarado no catch: esta regra dispara,
  #     o CA2200 nao — o analisador do Roslyn ignora funções anónimas porque o
  #     lançamento pode acontecer fora do contexto do catch. Continua a
  #     reescrever a stack trace, por isso o falso negativo é do CA2200.
  #
  # A divergencia no OUTRO sentido — o `finally` — era nossa e está fechada.
  # Ver o cabeçalho: foi o CA2200 que a encontrou.
  #
  # O `pattern-inside` e a unificação de `$V` sao ambos indispensáveis, e cada
  # um tem a sua near-miss: sem o `pattern-inside` dispara em
  # `ThrowOutsideCatch`, onde a exceção é guardada no catch e relançada FORA
  # dele; sem a unificação de `$V` dispararia no `throw;` correto que está na
  # linha seguinte ao bug, dentro do mesmo statement, em `FirstOfTwo`.
  #
  # ZERO EM 11 800 FICHEIROS DE `dotnet/runtime`, E ESTA CERTO — verificado em
  # 2026-08-21 com um ORACULO INDEPENDENTE em vez de uma suposição, porque um
  # zero tem duas leituras opostas. A regra espelha o `CA2200` do compilador e
  # o `dotnet/runtime` constrói limpo, por isso o zero era o esperado; o que
  # nao se pode fazer é aceitar isso sem medir. Duas medições:
  #
  #   1. a regra continua a disparar 10 vezes nas suas próprias fixtures
  #      (9 em `hits/Rethrow.cs` + 1 em `hits/RealBugs.cs`);
  #   2. um varrimento textual do corpus, com contagem de chavetas e sem
  #      Semgrep nenhum, encontra 201 `throw <identificador>;` e ZERO em que o
  #      identificador seja o da variavel do `catch` que o envolve. O mesmo
  #      varrimento sobre as fixtures encontra os 10 — controlo positivo.
  #
  # A regra e o oraculo concordam. §4c do desenho tem os números.
  - id: bugfix-cs-error-handling-rethrow-loses-stacktrace
    patterns:
      - pattern: throw $V;
      - pattern-either:
          - pattern-inside: try { ... } catch ($E $V) { ... }
          - pattern-inside: try { ... } catch ($E $V) { ... } finally { ... }
    message: >-
      `throw ex;` dentro de um catch reinicia a stack trace no ponto do
      relançamento, por isso o frame que realmente falhou desaparece do log.
      Use `throw;` para relançar preservando a origem, ou
      `throw new MinhaExcecao(mensagem, ex)` para embrulhar sem perder nada.
    severity: ERROR
    languages: [csharp]

  # ERROR, pela mesma razao que no pack de Java: a válvula de escape nao é uma
  # guarda. O Semgrep casa a AST e os comentários nao estao lá, por isso um
  # catch documentado como ignorado de propósito é byte a byte igual a um que
  # engole a falha em silencio — o comentário nunca podia ser a válvula. O NOME
  # pode, e já é a convenção dos linters standard: `ignore` e `expected` do
  # Checkstyle, `ignored` do IntelliJ. O Roslyn nao tem equivalente por
  # omissao, por isso o vocabulário é herdado do pack de Java e nao de uma
  # ferramenta de C#. Medido: `e`, `ex`, `ignoreMe` e `expectedly` continuam a
  # disparar — a regra ganha vocabulário, nao perde força.
  #
  # SEIS PADROES, e nao um. Sao duas dimensões independentes multiplicadas:
  # tres grafias de catch x duas formas de try.
  #
  #   grafias: `catch (E v) { }`, `catch (E) { }` sem identificador, `catch { }`
  #            nu. As duas últimas nao existem em Java, e um port de ramo único
  #            perde-as: 1 hit em vez de 8. Nao há wildcard que resolva —
  #            `try { ... } catch (...) { }` nao faz parse.
  #   try:     com e sem `finally`. Nós diferentes da AST, disjuntos, medidos.
  #
  # A `metavariable-regex` é escrita UMA vez, sobre um `pattern-either`
  # interno com as duas formas de try nomeadas, em vez de copiada para cada
  # uma. A near-miss `IgnoredNameWithFinally` é o que distingue as duas
  # montagens: com a regex copiada e uma das cópias em falta, só ela dispara.
  #
  # Só as grafias com nome levam a exclusão, e isso é correto e nao um
  # descuido: um `catch (Exception) { }` sem identificador nao tem onde
  # declarar a intenção, e um `catch { }` nu ainda menos — quem quer a isenção
  # escreve o nome.
  #
  # E É POR ISSO QUE ESTA REGRA ESTA EM WARNING e nao em ERROR: em
  # `dotnet/runtime`, 374 dos 402 findings estao escritos numa dessas duas
  # grafias sem nome, e a grafia com nome que a regra premeia emite CS0168 no
  # compilador. Quem escreve C# idiomático nao tem como usar a isenção. O
  # bloco OS TIERS, no cabeçalho, tem os números e o oráculo.
  #
  # OS SETE SINAIS DO EIXO 3 SAO OS SETE RAMOS DESTA REGRA, e nao ha oitavo:
  # a regra é um `pattern-either` de ramos positivos disjuntos e todos disparam
  # em `dotnet/runtime`, por isso todos sao atribuídos. Medido a 2026-08-21,
  # ramo a ramo, no corpus inteiro:
  #
  #   `catch ($E $V) { }`             23   |  `catch ($E) { }`            214
  #   `catch ($E $V) { } finally`      5   |  `catch ($E) { } finally`     15
  #   (o ramo composto com a regex)   28   |  `catch { }`                 145
  #                                        |  `catch { } finally`           8
  #
  # 28 + 214 + 15 + 145 + 8 = 410, e o total da regra no mesmo varrimento é
  # 407: os ramos particionam a saída e a diferença sao ficheiros que o Semgrep
  # abandonou por tempo entre varrimentos. Nao ha aqui clausula a acrescentar
  # ruído — ha uma regra a fazer o que diz.
  #
  # E OS 28 COM NOME EXPLICAM-SE, o que o bloco OS TIERS mediu mas nao soube
  # ler: **26 dos 28 sao `catch (Tipo v) when (<filtro>) { }`**. O nome nao
  # esta la por convenção nenhuma — esta la porque o FILTRO precisa dele
  # (`when (ex is IOException or UnauthorizedAccessException)`). Por isso é que
  # nenhum se chama `ignore`/`ignored`/`expected`, e por isso é que nenhum
  # emite CS0168: a variável é usada. Os dois restantes sao os únicos catches
  # vazios do corpus que ligam um nome e nao o usam para nada.
  #
  # E O C# TEM ENTAO UMA DECLARACAO DE INTENCAO QUE O JAVA NAO TEM, mais forte
  # do que um nome: o filtro enumera, em código e verificado pelo compilador,
  # exatamente que exceções estao a ser engolidas. A regra NAO O LE, e o
  # Semgrep casa `catch ($E $V) { }` com um catch filtrado como se o filtro nao
  # existisse — medido, é assim que os 26 chegam aqui.
  #
  # DELIBERADAMENTE NAO EXCLUIDO. A regra ja decidiu esta questao quando desceu
  # de ERROR para WARNING: os 402 sao na esmagadora maioria deliberados e a
  # regra reporta-os na mesma, porque deliberado e silencioso continua a ser
  # silencioso — um filtro diz QUE exceção se engole, nao diz que a falha
  # aparece em lado nenhum. Excluir os filtrados seria aplicar a um subconjunto
  # o critério que o tier ja rejeitou para o conjunto. Fica medido e escrito
  # para o próximo leitor nao voltar a abrir.
  #
  - id: bugfix-cs-error-handling-empty-catch
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: try { ... } catch ($E $V) { }
              - pattern: try { ... } catch ($E $V) { } finally { ... }
          - metavariable-regex:
              metavariable: $V
              regex: ^(?!(ignore|ignored|expected)$)
      - pattern: try { ... } catch ($E) { }
      - pattern: try { ... } catch ($E) { } finally { ... }
      - pattern: try { ... } catch { }
      - pattern: try { ... } catch { } finally { ... }
    message: >-
      Catch vazio. A exceção foi apanhada e deitada fora sem log, sem rethrow e
      sem tratamento, por isso a falha desaparece e o código segue como se nada
      fosse. Registe no logger, trate, ou relance com `throw;`. Se o silencio
      for mesmo deliberado, declare-o no nome: `catch (FormatException ignored)`
      — note que o compilador emite CS0168 para um binding por usar.
    severity: WARNING
    languages: [csharp]

  # ---------------------------------------------------------------------------
  # race_condition — quatro regras, todas WARNING. O C# suporta esta classe
  # melhor do que qualquer linguagem da série até aqui, e as quatro ficam em
  # WARNING pela mesma razao: aquilo que emitem é código correto sempre que
  # existe uma guarda que a regra nao consegue ver. `async void` está certo num
  # event handler; `.Wait()` está certo quando nada acima de nós segura um
  # contexto; um `static Random` está certo num programa de uma só thread;
  # `lock (this)` está certo se mais ninguém trancar a instancia. Nenhuma
  # dessas condições é visível a um matcher sintático.
  # ---------------------------------------------------------------------------

  # `async void` fora de um event handler. O método nao devolve Task nenhuma,
  # por isso a máquina de estados gerada pelo compilador nao tem onde pousar a
  # exceção: um throw depois do primeiro `await` é relançado no
  # SynchronizationContext capturado — ou, sem contexto, numa thread do pool —
  # e derruba o processo. Quem chama nao pode esperar por ele, nao o pode
  # observar e nao o pode apanhar.
  #
  # A EXCLUSAO E A CONVENCAO DOS EVENT HANDLERS, `(object sender, TArgs e)`, e
  # a forma como está escrita foi MEDIDA e CONTRARIA O DESIGN. O design dizia
  # que um `pattern-not` com o nome `EventArgs` literal fechava os dois
  # handlers da fixture correta. Nao fecha:
  #
  #   - `pattern-not: async void $M(object $S, EventArgs $E) { ... }` fecha
  #     APENAS o handler tipado exatamente com `EventArgs`. O handler com
  #     `ElapsedArgs`, derivado, continuava a disparar.
  #   - `metavariable-type: EventArgs` no parametro TAMBEM nao o fecha: nao é
  #     sensível a subtipos aqui. Medido, nao suposto.
  #   - ligar o tipo a uma metavariável — `(object $S, $T $E)` — fecha os dois.
  #
  # E isto importa porque o caso derivado é o caso NORMAL: `ElapsedEventArgs`,
  # `PropertyChangedEventArgs`, `MouseEventArgs` e todas as instanciações de
  # `EventHandler<T>` sao subclasses, e nao `EventArgs`. A versao do design
  # deixava passar praticamente todos os handlers reais.
  #
  # CUSTO, dito em vez de escondido: qualquer `async void $M(object, X)` fica
  # excluído, com X seja o que for. E aceitável porque essa assinatura de dois
  # parametros com `object` a abrir E a convenção de handler do .NET, mas um
  # `async void Processa(object payload, Config c)` também escapa.
  - id: bugfix-cs-race-condition-async-void
    patterns:
      - pattern: async void $M(...) { ... }
      - pattern-not: async void $M(object $S, $T $E) { ... }
    message: >-
      `async void` fora de um event handler. O método nao devolve Task, por
      isso quem chama nao consegue esperar por ele nem apanhar a exceção — um
      throw depois do primeiro `await` sobe pela via de exceção nao tratada e
      derruba o processo. Devolva `Task`.
    severity: WARNING
    languages: [csharp]

  # Bloquear numa Task. Faz deadlock sempre que a continuação precisa do
  # contexto que a chamada bloqueante está a segurar — o clássico pendurar do
  # ASP.NET e do WinForms — e embrulha a exceção numa AggregateException, por
  # isso o `catch` escrito para o tipo real deixa de casar.
  #
  # QUATRO RAMOS, e a regra SO existe nesta forma. Esta é a regra que a fixture
  # de misses DESENHOU, em vez de apenas verificar depois. A versao ingénua,
  # `$V.Result` / `$V.Wait()` sem tipo, dispara em QUATRO trechos de código
  # correto, todos medidos:
  #
  #   - um POCO com uma propriedade `bool Result` — `Result` é um bom nome para
  #     o resultado de uma validação;
  #   - `Match.Result(string)`, que é um METODO REAL da BCL (expande um padrao
  #     de substituição). Este é o que mais ensina: prova que `$V.Result` casa
  #     o RECETOR DE UMA CHAMADA e nao só a leitura de uma propriedade, por
  #     isso a superfície de falsos positivos é maior do que "objetos com uma
  #     propriedade Result";
  #   - `SemaphoreSlim.Wait()`, bloqueio correto e intencional;
  #   - `CountdownEvent.Wait()`, que nem sequer tem forma assíncrona.
  #
  # `metavariable-type: Task` mata os quatro — e mata também
  # `GetAsync().Result`, que é a grafia MAIS COMUM do bug. Daí os dois ramos de
  # recuperação por NOME, `$F(...).Result` e `$F(...).Wait()` com
  # `metavariable-regex: ".*Async"`. Note-se `.*Async` e nao `Async$`: a regex
  # está ancorada no INICIO, e `"Async$"` nao casou nada em `GetDataAsync`, sem
  # erro e sem aviso.
  #
  # O `$F` liga o nome PONTUADO INTEIRO, medido: `_source.LoadAsync(2).Result`
  # casa `.*Async` como um só token, por isso estes ramos nao precisam de um
  # gémeo qualificado como as regras de mapa do pack de Java precisam.
  #
  # DOIS FALSOS NEGATIVOS MEDIDOS, declarados em vez de implícitos:
  #
  #   1. A FORMA EM DOIS PASSOS: `var t = GetAsync(); t.Result`. O
  #      `metavariable-type: Task` NAO resolve através de `var` mais um
  #      inicializador que seja uma CHAMADA — embora resolva através de `var`
  #      mais um `new` (medido: `var t = new Task<int>(...)` dispara). E por
  #      isso que as fixtures de hit usam `Task<int> t = ...` explícito.
  #   2. `Task.Run(() => 1).Result`. O nome `Run` nao casa `.*Async` e o
  #      recetor nao é uma variável tipada, por isso escapa aos quatro ramos.
  #      Precisaria de um ramo literal próprio, que nao foi acrescentado.
  #   3. O RECETOR PONTUADO: `_source.Pending.Wait()`, em que a Task é uma
  #      propriedade de outro objeto. O `metavariable-type` resolve um local,
  #      um parametro ou um campo simples, mas nao um acesso a membro
  #      pontuado. Medido na própria fixture de hits, que por isso usa um
  #      campo `Task` direto. Repare-se na assimetria com os ramos por nome,
  #      onde `$F` liga o nome pontuado inteiro sem dificuldade: é o
  #      `metavariable-type` que nao resolve, nao o padrao que nao casa.
  #
  # Nenhum dos tres está em misses/. Sao bugs a sério que a regra nao apanha, e
  # uma fixture de miss a afirmar zero fa-los-ia passar por decisao.
  #
  # ---------------------------------------------------------------------------
  # 52 DE 52 SAO FALSOS POSITIVOS EM `dotnet/runtime`, e a população foi lida
  # INTEIRA e nao por amostragem. Eixo 3 da ablação, 2026-08-21. Os quatro
  # ramos da regra nao pesam o mesmo em código real: o `$V.Result` com
  # `metavariable-type: Task` produz os 52, e os outros tres — `.Wait()` por
  # tipo, `.Result` e `.Wait()` por nome `.*Async` — produzem ZERO. A saída da
  # regra neste corpus é um ramo só, e esse ramo nao acertou uma vez.
  #
  # SAO TODOS A MESMA COISA: um `.Result` sobre uma Task que ja se sabe
  # completa naquele ponto. Nao ha deadlock possível — o `.Result` de uma Task
  # completa devolve o valor sem bloquear nada. As formas contadas:
  #
  #   `if (t.IsCompletedSuccessfully)` / `IsCompleted` / o helper `IsSuccess()`
  #     do XML, e as mesmas em ternário  .................... cerca de 20
  #   `case TaskStatus.RanToCompletion:` num switch sobre o estado  ..... ~10
  #   `_parseText_dummyTask.Result`, uma Task-cache ja concluída  ......... 9
  #   `Debug.Assert(t.Status == TaskStatus.RanToCompletion)` antes  ....... 4
  #   um `await` da mesma Task na instrução anterior  ..................... 4
  #   `Task.FromResult(...)`, `RunSynchronously`, `Wait(timeout)` com o
  #     resultado testado antes  .......................................... 5
  #
  # NAO ESTREITAVEL, e a razao é a mesma que apagou a `as-cast-deref`: a
  # premissa que distingue os dois casos — "esta Task ja esta completa AQUI?" —
  # é uma propriedade de fluxo de dados e nao um no da AST. As nove do
  # `_parseText_dummyTask` provam-no sozinhas: nao ha guarda nenhuma a
  # reconhecer, a Task ja nasceu completa noutro ficheiro. Uma exclusao por
  # guarda apanharia talvez metade, custaria seis clausulas, e cada uma delas
  # precisaria da sua fixture ou lia-se DEAD na ablação seguinte.
  #
  # E A REGRA FICA, com o corpus declarado como PARCIAL e nao como veredicto.
  # `dotnet/runtime` é a canalização assíncrona do próprio .NET: o idioma
  # "caminho rápido quando a Task ja esta completa" é o que aquele código faz
  # todo o dia, e é o pior sitio possível para medir esta regra. O `.Result`
  # que faz deadlock a sério esta em código de APLICACAO — um controlador
  # ASP.NET, um handler de WinForms — que este corpus nao tem. Dizer "52 de 52
  # falsos num corpus enviesado" é o que se mediu; dizer "a regra nao serve"
  # seria dizer mais do que se mediu.
  # ---------------------------------------------------------------------------
  - id: bugfix-cs-race-condition-blocking-on-task
    pattern-either:
      - patterns:
          - pattern: $V.Result
          - metavariable-type:
              metavariable: $V
              type: Task
      - patterns:
          - pattern: $V.Wait()
          - metavariable-type:
              metavariable: $V
              type: Task
      - patterns:
          - pattern: $F(...).Result
          - metavariable-regex:
              metavariable: $F
              regex: ".*Async"
      - patterns:
          - pattern: $F(...).Wait()
          - metavariable-regex:
              metavariable: $F
              regex: ".*Async"
    message: >-
      Bloqueio numa Task com `.Result` ou `.Wait()`. Faz deadlock quando a
      continuação precisa do contexto que esta chamada segura, e embrulha a
      exceção numa AggregateException, por isso o catch escrito para o tipo
      real deixa de apanhar. Use `await`.
    severity: WARNING
    languages: [csharp]

  # `Random` tem estado interno mutável e está documentado como nao sendo
  # thread-safe. Duas threads dentro de `Next()` ao mesmo tempo corrompem esse
  # estado, e o sintoma nao é uma exceção — é uma sequencia de valores iguais,
  # ou uma sequencia de zeros. E o tipo de defeito que chega a produção e
  # depois nao se reproduz numa thread só.
  #
  # UM SO PADRAO, e foi medido que chega: `static $T $F = new Random(...)` casa
  # `static readonly Random` e `static Random` porque o Semgrep casa
  # modificadores por SUBCONJUNTO. Um segundo ramo com o tipo escrito por
  # extenso seria uma clausula morta.
  #
  # E O UNICO SITIO DESTE FICHEIRO ONDE `$T` ESTA CERTO E `var` ESTARIA ERRADO:
  # em C# um campo nao pode ser declarado `var`, por isso a forma explícita nao
  # é aqui a forma estreita — é a única que existe. A regra do `var` aplica-se
  # a locais e a `foreach`, nao a campos.
  #
  # NAO HA ORACULO PARA ESTA REGRA, e convém dize-lo porque há um candidato que
  # parece um: o CA5394 ("Do not use insecure randomness") dispara nas duas
  # fixtures de hit — e também nos QUATRO sítios corretos da fixture de misses,
  # incluindo o `Random.Shared`. Nao está a medir a mesma coisa: o CA5394 é
  # sobre previsibilidade criptográfica, esta regra é sobre uma corrida entre
  # threads. Um `Random.Shared` é seguro para esta regra e continua inseguro
  # para o CA5394. Tratá-lo como segunda opiniao seria ler concordancia onde
  # nao existe sequer o mesmo assunto.
  - id: bugfix-cs-race-condition-static-random
    pattern: static $T $F = new Random(...);
    message: >-
      `Random` estático partilhado entre threads. O `Random` nao é thread-safe:
      chamadas concorrentes a `Next()` corrompem o estado interno e produzem
      sequencias repetidas ou zeros. Use `Random.Shared` (.NET 6+) ou uma
      instancia por thread.
    severity: WARNING
    languages: [csharp]

  # Trancar num monitor que outro código também consegue trancar. O
  # `lock (this)` expõe o monitor a quem tenha uma referencia para o objeto,
  # sem que a assinatura do tipo o diga em lado nenhum. O `lock ("literal")` é
  # pior: os literais de string sao INTERNADOS, por isso o monitor é partilhado
  # por todo o código do processo que tranque no mesmo texto — incluindo código
  # noutro assembly que nunca ouviu falar desta classe. Os dois sao deadlocks a
  # espera de um segundo participante.
  #
  # Sem falsos positivos: um `lock` num campo `object` privado, que é a forma
  # correta, nao casa nenhum dos dois ramos. Um campo `static readonly object`
  # também nao — o que torna o `lock (this)` errado nao é ser partilhado, é ser
  # ALCANCAVEL de fora.
  #
  # MAS O VOLUME NAO E BAIXO, e isso esteve escrito aqui ate 2026-08-21 como se
  # fosse: sao **322 findings** em 11 800 ficheiros de `dotnet/runtime`, a
  # segunda maior contagem do pack a seguir a `empty-catch`. O eixo 3 da
  # ablação atribuiu-os todos ao ramo `lock (this)`; o ramo do literal de
  # string produz ZERO no mesmo corpus, o que era de esperar e agora esta
  # medido em vez de suposto.
  #
  # LIDOS, SAO O QUE A REGRA DIZ QUE SAO. Amostra de sete, uma a uma:
  # `DbConnectionFactory` (2), `DbConnectionPoolGroup` (4) e
  # `CacheEntry.CacheEntryTokens` trancam `this` em tipos cuja referencia sai
  # do tipo — pools entregues a fabricas, entradas de cache entregues a
  # callbacks de expiração. Sao exatamente o CA2002, e o CA2002 é o oráculo
  # independente que esta regra ja tinha. Nenhum é um deadlock a acontecer; sao
  # todos um deadlock a espera de um segundo participante, que é a definição do
  # defeito e a razao do tier WARNING.
  #
  # O VOLUME E O DEFEITO, entao, e nao ruído a filtrar: `lock (this)` é um
  # idioma antigo, e uma base de código com quinze anos tem-no as centenas. O
  # que nao se pode fazer é ler 322 como se fosse um problema da regra — ela
  # nao tem clausula nenhuma para apertar, e apertar por volume seria trocar um
  # defeito medido por silencio.
  #
  # SEGUNDO ORACULO INDEPENDENTE, e é a segunda regra do pack a ter um. O
  # analisador CA2002 ("Do not lock on objects with weak identity") acerta nos
  # mesmos dois sítios da fixture de hits e em zero da de misses. Nao vem
  # ligado por omissao — é preciso `AnalysisMode=All` —, por isso nao serve de
  # gate, mas serve de segunda opiniao, que é para o que os oráculos deste pack
  # existem. Concordancia exata nas duas direções.
  - id: bugfix-cs-race-condition-lock-on-shared-instance
    pattern-either:
      - pattern: lock (this) { ... }
      - pattern: lock ("...") { ... }
    message: >-
      `lock` num monitor que código externo também alcança. Com `lock (this)`
      qualquer detentor da referencia tranca o mesmo monitor; com um literal de
      string o monitor é partilhado por todo o processo, porque os literais sao
      internados. Tranque num `private readonly object` dedicado.
    severity: WARNING
    languages: [csharp]

  # ---------------------------------------------------------------------------
  # off_by_one — duas regras, e a lista de tipos é o que as separa de um
  # gerador de falsos positivos.
  # ---------------------------------------------------------------------------

  # `i <= a.Length` corre uma posição para lá do fim, e o índice `a.Length`
  # está sempre fora dos limites.
  #
  # O `metavariable-type` é o que impede a regra de disparar num objeto de
  # domínio com um `int Length` — um segmento tem comprimento, e o ciclo
  # inclusivo pode estar certo porque conta estacas em vez de indexar. Sem a
  # restrição de tipo, a regra dispara nesse ciclo correto: é EXATAMENTE o
  # defeito que o pack de Java despachou e depois teve de fechar, reproduzido
  # aqui de propósito antes de a regra ser escrita.
  #
  # `var` NO PADRAO, e nao `$T $I`. A restrição de tipo aplica-se ao RECETOR
  # `$A`, que é outra coisa.
  #
  # E o `var` do PADRAO é um CURINGA do tipo declarado, medido em 2026-08-21
  # contra a auditoria dos zeros: `for (var $I = 0; ...)` casa
  # `for (int i = 0; ...)` tal e qual. Isto importa porque era a suspeita
  # número um quando a regra do `.Count` deu ZERO em 11 800 ficheiros de
  # `dotnet/runtime` — o C# real escreve `for (int i = 0; ...)`, quase nunca
  # `for (var i = 0; ...)`, e se o padrao fosse literal a regra estaria cega
  # com todos os indicadores verdes. Nao estava. A sondagem esta em
  # docs/superpowers/specs/2026-08-20-bugfix-rules-csharp-design.md §4c.
  #
  # DUAS DIMENSOES QUE AS FIXTURES NAO TINHAM, medidas na mesma sondagem e
  # fechadas aqui. Ambas as regras de off_by_one liam UMA grafia de cada:
  #
  #   incremento: `$I++` casa, `++$I` NAO casava. Sao nós diferentes e o
  #               `pattern-either` é a única correção — um `$INC` livre
  #               tambem apanharia `$I--` e `$I += 2`.
  #   corpo:      `{ ... }` NAO casa um corpo sem chavetas
  #               (`for (...) s += xs[i];`). O corpo em `...` casa os dois.
  #
  # Nenhuma das quatro grafias em falta era exótica, e nenhuma tinha fixture —
  # uma fixture que nao tem a forma nunca a testa. Custo medido do
  # alargamento: ZERO findings novos nos mesmos 11 800 ficheiros.
  #
  # CONTINUA DE FORA, dito em vez de implícito: `for (i = 0; ...)` com o `i`
  # declarado antes do ciclo (é outro nó, precisava de um terceiro ramo) e um
  # recetor em cadeia (`h.Items.Length`), que o `metavariable-type` nao
  # resolve.
  #
  # FALSO POSITIVO CONHECIDO, HERDADO E MANTIDO DE PROPOSITO: um ciclo que
  # preenche `new int[a.Length + 1]` continua a disparar. O array de destino
  # tem mesmo `a.Length + 1` posições, por isso `i <= a.Length` está certo. O
  # aperto óbvio — exigir que o corpo indexe o MESMO array do limite — foi
  # medido na ronda de Java e rejeitado: trocava este falso positivo por um
  # falso negativo em todos os ciclos que leem `a[i]` para escrever noutro
  # lado. A medição é transportada, nao repetida.
  #
  # O CICLO SENTINELA, e este foi MEDIDO AQUI em 2026-08-21 pelo eixo 3 da
  # ablação. O ramo `$I++` desta regra produzia DOIS findings em 11 800
  # ficheiros de `dotnet/runtime` e os DOIS eram falsos positivos, da mesma
  # forma — um ciclo que corre de propósito uma posição para lá do fim e cujo
  # CORPO volta a comparar o indice com o limite antes de indexar:
  #
  #   ConfigPathUtility.cs:26   `ch = examine < configPath.Length
  #                              ? configPath[examine] : SeparatorChar;`
  #   XslNumber.cs:151          `if (idx == formatString.Length || ...)`
  #
  # E o idioma de "mais uma iteração para fechar o ultimo token": a posição
  # `a.Length` existe para correr o ramo do fim, e nunca chega a indexar. Zero
  # verdadeiros positivos na população inteira, nao numa amostra dela.
  #
  # A EXCLUSAO LIGA O CORPO A `$BODY` e pergunta-lhe se ele compara `$I` com
  # `$A.Length`. Nao é o aperto rejeitado na ronda de Java — esse exigia que o
  # corpo INDEXASSE o mesmo array, e trocava um falso positivo por falsos
  # negativos em todos os ciclos que leem `a[i]` para escrever noutro lado.
  # Este nao exige indexação nenhuma: exige uma segunda comparação com o mesmo
  # limite, que é o que distingue um ciclo sentinela de um off-by-one. Um bug
  # a sério nao volta a testar o limite; se voltasse, nao passava do fim.
  #
  # DUAS GRAFIAS DE COMPARACAO, uma por sitio real, e cada uma com a sua
  # near-miss em misses/ — `SentinelTernary` (`<`, `$I++`) e `SentinelSwitch`
  # (`==`, `++$I`), cruzadas de propósito para que cada um dos quatro ramos
  # novos se meça sozinho. As restantes grafias (`$A.Length == $I`,
  # `$I >= $A.Length`) NAO estao aqui: nao ha um sitio real por trás delas e
  # uma clausula sem prova le-se DEAD na ablação seguinte.
  #
  # O CORPO PASSOU DE `...` A `$BODY`, e isso NAO estreita nada: o `$BODY`
  # continua a casar as duas grafias de corpo, com e sem chavetas. Medido nas
  # cinco fixtures de hit, `InBoundsNoBraces` incluida, antes e depois.
  #
  # A REGRA DO `.Count` FICA COMO ESTA, e isso é uma decisao e nao um
  # esquecimento: ela produz ZERO findings nos mesmos 11 800 ficheiros, por
  # isso nao ha medição nenhuma que sustente a mesma exclusao la. O pack é
  # aditivo POR MEDICAO — acrescentar a exclusao por simetria seria acrescentar
  # uma suposição, e o custo dela é um falso negativo que ninguém mediu.
  - id: bugfix-cs-off-by-one-loop-lte-length
    patterns:
      - pattern-either:
          - pattern: for (var $I = 0; $I <= $A.Length; $I++) $BODY
          - pattern: for (var $I = 0; $I <= $A.Length; ++$I) $BODY
      - metavariable-type:
          metavariable: $A
          types: ["$T[]", "string"]
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: for (var $I = 0; $I <= $A.Length; $I++) $BODY
                - pattern: for (var $I = 0; $I <= $A.Length; ++$I) $BODY
            - metavariable-pattern:
                metavariable: $BODY
                pattern-either:
                  - pattern: $I < $A.Length
                  - pattern: $I == $A.Length
    message: >-
      Off-by-one. `i <= a.Length` corre uma posição para lá do fim, e o índice
      `a.Length` está sempre fora dos limites — é uma
      IndexOutOfRangeException. Provavelmente queria `i < a.Length`.
    severity: WARNING
    languages: [csharp]

  # O mesmo defeito na propriedade `.Count` das coleções.
  #
  # SEIS TIPOS ENUMERADOS, e a enumeração é obrigatória e nao preguiça:
  # MEDIDO, o `metavariable-type` NAO É SENSIVEL A SUBTIPOS. Um recetor
  # declarado `List<int>` nao casa `ICollection<$T>`, e um declarado
  # `ICollection<int>` nao casa `List<$T>`, apesar de a List implementar a
  # interface. Cada tipo da lista é uma afirmação independente, e por isso cada
  # um tem a sua própria fixture de hit: um tipo sem fixture podia ser apagado,
  # ou podia nunca ter funcionado, sem nenhum número se mexer.
  #
  # A mesma medição está por trás da exclusão da regra `async-void` mais acima,
  # onde `EventArgs` nao cobria `ElapsedArgs`. E a mesma propriedade do motor
  # vista de dois ângulos: aqui obriga a enumerar, lá obrigou a ligar o tipo a
  # uma metavariável.
  #
  # OITO TIPOS: os seis do desenho original mais `Collection<$T>` e
  # `ObservableCollection<$T>`, acrescentados em 2026-08-21. Sondados um a um,
  # os dois nao disparavam — pela mesma falta de sensibilidade a subtipos que
  # obriga a enumerar —, e ambos sao tipos da BCL com `Count` e indexador, nao
  # objetos de domínio: acrescenta-los nao afrouxa nada, sao mais duas
  # afirmações independentes, cada uma com a sua fixture.
  # `ObservableCollection<T>` é o tipo de coleção de qualquer projeto WPF ou
  # MAUI, que é precisamente o C# que nao esta em `dotnet/runtime`.
  #
  # NAO COBERTO, e dito em vez de implícito: um recetor tipado por uma
  # interface ou classe que nao esteja nesta lista — `IReadOnlyCollection<T>`,
  # `Queue<T>`, `Stack<T>`, `SortedDictionary<K,V>`, ou um tipo próprio com um
  # `Count`. A alternativa era largar a restrição de tipo, e isso traz de volta
  # o objeto de domínio com um `int Count`, que é pior.
  - id: bugfix-cs-off-by-one-loop-lte-count
    patterns:
      - pattern-either:
          - pattern: for (var $I = 0; $I <= $A.Count; $I++) ...
          - pattern: for (var $I = 0; $I <= $A.Count; ++$I) ...
      - metavariable-type:
          metavariable: $A
          types:
            - "List<$T>"
            - "IList<$T>"
            - "ICollection<$T>"
            - "IReadOnlyList<$T>"
            - "Dictionary<$K, $V>"
            - "HashSet<$T>"
            - "Collection<$T>"
            - "ObservableCollection<$T>"
    message: >-
      Off-by-one. `i <= xs.Count` corre uma posição para lá do fim, e o índice
      `xs.Count` está sempre fora dos limites — é uma
      ArgumentOutOfRangeException. Provavelmente queria `i < xs.Count`.
    severity: WARNING
    languages: [csharp]

  # ---------------------------------------------------------------------------
  # memory_leak — uma regra só, e o design diz porque: a regra do IDisposable
  # NAO E EXPRIMIVEL. O frontend de C# do Semgrep APAGA o modificador `using`
  # de uma using-declaration, confirmado por `dump-ast`, por comportamento e
  # pelo span do match. O idioma recomendado pela Microsoft fica byte a byte
  # igual a uma fuga, e a única exclusão que o distinguiria apaga a regra. Uma
  # regra a menos é melhor do que uma regra que acusa `using var`.
  # ---------------------------------------------------------------------------

  # Um `HttpClient` novo por chamada esgota o intervalo de portos efémeros: cada
  # cliente descartado deixa o socket em TIME_WAIT durante o timeout do sistema,
  # por isso um serviço com carga fica sem portos enquanto cada chamada
  # individual parece correta.
  #
  # A INVERSAO, e é o que torna esta regra diferente de todas as outras que
  # tocam em IDisposable: descartar por chamada E o bug. Esta regra QUER
  # disparar dentro de um `using`, e dispara. Quanto mais arrumada a
  # eliminação, mais garantido o socket perdido.
  #
  # `pattern-not-inside` NO CAMPO ESTATICO, e nao `pattern-inside` no método.
  # Medido, e a diferença custa um verdadeiro positivo inteiro: com
  # `pattern-inside: $R $M(...) { ... }` os CONSTRUTORES ficam silenciosamente
  # de fora, por isso `_client = new HttpClient()` num construtor — que é
  # precisamente onde este defeito costuma viver numa classe de serviço —
  # escapava. A exclusão pelo campo estático nao tem esse ponto cego: nomeia a
  # forma correta em vez de tentar delimitar onde a errada pode aparecer.
  - id: bugfix-cs-memory-leak-httpclient-per-call
    patterns:
      - pattern: new HttpClient(...)
      - pattern-not-inside: static $T $F = new HttpClient(...);
    message: >-
      `new HttpClient()` por chamada. Cada instancia descartada deixa o socket
      em TIME_WAIT, por isso sob carga o serviço esgota os portos efémeros —
      e descartar num `using` nao resolve, agrava. Use uma instancia estática
      de longa duração ou o `IHttpClientFactory`.
    severity: WARNING
    languages: [csharp]

  # ---------------------------------------------------------------------------
  # null_safety — UMA regra. Eram duas: a `as-cast-deref` foi apagada depois de
  # medida contra código real, e a nota de baixo diz porque. A que fica
  # continua em WARNING pelo §4 — a correção dela depende inteiramente de ter
  # reconhecido uma guarda, e uma guarda pode estar a um método de distancia.
  # ---------------------------------------------------------------------------

  # ---------------------------------------------------------------------
  # APAGADA (corpus dotnet/runtime): bugfix-cs-null-safety-as-cast-deref.
  #
  # Casava `var $V = $O as $T;` seguido de `$V.$M`. Disparou 6490 vezes nos
  # 11 800 ficheiros de `src/libraries/*/src` do `dotnet/runtime` — quase uma
  # por cada dois ficheiros, e dezasseis vezes mais do que a `empty-catch`
  # (402) no mesmo corpus. O numero nao é o argumento; o que estava lá dentro
  # é.
  #
  # A PREMISSA DA REGRA NAO E EXPRIMIVEL NESTE MOTOR. O frontend de C# do
  # Semgrep representa `o as T` e `(T)o` no MESMO NO, e isso verifica-se em
  # dois passos:
  #
  #   - `pattern: var $V = $O as $T;` e `pattern: var $V = ($T)$O;` casam
  #     EXATAMENTE os mesmos sitios, linha a linha, nas duas grafias;
  #   - `patterns:` com `pattern: var $V = $O as $T;` mais
  #     `pattern-not: var $V = ($T)$O;` devolve ZERO — o `pattern-not`
  #     aniquila todos os matches do `pattern`, que é o que acontece quando os
  #     dois descrevem o mesmo no.
  #
  # Nao existe grafia que apanhe o `as` e deixe passar o cast direto. E a
  # distinção era a regra INTEIRA: a propria mensagem dizia-o — "o `as`
  # devolve null quando o cast falha, é essa a diferença para um cast direto".
  # Um cast direto LANCA `InvalidCastException` no sitio do cast e nunca
  # devolve null, por isso em cima de um cast direto a regra acusa um defeito
  # que nao pode existir. Medido por atribuição textual no corpus: 4385 dos
  # 6490 achados (67,6 %) vem de um cast direto e so 1122 (17,3 %) de um `as`.
  #
  # E OS 17,3 % TAMBEM NAO ERAM VERDADEIROS POSITIVOS. Lidos 75 achados a mao,
  # espalhados por dezenas de assemblies: as guardas que o C# real usa nao sao
  # as onze da lista de exclusoes. `null != x`, `while (x != null)`,
  # `x is null || ...`, `Debug.Assert(x != null)`,
  # `ContractUtils.Requires(x != null, ...)`, uma reatribuição no ramo nulo,
  # um helper `[DoesNotReturn]`, uma cadeia `&&`/`||` de tres ou mais termos
  # (que associa a esquerda, e por isso o `$V != null && <... $V.$M ...>` nao
  # casa) e — a maior de todas — QUALQUER `if (x != null) { ... }` com MAIS DE
  # UMA INSTRUCAO no bloco, porque `if ($V != null) { <... $V.$M ...>; }` exige
  # um bloco de UMA instrução e as fixtures de misses/ so tinham dessas. Um
  # filtro generoso — "o nome da variavel nao aparece em nenhum teste de
  # nulidade em volta" — deixa 70 achados de 6490 (1,1 %), e ao le-los sobram
  # cinco variaveis com a forma genuina, todas latentes e nenhuma um bug vivo.
  #
  # WARNING nao é tier para uma regra que nunca esteve certa; é uma maneira
  # mais silenciosa de continuar errada, e custa a toda a gente que leia a
  # saida. Foi o mesmo raciocinio que apagou a `catch-returns-null` do pack de
  # JS/TS. A regra e as duas fixtures (hits/AsCast.cs, misses/AsCast.cs)
  # foram-se, e a entrada de as-cast do RealBugs.cs com elas.
  #
  # NAO A VOLTE A POR sem uma forma de separar o `as` do cast direto neste
  # motor. Enquanto os dois forem o mesmo no, a regra nao pode ser escrita. O
  # eixo 3 da ablação — o que teria dito isto antes de a regra sair — passou a
  # estar disponivel para este pack, via `GUARDIAN_CS_SRC`.
  # ---------------------------------------------------------------------

  # `FirstOrDefault()` e companhia devolvem `default(T)` numa sequencia vazia —
  # null para um tipo de referencia. A razao inteira para escolher a variante
  # `OrDefault` em vez de `First()` é a sequencia PODER estar vazia, por isso
  # dereferenciar o resultado logo a seguir contradiz a escolha do método.
  #
  # ESTA REGRA NAO TEM CLAUSULAS DE EXCLUSAO, e isso é um resultado e nao um
  # esquecimento: as formas corretas ficam caladas por serem nós diferentes.
  # A fixture de misses continua a existir como rede de regressao, e diz lá
  # dentro que nao prova precisao nenhuma.
  #
  # UMA CLASSE DE FALSOS POSITIVOS QUE NAO TEM SOLUCAO, nas duas direções, dita
  # em vez de escondida. Numa sequencia de tipos POR VALOR o `FirstOrDefault()`
  # devolve `default(T)` e NUNCA null, por isso
  # `List<int>.FirstOrDefault().ToString()` é código correto e esta regra
  # dispara nele. Medido, e a saída óbvia nao serve:
  #
  #   - uma deny-list de membros (`ToString`, `Year`, ...) fecharia essa
  #     instancia, mas passa a perder `List<Cliente>.FirstOrDefault().ToString()`,
  #     que é uma NRE a sério;
  #   - e continua a nao fechar `List<DateTime>.FirstOrDefault().Year`, porque
  #     a lista de membros de todos os tipos por valor nao é enumerável.
  #
  # O que resolveria era inferir o argumento genérico do recetor, e isso nao
  # está disponível. Fica o falso positivo, declarado.
  #
  # E CONFIRMADO EM CODIGO REAL a 2026-08-21, pelo eixo 3: a regra produz UM
  # finding em 11 800 ficheiros de `dotnet/runtime`, atribuído ao ramo
  # `FirstOrDefault`, e esse um é precisamente esta classe.
  # `Microsoft.Extensions.Logging/src/Logger.cs:213` escreve
  # `logger.ScopeLoggers?.FirstOrDefault().ExternalScopeProvider`, e o
  # `ScopeLogger` de `LoggerInformation.cs:46` é um `internal readonly struct`.
  # O `FirstOrDefault()` devolve `default(ScopeLogger)`, nunca null, e a linha
  # seguinte testa o `ExternalScopeProvider` por nulo. Código correto.
  #
  # A população inteira da regra neste corpus é esse um, por isso nao ha aqui
  # nem prova de precisao nem prova do contrário — ha a confirmação de que o
  # falso positivo declarado acima é o que a regra encontra quando encontra
  # alguma coisa. Os ramos `SingleOrDefault` e `LastOrDefault` produzem zero.
  - id: bugfix-cs-null-safety-ordefault-deref
    pattern-either:
      - pattern: $X.FirstOrDefault(...).$M
      - pattern: $X.SingleOrDefault(...).$M
      - pattern: $X.LastOrDefault(...).$M
    message: >-
      Dereferencia direta de `FirstOrDefault()`. Numa sequencia vazia devolve
      null, e escolher a variante `OrDefault` é precisamente admitir que ela
      pode estar vazia. Verifique o nulo, use `?.`, ou chame `First()` se a
      sequencia nao puder mesmo estar vazia.
    severity: WARNING
    languages: [csharp]

  # ---------------------------------------------------------------------------
  # edge_case — uma regra, e é a que carrega a única falta de solidez que esta
  # série já despachou uma vez. Aqui ela nao chega a existir, porque a fixture
  # que a apanha foi escrita antes da clausula.
  # ---------------------------------------------------------------------------

  # Remover de uma coleção enquanto um `foreach` a enumera invalida o
  # enumerador: o `MoveNext()` seguinte lança InvalidOperationException,
  # "Collection was modified; enumeration operation may not execute."
  #
  # `foreach (var $X in $COLL)`, e nao `foreach ($T $X in $COLL)`. Medido na
  # sondagem desta ronda: a forma com tipo explícito encontrou 0 de 5 bugs
  # reais, a forma com `var` encontrou os cinco. E a sexta forma de falha
  # silenciosa da série e a primeira que o `paths.scanned` nao apanha.
  #
  # QUATRO TIPOS ENUMERADOS e nao cinco: o `Dictionary` foi DEIXADO DE FORA de
  # propósito. Remover de um Dictionary durante a enumeração está DOCUMENTADO
  # COMO SEGURO desde o .NET Core 3.0, por isso um ramo de Dictionary
  # dispararia em código correto. Há uma fixture em misses/ só para o manter
  # fora.
  #
  # O METODO DE REMOCAO LIGA-SE A `$RM`, em vez de os padrões repetirem
  # `Remove`. Medido, e custa um falso positivo inteiro: com as exclusões a
  # nomear `Remove` literalmente enquanto o padrao positivo também aceitava
  # `RemoveAt`, um `RemoveAt(0); break;` correto passava a disparar, porque
  # exclusão nenhuma o conseguia ver.
  #
  # A FALTA DE SOLIDEZ DA WAVE 4 DO JAVA, PORTADA JA CORRIGIDA. As exclusões de
  # saída fecham os falsos positivos de "remove e sai do ciclo" — e sozinhas
  # ENGOLEM UM BUG REAL: um `Remove` dentro de um ramo de `switch` seguido de
  # `break`, onde o `break` sai do SWITCH e nao do ciclo, por isso a iteração
  # continua sobre um enumerador invalidado. Medido nesta ronda: só com as
  # exclusões de saída sao 7 findings e o bug do switch desaparece; com a
  # reinclusao sao 8 e os falsos positivos continuam fechados.
  #
  # A DIRECAO DO ANINHAMENTO E QUE FAZ O TRABALHO: o `switch` tem de estar
  # DENTRO do `foreach`. Contenção léxica simples — "algures dentro de um
  # switch" — reativaria a regra num `foreach` escrito dentro de um `case`,
  # onde o `break` sai mesmo do ciclo e o código está correto. Essa forma tem a
  # sua própria near-miss.
  #
  # O C# NAO TEM `break` ETIQUETADO, por isso as duas exclusões de `break $L`
  # do pack de Java nao portam e nao estao aqui. O equivalente em C# seria um
  # `goto`, que ninguém escreve e que nenhuma fixture cobre — acrescentá-lo
  # seria uma clausula morta.
  - id: bugfix-cs-edge-case-modify-during-iteration
    patterns:
      - pattern: $COLL.$RM(...)
      - metavariable-regex:
          metavariable: $RM
          regex: ^(Remove|RemoveAt)$
      # O `metavariable-pattern` liga o recetor ANTES de o tipar. No pack de
      # Java era preciso um `pattern-either` de `$F` e `this.$F` aqui, porque
      # lá o `metavariable-type` nao resolvia um campo qualificado — o
      # `cache.get(k)` disparava e o `this.cache.get(k)` era invisível, na
      # mesma classe e no mesmo campo.
      #
      # EM C# ISSO NAO ACONTECE, medido nesta ronda: o ramo `this.$F` foi
      # ablado e nao mexeu um único finding, porque o `$F` sozinho já liga E
      # TIPA `this._items`. A fixture `OverThisField` continua em hits/ a
      # provar que a forma qualificada é apanhada — o que desapareceu foi a
      # clausula redundante, nao a cobertura.
      - metavariable-pattern:
          metavariable: $COLL
          patterns:
            - pattern: $F
            # SEIS TIPOS: os quatro do desenho original mais `Collection<$T>`
            # e `ObservableCollection<$T>`, acrescentados em 2026-08-21 pela
            # mesma medição que os acrescentou a `loop-lte-count`. Ambos
            # invalidam o enumerador exatamente como a `List<T>`, e o
            # `ObservableCollection<T>` é o caso mais provável do mundo real:
            # remover de dentro de um `foreach` sobre a coleção ligada a um
            # ecra e um erro classico de WPF/MAUI.
            - metavariable-type:
                metavariable: $F
                types:
                  - "List<$T>"
                  - "IList<$T>"
                  - "ICollection<$T>"
                  - "HashSet<$T>"
                  - "Collection<$T>"
                  - "ObservableCollection<$T>"
      # O `var` do `foreach` tambem é um CURINGA do tipo do elemento, medido
      # em 2026-08-21: este `pattern-inside` casa `foreach (string x in xs)`
      # tal e qual. A regra nao esta cega as grafias com tipo explícito, e o
      # ZERO que deu em 11 800 ficheiros de `dotnet/runtime` é o defeito a nao
      # existir la — ha 3978 `foreach` no corpus, quatro deles removem da
      # coleção que enumeram, e os quatro saem do ciclo logo a seguir. §4c.
      - pattern-inside: "foreach (var $X in $COLL) { ... }"
      - pattern-not-inside: |
          $COLL.$RM(...);
          return ...;
      - pattern-not-inside: |
          $COLL.$RM(...);
          $S1;
          return ...;
      - pattern-not-inside: |
          $COLL.$RM(...);
          throw ...;
      - pattern-not-inside: |
          $COLL.$RM(...);
          $S1;
          throw ...;
      # O `break` SIMPLES só sai do ciclo FORA de um `switch`. Os dois
      # primeiros ramos sao reinclusões e nao repetem o termo positivo, porque
      # um `pattern-inside` já é positivo por si; o terceiro TEM de o repetir,
      # senao é uma regra inválida — um ramo só com termos negativos nao
      # carrega regra nenhuma.
      - pattern-either:
          - pattern-inside: |
              foreach (var $X in $COLL) {
                ...
                switch ($S) {
                  case $C:
                    ...
                }
                ...
              }
          - pattern-inside: |
              foreach (var $X in $COLL) {
                ...
                switch ($S) {
                  default:
                    ...
                }
                ...
              }
          - patterns:
              - pattern: $COLL.$RM(...)
              - pattern-not-inside: |
                  $COLL.$RM(...);
                  break;
              - pattern-not-inside: |
                  $COLL.$RM(...);
                  $S1;
                  break;
    message: >-
      Remoção da coleção durante o `foreach` sobre ela própria. Invalida o
      enumerador e o `MoveNext()` seguinte lança InvalidOperationException.
      Itere sobre uma cópia (`.ToList()`) ou use `RemoveAll(...)`.
    severity: WARNING
    languages: [csharp]
