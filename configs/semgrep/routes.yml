  # `using $SYMBOL = $MODULE;` (aliased) gives a clean, real bound name.
  # Plain `using $MODULE;` binds no $SYMBOL — a `using` directive brings a
  # whole namespace into scope rather than one named symbol, so (unlike
  # PHP/Rust/Java above) there is no principled "last segment" to split out;
  # a `$MODULE.$SYMBOL`-shaped split was tried and measured to bind $MODULE to
  # only the FIRST segment instead of the last (`using System.Collections
  # .Generic;` split as $MODULE="System", $SYMBOL="Collections.Generic" —
  # backwards relative to PHP/Java/Rust's own last-segment split, and not
  # reproducible as a clean "the symbol this using introduces"), so it was
  # dropped in favour of the brief's own single-metavariable `using $NS;`
  # shape. $MODULE is the full namespace verbatim; when it spans more than one
  # segment, Semgrep's own `abstract_content` joins with a SPACE, not `.` —
  # measured, and `recoverMetavars.ts` reproduces the same join.
  - id: guardian-import-csharp
    languages: [csharp]
    severity: INFO
    message: using directive
    metadata:
      guardian_kind: import
      framework: csharp
    pattern-either:
      - pattern: "using $SYMBOL = $MODULE;"
      - pattern: "using $MODULE;"

