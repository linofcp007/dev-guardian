# dev-guardian — attack-surface extraction rules.
#
# NOT a findings rule pack. `map_attack_surface` runs this with its own
# --config; the matches are consumed by mcp/src/surface/extract.ts and never
# reach the findings table. severity: INFO exists only because Semgrep
# requires the field.
#
# Contract with the extractor (mcp/src/surface/extract.ts):
#   metadata.guardian_kind: route | mount | import | env   (required)
#   route  → captures $PATH, optionally $METHOD or metadata.method
#   mount  → captures $PREFIX and $ROUTER
#   import → captures $SYMBOL and $MODULE
#   env    → captures $NAME
#
# Namespaced frameworks: register_rest_route takes the namespace and the route
# as two arguments. Semgrep cannot concatenate metavariables into a third, so
# the rule captures $NS and $ROUTE separately; extract.ts puts $NS on
# RouteRecord.namespace and $ROUTE on path_raw, and resolvers/wordpress.ts
# combines them into the served /wp-json path.
#
# HTTP verb: Semgrep reports *that* a pattern-either fired, never *which*
# alternative did. A rule whose verb is encoded in the alternative therefore
# has to be one rule per verb, each declaring `metadata.method` — which the
# extractor reads as the fallback when no $METHOD metavariable was captured.
# That is why @Get/@Post/... are five rules and not one. Verb-less rules
# (Flask's @app.route, Django path(), Spring @RequestMapping) correctly omit
# the key and are reported as ANY.
#
# ---- Attribute/decorator patterns must include the declaration -------------
#
# Measured against Semgrep 1.86.0 on mcp/test/fixtures/surface/apps/:
#
#   `#[get($PATH)]`     (Rust)  parses, and then matches EVERY node in the
#                               file — 95 matches for 3 routes, all binding
#                               `metavars: {}`. Spans included `use` lines and
#                               function bodies.
#   `[HttpGet($PATH)]`  (C#)    parses as a collection expression and matches
#                               nothing at all.
#   `@Get($PATH)`       (TS)    does not parse: "Invalid pattern for
#                               TypeScript", which Semgrep reports as a rule
#                               error on every run.
#
# All three become exact when the pattern includes the item the attribute is
# attached to (`#[get($PATH, ...)] fn $F(...) { ... }`). The match span then
# covers the attribute *and* the declaration — and that has a consequence you
# must not undo.
#
# ---- Spanning the declaration costs these three families their recovery ----
#
# Semgrep's span for such a match starts at the FIRST attribute on the
# declaration, which is very often not the route one:
#
#   #[allow(dead_code)]              [Produces("application/json")]
#   #[get("/d")]                     // [HttpGet("/orders/legacy")]
#   async fn d() { … }               [HttpGet("/orders")]
#
# On any Semgrep that redacts match content (>= ~1.120 without `semgrep login`)
# `surface/recoverMetavars.ts` has only that span to work from. Two ways of
# reading it were tried and both INVENTED routes:
#
#   - anchoring on the first argument list read `dead_code` and
#     `"application/json"` as paths;
#   - anchoring on the route attribute by name read the commented-out
#     `/orders/legacy` above, while the live `/orders` disappeared.
#
# Both pass the extractor's literal test, so each was emitted as a *resolved*
# path — a URL a DAST consumer would go on to request. The second failure is
# the general one: deciding whether text is code, a comment or a string is not
# local information, and the span starts mid-file.
#
# So these three families are NOT reconstructed. On a redacting Semgrep their
# routes are absent, `coverage` reports `unreadable` (never `no_matches`) for
# the language, and `tools_run` names the remedy: log in, or use a Semgrep
# older than ~1.100. The other ten families are unaffected — their spans start
# at the call or annotation that matched, so the capture sits at a known place.
#
# If you widen another rule family to span its declaration, add its
# `metadata.framework` to UNREADABLE_UNDER_REDACTION in
# `mcp/src/surface/recoverMetavars.ts`. The two lists are asserted equal by
# `mcp/test/unit/surface/rulePack.test.ts`, which fails if you forget — that
# assertion is the only thing that stopped this shipping a third time.
#
# Rust is one rule, not five, because Semgrep's Rust engine *does* bind the
# attribute name to `$METHOD` once the pattern is well-formed — and the actix /
# Rocket attribute name IS the HTTP verb, so the extractor's `normalizeMethod`
# reads it directly. The other two families stay one-rule-per-verb for reasons
# that are not stylistic: in TypeScript `@$DEC($PATH)` does not parse at all, and
# in C# the attribute name is `HttpGet`, which is not a verb the extractor
# knows, so the verb has to arrive as `metadata.method`.
#
# ---- Do NOT add a $PATH literal guard to a route rule ----------------------
#
# A `metavariable-regex` pinning $PATH to a string literal DROPS the match:
# the extractor never sees it. That is the wrong outcome for a route rule,
# because a route registered with a computed path — `@GetMapping(Paths.ORDERS)`,
# `path(settings.ADMIN_URL, ...)`, `register_rest_route(self::NAMESPACE, ...)` —
# is still surface, and dropping it makes `coverage` report `no_matches` for
# the language: a "this application exposes nothing" falsehood of exactly the
# class mcp/src/tools/mapAttackSurface.ts:8-15 forbids. The extractor's
# `isLiteralPath` is what handles those: it keeps the route and flags it
# `path_partial: true` at 'low' confidence, never guessing the path. That
# guard is load-bearing and lives in one place, so it also covers rules users
# add through register_custom_rules.
#
# Exactly two rules carry a $PATH guard, and only because their pattern does
# not identify a route on its own — there the guard disambiguates rather than
# discards:
#
#   guardian-route-rails    `$METHOD $PATH` matches ANY one-argument Ruby
#                           call (`get foo`), so without the literal the rule
#                           would report arbitrary method calls as routes.
#   guardian-route-express  `$APP.$METHOD($PATH, ...)` matches any two-arg
#                           method call on any object.
#
# `guardian-mount-express` keeps its $PREFIX guard for the same reason.
# Every other rule below names its framework's registration API explicitly, so
# a match IS a route and the path is the extractor's problem, not the pack's.
#
# Mount resolution (Node only): resolvers/node.ts's resolveNodeMounts()
# resolves a route's prefix for any route whose `language` is javascript or
# typescript — gated purely on that field, not on a per-rule opt-in flag. A
# rule pack author adding a new JS/TS-family framework gets mount resolution
# for free; nothing in this file needs to be set for it.

rules:
  # ---------- JavaScript / TypeScript ----------
  - id: guardian-route-express
    languages: [javascript, typescript]
    severity: INFO
    message: express/fastify route
    metadata:
      guardian_kind: route
      framework: express
      confidence: high
    patterns:
      - pattern: $APP.$METHOD($PATH, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|options|head|all)$
      # Disambiguating, not discarding — see the header.
      - metavariable-regex:
          metavariable: $PATH
          regex: ^['"`]/.*

  - id: guardian-mount-express
    languages: [javascript, typescript]
    severity: INFO
    message: express router mount
    metadata:
      guardian_kind: mount
      framework: express
    patterns:
      - pattern: $APP.use($PREFIX, $ROUTER)
      - metavariable-regex:
          metavariable: $PREFIX
          regex: ^['"`]/.*

  - id: guardian-import-esm
    languages: [javascript, typescript]
    severity: INFO
    message: module import
    metadata:
      guardian_kind: import
      framework: esm
    pattern-either:
      - pattern: import $SYMBOL from "$MODULE"
      - pattern: const $SYMBOL = require("$MODULE")

  # NestJS: one rule per verb — the decorator name is the method, and Semgrep
  # cannot report which pattern-either alternative matched.
  - id: guardian-route-nestjs-get
    languages: [typescript]
    severity: INFO
    message: NestJS route
    metadata:
      guardian_kind: route
      framework: nestjs
      confidence: medium
      method: GET
    pattern: |
      @Get($PATH, ...)
      $M(...) { ... }

  - id: guardian-route-nestjs-post
    languages: [typescript]
    severity: INFO
    message: NestJS route
    metadata:
      guardian_kind: route
      framework: nestjs
      confidence: medium
      method: POST
    pattern: |
      @Post($PATH, ...)
      $M(...) { ... }

  - id: guardian-route-nestjs-put
    languages: [typescript]
    severity: INFO
    message: NestJS route
    metadata:
      guardian_kind: route
      framework: nestjs
      confidence: medium
      method: PUT
    pattern: |
      @Put($PATH, ...)
      $M(...) { ... }

  - id: guardian-route-nestjs-patch
    languages: [typescript]
    severity: INFO
    message: NestJS route
    metadata:
      guardian_kind: route
      framework: nestjs
      confidence: medium
      method: PATCH
    pattern: |
      @Patch($PATH, ...)
      $M(...) { ... }

  - id: guardian-route-nestjs-delete
    languages: [typescript]
    severity: INFO
    message: NestJS route
    metadata:
      guardian_kind: route
      framework: nestjs
      confidence: medium
      method: DELETE
    pattern: |
      @Delete($PATH, ...)
      $M(...) { ... }

  # ---------- Python ----------
  - id: guardian-route-flask
    languages: [python]
    severity: INFO
    message: Flask route
    metadata:
      guardian_kind: route
      framework: flask
      confidence: high
    pattern-either:
      - pattern: "@$APP.route($PATH, ...)"
      - pattern: "@$APP.route($PATH)"

  - id: guardian-route-fastapi
    languages: [python]
    severity: INFO
    message: FastAPI route
    metadata:
      guardian_kind: route
      framework: fastapi
      confidence: high
    patterns:
      - pattern: "@$APP.$METHOD($PATH, ...)"
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|options|head)$

  # Qualified callee, not the bare name. `path(...)` is an ordinary function
  # name: measured against Semgrep 1.86.0, the bare form reported three routes
  # out of a module whose only crime was defining `def path(*parts)` around
  # os.path.join — and two of them ("etc", "var") passed the extractor's
  # literal test, so they were emitted as resolved URLs that exist nowhere.
  # Writing the fully-qualified name makes Semgrep resolve the import instead
  # of the spelling, so a local helper of the same name no longer matches while
  # `from django.urls import path` still does. This is NOT a $PATH guard: a
  # computed path (`path(settings.ADMIN_URL, ...)`) still matches and is still
  # reported, flagged path_partial by the extractor.
  - id: guardian-route-django
    languages: [python]
    severity: INFO
    message: Django URL pattern
    metadata:
      guardian_kind: route
      framework: django
      confidence: medium
    pattern-either:
      - pattern: django.urls.path($PATH, ...)
      - pattern: django.urls.re_path($PATH, ...)

  # ---------- PHP / WordPress ----------
  - id: guardian-route-wp-rest
    languages: [php]
    severity: INFO
    message: WordPress REST route
    metadata:
      guardian_kind: route
      framework: wp-rest
      confidence: medium
    pattern: register_rest_route($NS, $ROUTE, ...)

  - id: guardian-route-laravel
    languages: [php]
    severity: INFO
    message: Laravel route
    metadata:
      guardian_kind: route
      framework: laravel
      confidence: medium
    patterns:
      - pattern: Route::$METHOD($PATH, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|options|any)$

  # ---------- Go ----------
  - id: guardian-route-go-nethttp
    languages: [go]
    severity: INFO
    message: net/http handler
    metadata:
      guardian_kind: route
      framework: net-http
      confidence: medium
    pattern-either:
      - pattern: http.HandleFunc($PATH, ...)
      - pattern: $MUX.HandleFunc($PATH, ...)

  - id: guardian-route-go-gin
    languages: [go]
    severity: INFO
    message: Gin route
    metadata:
      guardian_kind: route
      framework: gin
      confidence: medium
    patterns:
      - pattern: $R.$METHOD($PATH, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD|Any)$

  # ---------- Rust ----------
  # ONE rule, because Semgrep's Rust engine binds the attribute name — the
  # only attribute family in this pack where it does. The verb therefore
  # arrives as $METHOD and the rule declares no metadata.method.
  #
  # The trailing `fn $F(...) { ... }` is load-bearing, not decoration: without
  # it the five per-verb rules this replaces matched every node in the file and
  # bound nothing, so one `#[get("/x")]` produced five routes — the real GET
  # plus four fabricated ones — and spans that were function bodies rather than
  # routes. See the attribute note in the header.
  #
  # KNOWN LIMITATION — single-argument attributes only. Despite the `, ...`,
  # this does NOT match Rocket's multi-argument forms:
  #
  #   #[post("/x", data = "<t>")]        0 matches on 1.164.0 and on 1.86.0
  #   #[get("/x", rank = 2)]             0 matches on 1.164.0 and on 1.86.0
  #
  # Measured, not assumed. `#[$METHOD($PATH, $EXTRA)] fn $F(...) { ... }` does
  # not match them either; only a bare `#[$METHOD(...)]` does, and that binds no
  # $PATH at all — which would hand the extractor a route with no path on any
  # Semgrep that still emits metavariables. Actix's single-argument attribute,
  # the common case, works; Rocket routes carrying `data`, `rank` or `format`
  # are simply not reported. Under-reporting a route is a gap; reporting one at
  # a path we did not read would be a lie.
  - id: guardian-route-rust-actix
    languages: [rust]
    severity: INFO
    message: Actix/Rocket route attribute
    metadata:
      guardian_kind: route
      framework: actix
      confidence: medium
    patterns:
      - pattern: "#[$METHOD($PATH, ...)] fn $F(...) { ... }"
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|options|head)$

  # ---------- Ruby ----------
  - id: guardian-route-rails
    languages: [ruby]
    severity: INFO
    message: Rails / Sinatra route
    metadata:
      guardian_kind: route
      framework: rails
      confidence: low
    patterns:
      - pattern-either:
          # Bare form: get '/users'
          - pattern: $METHOD $PATH
          # Idiomatic form with trailing options: get '/users', to: 'users#index'
          - pattern: $METHOD $PATH, ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete)$
      # Disambiguating, not discarding — see the header. `$METHOD $PATH`
      # matches any one-argument Ruby call, so without this the rule reports
      # `get foo` as a route.
      - metavariable-regex:
          metavariable: $PATH
          regex: ^['"]

  # ---------- Java ----------
  # One rule per annotation. @RequestMapping carries no verb of its own (the
  # method= attribute is a separate argument we do not read), so it declares
  # no metadata.method and is reported as ANY — which is the truth.
  #
  # KNOWN LIMITATION — single-argument annotations only. The named-argument
  # form, which is common in real Spring code, is NOT matched:
  #
  #   @GetMapping(value = "/x", produces = "application/json")   0 matches
  #
  # It cannot be fixed by adding `, ...` here: `@GetMapping($PATH, ...)` is
  # rejected outright by Semgrep as "Invalid pattern for Java", which would
  # take the whole rule (and its single-argument matches) with it. Measured on
  # 1.164.0. Those routes are absent from the inventory rather than reported at
  # a guessed path.
  - id: guardian-route-spring-get
    languages: [java]
    severity: INFO
    message: Spring MVC mapping
    metadata:
      guardian_kind: route
      framework: spring
      confidence: medium
      method: GET
    pattern: "@GetMapping($PATH)"

  - id: guardian-route-spring-post
    languages: [java]
    severity: INFO
    message: Spring MVC mapping
    metadata:
      guardian_kind: route
      framework: spring
      confidence: medium
      method: POST
    pattern: "@PostMapping($PATH)"

  - id: guardian-route-spring-put
    languages: [java]
    severity: INFO
    message: Spring MVC mapping
    metadata:
      guardian_kind: route
      framework: spring
      confidence: medium
      method: PUT
    pattern: "@PutMapping($PATH)"

  - id: guardian-route-spring-patch
    languages: [java]
    severity: INFO
    message: Spring MVC mapping
    metadata:
      guardian_kind: route
      framework: spring
      confidence: medium
      method: PATCH
    pattern: "@PatchMapping($PATH)"

  - id: guardian-route-spring-delete
    languages: [java]
    severity: INFO
    message: Spring MVC mapping
    metadata:
      guardian_kind: route
      framework: spring
      confidence: medium
      method: DELETE
    pattern: "@DeleteMapping($PATH)"

  - id: guardian-route-spring-request
    languages: [java]
    severity: INFO
    message: Spring MVC mapping
    metadata:
      guardian_kind: route
      framework: spring
      confidence: medium
    pattern: "@RequestMapping($PATH)"

  # ---------- C# / .NET ----------
  # $METHOD binds the whole builder name (`MapGet`); extract.ts's
  # normalizeMethod strips the Map prefix.
  - id: guardian-route-aspnet-minimal
    languages: [csharp]
    severity: INFO
    message: ASP.NET minimal API route
    metadata:
      guardian_kind: route
      framework: aspnet-minimal
      confidence: medium
    patterns:
      - pattern: $APP.$METHOD($PATH, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^Map(Get|Post|Put|Patch|Delete)$

  - id: guardian-route-aspnet-attribute-get
    languages: [csharp]
    severity: INFO
    message: ASP.NET attribute route
    metadata:
      guardian_kind: route
      framework: aspnet
      confidence: medium
      method: GET
    pattern: |
      [HttpGet($PATH, ...)]
      $RET $M(...) { ... }

  - id: guardian-route-aspnet-attribute-post
    languages: [csharp]
    severity: INFO
    message: ASP.NET attribute route
    metadata:
      guardian_kind: route
      framework: aspnet
      confidence: medium
      method: POST
    pattern: |
      [HttpPost($PATH, ...)]
      $RET $M(...) { ... }

  - id: guardian-route-aspnet-attribute-put
    languages: [csharp]
    severity: INFO
    message: ASP.NET attribute route
    metadata:
      guardian_kind: route
      framework: aspnet
      confidence: medium
      method: PUT
    pattern: |
      [HttpPut($PATH, ...)]
      $RET $M(...) { ... }

  - id: guardian-route-aspnet-attribute-patch
    languages: [csharp]
    severity: INFO
    message: ASP.NET attribute route
    metadata:
      guardian_kind: route
      framework: aspnet
      confidence: medium
      method: PATCH
    pattern: |
      [HttpPatch($PATH, ...)]
      $RET $M(...) { ... }

  - id: guardian-route-aspnet-attribute-delete
    languages: [csharp]
    severity: INFO
    message: ASP.NET attribute route
    metadata:
      guardian_kind: route
      framework: aspnet
      confidence: medium
      method: DELETE
    pattern: |
      [HttpDelete($PATH, ...)]
      $RET $M(...) { ... }

  # ---------- Environment variables (all stacks) ----------
  - id: guardian-env-node
    languages: [javascript, typescript]
    severity: INFO
    message: environment variable read
    metadata:
      guardian_kind: env
    pattern-either:
      - pattern: process.env.$NAME
      - pattern: process.env[$NAME]

  - id: guardian-env-python
    languages: [python]
    severity: INFO
    message: environment variable read
    metadata:
      guardian_kind: env
    pattern-either:
      - pattern: os.environ[$NAME]
      - pattern: os.environ.get($NAME, ...)
      - pattern: os.getenv($NAME, ...)

  - id: guardian-env-php
    languages: [php]
    severity: INFO
    message: environment variable read
    metadata:
      guardian_kind: env
    pattern-either:
      - pattern: getenv($NAME)
      - pattern: $_ENV[$NAME]

  - id: guardian-env-dotnet
    languages: [csharp]
    severity: INFO
    message: environment variable read
    metadata:
      guardian_kind: env
    pattern: Environment.GetEnvironmentVariable($NAME)
