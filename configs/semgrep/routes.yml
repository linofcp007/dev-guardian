  # `use $MODULE::$SYMBOL;` for a single item; `use $MODULE::{$SYMBOL};` for a
  # grouped one. The grouped pattern deliberately carries NO ellipsis —
  # `use $MODULE::{ ..., $SYMBOL, ... };` is a Semgrep Rust PARSE ERROR
  # (measured on 1.86.0 and 1.164.0: "Invalid pattern for Rust"), and because
  # it lives in the same rule as the single-item pattern, that one parse error
  # silently zeroes out BOTH alternatives — this is exactly the class of
  # failure item 1's five NestJS rules hit. The bare, non-ellipsis brace
  # pattern below parses cleanly and — measured against a 3-item group — yields
  # ONE match PER item (`web`, `App`, `HttpServer` from
  # `use actix_web::{web, App, HttpServer};` are three separate matches), so
  # there is no first-only limitation for Rust the way there is for JS/TS and
  # Python. The bare pattern also matches a non-grouped `use`, which is
  # harmless: combined with the single-item pattern in one rule, Semgrep
  # dedupes the identical (rule, span) pair rather than double-counting it.
  #
  # When $MODULE spans more than one path segment (`crate::models::User`),
  # Semgrep's own `abstract_content` joins the segments with a SPACE
  # (`crate models`), not `::` — measured on 1.86.0, not a choice made here.
  # `recoverMetavars.ts` reproduces the same join.
  - id: guardian-import-rust
    languages: [rust]
    severity: INFO
    message: use declaration
    metadata:
      guardian_kind: import
      framework: rust
    pattern-either:
      - pattern: use $MODULE::$SYMBOL;
      - pattern: use $MODULE::{$SYMBOL};

  # ---------- Ruby ----------
  - id: guardian-route-rails
    languages: [ruby]
    severity: INFO
    message: Rails / Sinatra route
    metadata:
      guardian_kind: route
      framework: rails
      confidence: low
    patterns:
      - pattern-either:
          # Bare form: get '/users'
          - pattern: $METHOD $PATH
          # Idiomatic form with trailing options: get '/users', to: 'users#index'
          - pattern: $METHOD $PATH, ...
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete)$
      # Disambiguating, not discarding — see the header. `$METHOD $PATH`
      # matches any one-argument Ruby call, so without this the rule reports
      # `get foo` as a route.
      - metavariable-regex:
          metavariable: $PATH
          regex: ^['"]

  # `require`, `require_relative` and `load` never bind a local name — Ruby's
  # own semantics, not a gap in this rule: none of the three introduces a
  # scoped identifier the way an `import` or `use` statement does, so there is
  # nothing to capture as $SYMBOL. Every alternative binds $MODULE only.
  # `Rails.cache.delete 'orders/index'` (rb-rails/cache_warmer.rb, bait for the
  # route rule above) does not match: none of its callee names are `require`,
  # `require_relative` or `load`.
  - id: guardian-import-ruby
    languages: [ruby]
    severity: INFO
    message: require/load
    metadata:
      guardian_kind: import
      framework: ruby
    pattern-either:
      - pattern: require "$MODULE"
      - pattern: require_relative "$MODULE"
      - pattern: load "$MODULE"

  # ---------- Java ----------
  # One rule per annotation. @RequestMapping carries no verb of its own (the
  # method= attribute is a separate argument we do not read), so it declares
  # no metadata.method and is reported as ANY — which is the truth.
  #
  # KNOWN LIMITATION — single-argument annotations only. The named-argument
  # form, which is common in real Spring code, is NOT matched:
  #
  #   @GetMapping(value = "/x", produces = "application/json")   0 matches
  #
  # It cannot be fixed by adding `, ...` here: `@GetMapping($PATH, ...)` is
  # rejected outright by Semgrep as "Invalid pattern for Java", which would
  # take the whole rule (and its single-argument matches) with it. Measured on
  # 1.164.0. Those routes are absent from the inventory rather than reported at
  # a guessed path.
  - id: guardian-route-spring-get
    languages: [java]
    severity: INFO
    message: Spring MVC mapping
    metadata:
      guardian_kind: route
      framework: spring
      confidence: medium
      method: GET
    pattern: "@GetMapping($PATH)"

  - id: guardian-route-spring-post
