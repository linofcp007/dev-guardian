  # Three alternatives — static, wildcard and plain — deliberately each with a
  # SINGLE metavariable, matching the brief's own `import $P;` notation.
  #
  # A two-metavariable split (`import $MODULE.$SYMBOL;`, binding the final
  # segment as $SYMBOL the way PHP's `use $MODULE\$SYMBOL;` and Rust's
  # `use $MODULE::$SYMBOL;` do) was tried and measured to misbehave
  # specifically for the wildcard form: `import com.example.util.*;` matched
  # with $MODULE bound to only the FIRST segment (`com`) and $SYMBOL absorbing
  # the rest (`example.util`) instead of splitting at the last segment the way
  # the non-wildcard forms do — a Semgrep matching quirk, not a principled
  # split, and not something worth reproducing at recovery time for a form
  # that introduces no single named symbol in the first place. The
  # single-metavariable design sidesteps it entirely: every alternative below
  # binds only $MODULE, ground-truthed clean (no $SYMBOL, no split ambiguity)
  # on both Semgrep versions.
  #
  # $MODULE is the full qualified name verbatim for the plain and static forms
  # (`java.util.List` -> the whole thing) and the package prefix before `.*`
  # for the wildcard form. When it spans more than one segment, Semgrep's own
  # `abstract_content` joins them with a SPACE, not `.` — measured, not a
  # choice made here; `recoverMetavars.ts` reproduces the same join.
  - id: guardian-import-java
    languages: [java]
    severity: INFO
    message: import declaration
    metadata:
      guardian_kind: import
      framework: java
    pattern-either:
      - pattern: import static $MODULE;
      - pattern: import $MODULE.*;
      - pattern: import $MODULE;

  # ---------- C# / .NET ----------
  # $METHOD binds the whole builder name (`MapGet`); extract.ts's
  # normalizeMethod strips the Map prefix.
  - id: guardian-route-aspnet-minimal
