# dev-guardian — attack-surface extraction rules.
#
# NOT a findings rule pack. `map_attack_surface` runs this with its own
# --config; matches never reach the findings table. severity: INFO exists
# only because Semgrep requires the field.
#
# Contract, by `guardian_kind` (required on every rule) — each is read by a
# DIFFERENT consumer, not all by extract.ts:
#   route  → mcp/src/surface/extract.ts. Captures $PATH, optionally $METHOD
#            or metadata.method.
#   mount  → mcp/src/surface/extract.ts. Captures $PREFIX and $ROUTER.
#   import → mcp/src/tools/mapAttackSurface.ts's extractImports(). Captures
#            $SYMBOL and $MODULE. (A rule may leave $SYMBOL unbound where the
#            language's own form introduces no separate local name — see the
#            per-rule comments below; extractImports() then drops that match,
#            since it currently requires both fields.)
#   env    → mcp/src/surface/collectors/envVars.ts. Captures $NAME.
# All four kinds are reconstructed the same way when Semgrep redacts
# `extra.metavars` (mcp/src/surface/recoverMetavars.ts), regardless of which
# file reads the result afterward.
#
# ---- Import rules: two Semgrep quirks that recur across languages ---------
#
# Both measured against Semgrep 1.86.0 (ground truth, via Docker) and
# reproduced on 1.164.0 (redacting); `recoverMetavars.ts`'s per-language
# import synthesizers reproduce both deliberately, so recovered output on a
# redacting Semgrep matches what an intact run reports.
#
#   1. A metavariable that captures more than one path segment
#      (`$MODULE` in `use $MODULE::$SYMBOL;`, `$MODULE` in
#      `import $MODULE;`, …) has its `abstract_content` joined with a SPACE,
#      not the language's own separator: `crate::models` reports as
#      "crate models", `App\Http\Controllers` as "App Http Controllers",
#      `java.util.Collections` as "java util Collections". Not a choice made
#      in this file — Semgrep's own rendering for a multi-segment capture.
#   2. A brace-delimited GROUP (Go's `import ( ... )`, Rust's
#      `use $M::{ ... };`) reports one match per item, but each item's span
#      is not tight — it starts at the group's opening token and GROWS to
#      include every item up to and including the current one. Recovering
#      the FIRST string/identifier in such a span (the strategy every other
#      guardian_kind in this file uses) would recover the same first item for
#      every match in the group; the Go and Rust synthesizers in
#      recoverMetavars.ts take the LAST one instead.
#
# Namespaced frameworks: register_rest_route takes the namespace and the route
# as two arguments. Semgrep cannot concatenate metavariables into a third, so
# the rule captures $NS and $ROUTE separately; extract.ts puts $NS on
# RouteRecord.namespace and $ROUTE on path_raw, and resolvers/wordpress.ts
# combines them into the served /wp-json path.
#
# HTTP verb: Semgrep reports *that* a pattern-either fired, never *which*
# alternative did. A rule whose verb is encoded in the alternative therefore
# has to be one rule per verb, each declaring `metadata.method` — which the
# extractor reads as the fallback when no $METHOD metavariable was captured.
# That is why @Get/@Post/... are five rules and not one. Verb-less rules
# (Flask's @app.route, Django path(), Spring @RequestMapping) correctly omit
# the key and are reported as ANY.
#
# ---- Attribute/decorator patterns must include the declaration -------------
#
# Measured against Semgrep 1.86.0 on mcp/test/fixtures/surface/apps/:
#
#   `#[get($PATH)]`     (Rust)  parses, and then matches EVERY node in the
#                               file — 95 matches for 3 routes, all binding
#                               `metavars: {}`. Spans included `use` lines and
#                               function bodies.
#   `[HttpGet($PATH)]`  (C#)    parses as a collection expression and matches
#                               nothing at all.
#   `@Get($PATH)`       (TS)    does not parse: "Invalid pattern for
#                               TypeScript", which Semgrep reports as a rule
#                               error on every run.
#
# All three become exact when the pattern includes the item the attribute is
# attached to (`#[get($PATH, ...)] fn $F(...) { ... }`). The match span then
# covers the attribute *and* the declaration — and that used to cost these
# three families their recovery entirely.
#
# ---- Why they need `focus-metavariable: $PATH` -----------------------------
#
# Semgrep's span for a declaration-spanning match starts at the FIRST attribute
# on the declaration, which is very often not the route one:
#
#   #[allow(dead_code)]              [Produces("application/json")]
#   #[get("/d")]                     // [HttpGet("/orders/legacy")]
#   async fn d() { … }               [HttpGet("/orders")]
#
# On any Semgrep that redacts match content (>= ~1.120 without `semgrep login`)
# `surface/recoverMetavars.ts` has only that span to work from. FOUR ways of
# reading it were tried and every one INVENTED routes:
#
#   - anchoring on the first argument list read `dead_code` and
#     `"application/json"` as paths;
#   - anchoring on the route attribute by name read the commented-out
#     `/orders/legacy` above, while the live `/orders` disappeared.
#
# Both pass the extractor's literal test, so each was emitted as a *resolved*
# path — a URL a DAST consumer would go on to request. That is not a tuning
# problem: deciding whether text is code, a comment or a string is not local
# information, and the span starts mid-file.
#
# `focus-metavariable: $PATH` removes the question rather than answering it.
# Semgrep narrows the REPORTED RANGE to the metavariable's own range, so the
# byte offsets point at the path literal itself. There is nothing left to
# search for and nothing to lex — Semgrep resolved it, with a real parser for
# the language. Recovery for such a rule is simply "the span is the value".
#
# So each of the three declares BOTH `focus-metavariable: $PATH` and
# `metadata.guardian_focus: path`. The flag is what `recoverMetavars.ts` reads:
# the rule pack is the thing that knows whether it focused, so the coupling is
# explicit and testable instead of inferred from the framework name.
# `mcp/test/unit/surface/rulePack.test.ts` asserts the two stay in lock-step —
# declaring either without the other fails the suite. If you widen a fourth
# family to span its declaration, focus it the same way.
#
# Measured on Semgrep 1.164.0 (redacting) against the adversarial fixtures,
# which carry a commented-out route attribute, attribute-shaped text inside a
# string, a foreign leading attribute, apostrophes and a Rust lifetime: every
# decoy ignored, quotes preserved, and the reported spans byte-for-byte equal to
# 1.86.0's `$PATH` captures. All thirteen route families now read identically on
# both versions — coverage no longer depends on the Semgrep version, or on being
# logged in.
#
# ---- Focusing discards every other capture, `$METHOD` included -------------
#
# That is why actix is five rules again, one per verb, each declaring
# `metadata.method`: with the range narrowed to `$PATH` there is no `$METHOD`
# left to read, on either Semgrep version. Per-verb discrimination was measured
# across all three languages — six rules over three files, each matching only
# its own verb — so the reason actix was once collapsed into a single
# `$METHOD`-binding rule no longer holds.
#
# The other ten families are deliberately NOT focused. Their spans already begin
# at the call or annotation that matched, their recovery is verified
# slot-for-slot against 1.86.0 (60 captures, zero disagreements), and several of
# them capture `$METHOD` as a metavariable, which focusing would throw away.
# Uniformity is not worth re-opening ten working families; focusing them all is
# a possible future simplification, not a pending fix.
#
# ---- Do NOT add a $PATH literal guard to a route rule ----------------------
#
# A `metavariable-regex` pinning $PATH to a string literal DROPS the match:
# the extractor never sees it. That is the wrong outcome for a route rule,
# because a route registered with a computed path — `@GetMapping(Paths.ORDERS)`,
# `path(settings.ADMIN_URL, ...)`, `register_rest_route(self::NAMESPACE, ...)` —
# is still surface, and dropping it makes `coverage` report `no_matches` for
# the language: a "this application exposes nothing" falsehood of exactly the
# class mcp/src/tools/mapAttackSurface.ts:8-15 forbids. The extractor's
# `isLiteralPath` is what handles those: it keeps the route and flags it
# `path_partial: true` at 'low' confidence, never guessing the path. That guard
# is load-bearing and lives in one place — `toRoute` applies it to every route
# unconditionally — so a rule added to THIS FILE is covered the moment it is
# written, with no per-rule opt-in to forget.
#
# It covers this file and only this file: `map_attack_surface` runs
# `configs/semgrep/routes.yml` as its single `--config` and discovers nothing
# else. A project's own rules registered through `register_custom_rules` are
# recorded for the SAST tools, not for this scan (and as of today nothing reads
# them back, so they reach no scan at all).
#
# Exactly two rules carry a $PATH guard, and only because their pattern does
# not identify a route on its own — there the guard disambiguates rather than
# discards:
#
#   guardian-route-rails    `$METHOD $PATH` matches ANY one-argument Ruby
#                           call (`get foo`), so without the literal the rule
#                           would report arbitrary method calls as routes.
#   guardian-route-express  `$APP.$METHOD($PATH, ...)` matches any two-arg
#                           method call on any object.
#
# `guardian-mount-express` keeps its $PREFIX guard for the same reason.
# Every other rule below names its framework's registration API explicitly, so
# a match IS a route and the path is the extractor's problem, not the pack's.
#
# Mount resolution (Node only): resolvers/node.ts's resolveNodeMounts()
# resolves a route's prefix for any route whose `language` is javascript or
# typescript — gated purely on that field, not on a per-rule opt-in flag. A
# rule pack author adding a new JS/TS-family framework gets mount resolution
# for free; nothing in this file needs to be set for it.

rules:
  # ---------- JavaScript / TypeScript ----------
  - id: guardian-route-express
    languages: [javascript, typescript]
    severity: INFO
    message: express/fastify route
    metadata:
      guardian_kind: route
      framework: express
      confidence: high
    patterns:
      - pattern: $APP.$METHOD($PATH, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|options|head|all)$
      # Disambiguating, not discarding — see the header.
      - metavariable-regex:
          metavariable: $PATH
          regex: ^['"`]/.*

  - id: guardian-mount-express
    languages: [javascript, typescript]
    severity: INFO
    message: express router mount
    metadata:
      guardian_kind: mount
      framework: express
    patterns:
      - pattern: $APP.use($PREFIX, $ROUTER)
      - metavariable-regex:
          metavariable: $PREFIX
          regex: ^['"`]/.*

  # CORRECTION, not only an addition: this rule used to match only the default
  # import and `require` forms, missing `import { foo } from "./bar"` and
  # `import * as ns from "./bar"` — the dominant forms in modern TypeScript.
  # That gap silently weakened resolveNodeMounts (resolvers/node.ts): before
  # this rule existed, a router bound by name or namespace produced no
  # $SYMBOL for buildPrefixIndex to match against at all, so its route could
  # never resolve. Whether either form resolves NOW is measured, not
  # assumed, and the honest answer is more qualified than "this rule fixes
  # it" — see test/fixtures/surface/apps/node-mount-forms/ and the
  # version-conditional covering assertion in rulePackFixture.test.ts.
  #
  # buildPrefixIndex (resolvers/node.ts, untouched by this change) requires
  # EXACT string equality between a mount's $ROUTER and an import's $SYMBOL.
  # On a Semgrep that reports real metavariables — checked against this
  # exact fixture file via `docker run semgrep/semgrep:1.86.0`, not assumed
  # — NEITHER form survives that check:
  #
  #   - namespace: `app.use(prefix, ns.router)` binds $ROUTER to the whole
  #     member-access expression, "ns.router" — never equal to the
  #     import's $SYMBOL, the bare alias "ns".
  #   - named: `app.use(prefix, namedRouter)` binds $ROUTER to
  #     "namedRouter namedRouter" — Semgrep's own constant-propagation
  #     rendering DOUBLES a name that is also bound by a destructured
  #     import in the same file — never equal to the import's $SYMBOL,
  #     the undoubled "namedRouter".
  #
  # Both then correctly stay path_partial: true — the honest outcome for a
  # link this resolver cannot follow.
  #
  # Measured on THIS project's actual pipeline (a redacting Semgrep, local
  # 1.164.0, recovered by recoverMetavars.ts) the observed result for BOTH
  # is different, for a reason outside this rule's control: `synthesizeMount`
  # there (a separate, pre-existing function, untouched by this change)
  # never reads Semgrep's `abstract_content` rendering at all — it slices
  # $ROUTER out of the raw source bytes as a single identifier, stopping at
  # the first non-identifier character. That sidesteps BOTH problems above
  # by coincidence, not by correctly interpreting either shape:
  # "ns.router" recovers as bare "ns", which happens to equal the import's
  # $SYMBOL; "namedRouter" recovers undoubled — there is no
  # constant-propagation pass in a regex over bytes — which also happens to
  # equal it. Both routes resolve on this pipeline as a result. The
  # namespace coincidence generalises badly: the same truncation would apply
  # whatever prefix is in scope to EVERY route in a namespace-imported
  # module, regardless of which of several exports a mount statement
  # actually named, since resolution happens per FILE, not per property. The
  # named coincidence does not generalise the same way — recovery's raw text
  # for a destructured name is simply correct there, for reasons unrelated
  # to Semgrep's own constant-propagation.
  #
  # Whether either form should instead read path_partial on every Semgrep
  # version, the way the non-redacted path already does for both, is a
  # decision for resolvers/node.ts and recoverMetavars.ts — flagged here,
  # not fixed here; this diff does not touch either file.
  #
  # Measured against Semgrep 1.86.0 (ground truth) and 1.164.0 (redacting):
  # `import { $SYMBOL, ... } from "$MODULE"` ALSO matches a bare default
  # import (`import x from "m"`) and the default half of a mixed import
  # (`import x, { y } from "m"`), binding $SYMBOL to the default name in both
  # cases — a Semgrep generic-import equivalence, not a bug in this pattern.
  # Combined with the existing default-import alternative in one rule, the
  # overlap does not double-count: Semgrep dedupes identical (rule, span)
  # pairs, verified by running all four alternatives together against every
  # form in one file and getting exactly one match per import statement.
  #
  # A named import that binds SEVERAL symbols
  # (`import { a, b, c } from "./m"`) still produces exactly ONE match:
  # Semgrep cannot emit several results from one pattern-either alternative,
  # and always binds $SYMBOL to the FIRST listed name — measured against a
  # 3-name and a 9-name real import (node-nest/users.controller.ts's NestJS
  # import). `b` and `c` are invisible to this rule, not fabricated as
  # anything. Downstream, this means a file that imports a mounted router
  # alongside other names in the same statement resolves only if the router
  # is listed first — a real, measured limitation, not silently patched over.
  - id: guardian-import-esm
    languages: [javascript, typescript]
    severity: INFO
    message: module import
    metadata:
      guardian_kind: import
      framework: esm
    pattern-either:
      - pattern: import $SYMBOL from "$MODULE"
      - pattern: const $SYMBOL = require("$MODULE")
      - pattern: import { $SYMBOL, ... } from "$MODULE"
      - pattern: import * as $SYMBOL from "$MODULE"

  # NestJS: one rule per verb — the decorator name is the method, and Semgrep
  # cannot report which pattern-either alternative matched. `@$DEC($PATH)` is
  # not a parseable TypeScript pattern either way.
  #
  # focus-metavariable narrows the reported range to $PATH; see the header.
  # `@HttpCode(204)` and a commented-out `// @Get('legacy/:id')` above the live
  # decorator are both ignored, because nothing is searched for.
  - id: guardian-route-nestjs-get
    languages: [typescript]
    severity: INFO
    message: NestJS route
    metadata:
      guardian_kind: route
      framework: nestjs
      confidence: medium
      method: GET
      guardian_focus: path
    patterns:
      - pattern: |
          @Get($PATH, ...)
          $M(...) { ... }
      - focus-metavariable: $PATH

  - id: guardian-route-nestjs-post
    languages: [typescript]
    severity: INFO
    message: NestJS route
    metadata:
      guardian_kind: route
      framework: nestjs
      confidence: medium
      method: POST
      guardian_focus: path
    patterns:
      - pattern: |
          @Post($PATH, ...)
          $M(...) { ... }
      - focus-metavariable: $PATH

  - id: guardian-route-nestjs-put
    languages: [typescript]
    severity: INFO
    message: NestJS route
    metadata:
      guardian_kind: route
      framework: nestjs
      confidence: medium
      method: PUT
      guardian_focus: path
    patterns:
      - pattern: |
          @Put($PATH, ...)
          $M(...) { ... }
      - focus-metavariable: $PATH

  - id: guardian-route-nestjs-patch
    languages: [typescript]
    severity: INFO
    message: NestJS route
    metadata:
      guardian_kind: route
      framework: nestjs
      confidence: medium
      method: PATCH
      guardian_focus: path
    patterns:
      - pattern: |
          @Patch($PATH, ...)
          $M(...) { ... }
      - focus-metavariable: $PATH

  - id: guardian-route-nestjs-delete
    languages: [typescript]
    severity: INFO
    message: NestJS route
    metadata:
      guardian_kind: route
      framework: nestjs
      confidence: medium
      method: DELETE
      guardian_focus: path
    patterns:
      - pattern: |
          @Delete($PATH, ...)
          $M(...) { ... }
      - focus-metavariable: $PATH

  # ---------- Python ----------
  - id: guardian-route-flask
    languages: [python]
    severity: INFO
    message: Flask route
    metadata:
      guardian_kind: route
      framework: flask
      confidence: high
    pattern-either:
      - pattern: "@$APP.route($PATH, ...)"
      - pattern: "@$APP.route($PATH)"

  - id: guardian-route-fastapi
    languages: [python]
    severity: INFO
    message: FastAPI route
    metadata:
      guardian_kind: route
      framework: fastapi
      confidence: high
    patterns:
      - pattern: "@$APP.$METHOD($PATH, ...)"
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|options|head)$

  # Qualified callee, not the bare name. `path(...)` is an ordinary function
  # name: measured against Semgrep 1.86.0, the bare form reported three routes
  # out of a module whose only crime was defining `def path(*parts)` around
  # os.path.join — and two of them ("etc", "var") passed the extractor's
  # literal test, so they were emitted as resolved URLs that exist nowhere.
  # Writing the fully-qualified name makes Semgrep resolve the import instead
  # of the spelling, so a local helper of the same name no longer matches while
  # `from django.urls import path` still does. This is NOT a $PATH guard: a
  # computed path (`path(settings.ADMIN_URL, ...)`) still matches and is still
  # reported, flagged path_partial by the extractor.
  - id: guardian-route-django
    languages: [python]
    severity: INFO
    message: Django URL pattern
    metadata:
      guardian_kind: route
      framework: django
      confidence: medium
    pattern-either:
      - pattern: django.urls.path($PATH, ...)
      - pattern: django.urls.re_path($PATH, ...)

  # `from $MODULE import $SYMBOL` covers every relative form for free: Semgrep
  # binds $MODULE to `.`, `.models` or `..shared` exactly as written for
  # `from . import x` / `from .models import x` / `from ..shared import x` —
  # measured against all three, ground-truthed on 1.86.0. A multi-name import
  # (`from fastapi import APIRouter, FastAPI`) still yields ONE match, $SYMBOL
  # bound to the first name only — same limitation as the JS/TS named-import
  # gap above, and for the same reason: Semgrep cannot emit several matches
  # from one pattern-either alternative.
  #
  # `import $MODULE` (no `from`) binds $MODULE alone. Python's own semantics
  # say the bound name IS the module ($MODULE and the "symbol" are the same
  # text), but Semgrep has no way to bind one captured node under two
  # metavariable names in one pattern — there is no second, distinct span to
  # capture as $SYMBOL, so this alternative never binds it. Confirmed on both
  # Semgrep versions. A consumer requiring both fields drops this shape.
  - id: guardian-import-python
    languages: [python]
    severity: INFO
    message: module import
    metadata:
      guardian_kind: import
      framework: python
    pattern-either:
      - pattern: from $MODULE import $SYMBOL
      - pattern: import $MODULE

  # ---------- PHP / WordPress ----------
  - id: guardian-route-wp-rest
    languages: [php]
    severity: INFO
    message: WordPress REST route
    metadata:
      guardian_kind: route
      framework: wp-rest
      confidence: medium
    pattern: register_rest_route($NS, $ROUTE, ...)

  - id: guardian-route-laravel
    languages: [php]
    severity: INFO
    message: Laravel route
    metadata:
      guardian_kind: route
      framework: laravel
      confidence: medium
    patterns:
      - pattern: Route::$METHOD($PATH, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(get|post|put|patch|delete|options|any)$

  # `use $MODULE\$SYMBOL;` splits at the LAST namespace separator: for
  # `use App\Http\Controllers\OrderController;`, $SYMBOL is the class name
  # `OrderController` and $MODULE is the rest — ground-truthed on 1.86.0.
  # When $MODULE itself spans more than one segment, Semgrep's own
  # `abstract_content` for it joins the segments with a SPACE, not `\` (e.g.
  # `App Http Controllers`, not `App\Http\Controllers`) — a Semgrep rendering
  # quirk for any multi-segment metavariable capture, not something this rule
  # controls. `recoverMetavars.ts` reproduces the same join so a redacted run
  # recovers byte-identical output to an intact one.
  - id: guardian-import-php
    languages: [php]
    severity: INFO
    message: use declaration
    metadata:
      guardian_kind: import
      framework: php
    pattern: use $MODULE\$SYMBOL;

  # ---------- Go ----------
  - id: guardian-route-go-nethttp
    languages: [go]
    severity: INFO
    message: net/http handler
    metadata:
      guardian_kind: route
      framework: net-http
      confidence: medium
    pattern-either:
      - pattern: http.HandleFunc($PATH, ...)
      - pattern: $MUX.HandleFunc($PATH, ...)

  - id: guardian-route-go-gin
    languages: [go]
    severity: INFO
    message: Gin route
    metadata:
      guardian_kind: route
      framework: gin
      confidence: medium
    patterns:
      - pattern: $R.$METHOD($PATH, ...)
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(GET|POST|PUT|PATCH|DELETE|OPTIONS|HEAD|Any)$

  # Four alternatives: single and grouped, each with and without an explicit
  # local alias (`import myhttp "net/http"`). The grouped forms use an
  # ellipsis-wrapped spec so they match a `import (...)` block regardless of
  # how many other specs sit alongside it — measured to yield ONE match PER
  # spec in the block (4 specs in, 4 matches out), unlike the JS/TS
  # named-import case, so there is no first-only limitation here.
  #
  # The unaliased forms bind $MODULE only: Go's implicit local package name is
  # whatever the target package declares, which is not present in the import
  # statement's own text, so there is nothing honest to bind as $SYMBOL.
  - id: guardian-import-go
    languages: [go]
    severity: INFO
    message: module import
    metadata:
      guardian_kind: import
      framework: go
    pattern-either:
      - pattern: import $SYMBOL "$MODULE"
      - pattern: import "$MODULE"
      - pattern: |
          import (
            ...
            $SYMBOL "$MODULE"
            ...
          )
      - pattern: |
          import (
            ...
            "$MODULE"
            ...
          )

  # ---------- Rust ----------
  # FIVE rules, one per verb. Semgrep's Rust engine does bind the attribute name
  # to `$METHOD`, and this was a single `#[$METHOD($PATH, ...)]` rule for that
  # reason — but `focus-metavariable: $PATH` narrows the reported range to the
  # path and discards every other capture, `$METHOD` included, so the verb has
  # to arrive as `metadata.method`. Per-verb discrimination is measured: each
  # rule below matches only its own attribute.
  #
  # The trailing `fn $F(...) { ... }` is load-bearing, not decoration: without
  # it, per-verb rules matched every node in the file and bound nothing, so one
  # `#[get("/x")]` produced five routes — the real GET plus four fabricated ones
  # — with spans that were function bodies rather than routes. That is what the
  # `$F` and the braces prevent; the focus is what makes the resulting span
  # readable again. See the attribute note in the header.
  #
  # KNOWN LIMITATION — single-argument attributes only. Despite the `, ...`,
  # these do NOT match Rocket's multi-argument forms:
  #
  #   #[post("/x", data = "<t>")]        0 matches on 1.164.0 and on 1.86.0
  #   #[get("/x", rank = 2)]             0 matches on 1.164.0 and on 1.86.0
  #
  # Measured, not assumed. `#[$METHOD($PATH, $EXTRA)] fn $F(...) { ... }` does
  # not match them either; only a bare `#[$METHOD(...)]` does, and that binds no
  # $PATH at all — which would hand the extractor a route with no path. Actix's
  # single-argument attribute, the common case, works; Rocket routes carrying
  # `data`, `rank` or `format` are simply not reported. Under-reporting a route
  # is a gap; reporting one at a path we did not read would be a lie.
  - id: guardian-route-rust-actix-get
    languages: [rust]
    severity: INFO
    message: Actix/Rocket route attribute
    metadata:
      guardian_kind: route
      framework: actix
      confidence: medium
      method: GET
      guardian_focus: path
    patterns:
      - pattern: "#[get($PATH, ...)] fn $F(...) { ... }"
      - focus-metavariable: $PATH

  - id: guardian-route-rust-actix-post
    languages: [rust]
    severity: INFO
    message: Actix/Rocket route attribute
    metadata:
      guardian_kind: route
