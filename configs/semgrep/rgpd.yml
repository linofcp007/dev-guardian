  # PHP: WordPress primeiro, porque é onde o PHP escreve dados pessoais em
  # logs — `error_log()` com `$user->user_email`, e o `wc_get_logger()` do
  # WooCommerce com `$order->get_billing_email()`. Depois PSR-3 (Monolog,
  # Symfony), a facade `Log::` do Laravel e o `syslog()`.
  #
  # O `$NAME` do PHP inclui o `$` no texto, por isso o regex do nome abre com
  # `^\$` em vez de `^`; o corpo é o mesmo.
  - id: rgpd-pii-in-log-php
    languages: [php]
    severity: WARNING
    message: >-
      Dado pessoal num log (NIF, NISS, Cartão de Cidadão, IBAN, telefone ou
      email, reconhecido pelo nome da variavel ou do campo). O `error_log()` e
      os ficheiros do WooCommerce ficam no servidor e nos backups muito para
      la do prazo de conservação dos dados de origem, fora do controlo de
      acesso da aplicação — isto contraria a minimização (RGPD, art. 5.º,
      n.º 1, al. c)) e torna o apagamento (art. 17.º) impraticavel. Registe o
      ID interno (`$user->ID`, `$order->get_id()`) ou uma forma mascarada.
      Se o valor nao é de uma pessoa (o `admin_email` do site), o nome engana
      e este aviso é ruido.
