      - pattern-either:
          - patterns:
              - pattern-inside: $LOGGER->$METHOD(...)
              - metavariable-regex:
                  metavariable: $LOGGER
                  regex: '^(?:.*->)?\$?_?(?:logger|log)$|^wc_get_logger\(\)$'
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: '^(?:emergency|alert|critical|error|warning|notice|info|debug|log)$'
