# REVISAO DESTA MEDIÇAO (ronda de correção 1, 2026-09-27). A revisao achou
# um guarda largo de mais — o `$V` da leitura de atributo engolia uma
# chamada de log DENTRO de um callback — e tres pontos menores: o
# `ElementAt` lido como uma data, uma base de `class Command` que nao era do
