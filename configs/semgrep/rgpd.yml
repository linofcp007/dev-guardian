#
# ---------------------------------------------------------------------------
# POR QUE NAO SE PROCURAM OS FORMATOS (`PT50` + 21 digitos, `+351 9xx`, nove
# digitos de NIF). Um literal de IBAN ou de telefone num log é quase sempre o
# da propria empresa — "transfira para PT50...", "ligue para +351 21..." —, e
# isso nao é um dado pessoal de ninguem. Os dados dos titulares entram no log
# por VARIAVEIS, e sao as variaveis que as regras seguem. Nove digitos
# soltos, por sua vez, sao indistinguiveis de qualquer outro numero.
#
# ---------------------------------------------------------------------------
# OS GUARDAS DOS RASTREADORES SAO `pattern-not-regex`, de proposito. O
# `base.yml` documenta o `pattern-not-regex` como armadilha numa regra de AST
# — um guarda de texto que casa comentarios e strings. Aqui as regras SAO de
# texto (`languages: [generic]`), e o guarda de texto é a unica forma
# disponivel. A semantica que importa: o Semgrep so exclui um resultado se o
# intervalo do `pattern-not-regex` CONTIVER o intervalo do resultado. Os
# guardas usam isso de tres maneiras:
#
#   - ELEMENTO: `<script type="text/plain">...</script>` contem tudo o que
#     esta dentro dele. É a convenção de bloqueio de todas as CMP (Cookiebot,
#     CookieConsent, Complianz, Klaro, iubenda): o navegador nao descarrega
#     nem executa um script de tipo desconhecido.
#   - FICHEIRO: `\A.*X.*\z` casa o ficheiro inteiro quando X existe em
#     qualquer lado. Usado para o Consent Mode v2 com `denied` por omissao e
#     para o `fbq('consent', 'revoke')` da Meta — declarações que valem para
#     a pagina toda e cuja posição relativa ao loader nao importa (o
#     dataLayer e a fila do fbq processam os comandos por ordem).
#   - BLOCO: um bloco inteiro de chavetas EQUILIBRADAS — um
#     `(\{(?:[^{}]++|(?1))*\})` recursivo do PCRE — aberto por uma condição
#     ou um callback que fala de consentimento (`if
#     (wp_has_consent('statistics')) {`, `onConsent('marketing', () => {`).
#     Um bloco que ja fechou antes do alvo nao conta, e a fixture de hits tem
#     essa forma. A palavra tem de estar na MESMA LINHA da chaveta: um
#     docblock que menciona "consentimento" duas linhas acima de uma função
#     nao a torna guardada.
#   - JSX e TEMPLATE: o mesmo principio para `{consent && ...}` e para as
#     condições de template sem chavetas — ver a secção dos rastreadores.
#
# Os dois guardas de FICHEIRO saltam comentarios HTML (`<!-- -->`), de
# bloco (`/* */`, ronda 2) e de linha (`//`), desde que o `/*` ou o `//` nao
# façam parte de um URL, de uma string ou de um `image/*`: uma declaração
# comentada nao declara nada. Achados T8 (ronda 1) e M3 (ronda 2), em hits/.
#
# ---------------------------------------------------------------------------
# PONTOS CEGOS CONHECIDOS, escritos para que ninguem os tome por cobertura:
#
# - Log: nomes que nao dizem o que guardam (`value`, `data`, `u.e`), objetos
#   inteiros (`logger.info(user)`), `JSON.stringify(req.body)`, e o IP, que é
#   dado pessoal (TJUE, Breyer) mas cujo registo é quase sempre legitimo
#   (seguranca) e inundaria o resultado.
# - Log: `logging.getLogger(__name__).info(email)` numa linha so, o modulo
#   `debug` do npm, `trigger_error` em PHP, e em C# `Substring(Length - 4)`
#   nao é reconhecido como os ultimos digitos. Os valores derivados so sao
#   reconhecidos por NOME da chamada (`len`, `strlen`, `count`, `exists`,
#   `has`, `includes`, `test`, `is...`, `Boolean`/`bool`), pelo nome de um
#   atributo lido (`.length`, `.Length`, `.id`) e, em JS, `!x`; `x is None`
#   do Python nao.
# - Log: o guarda da leitura de atributo decide pelo NOME do atributo: um
#   `email.data_envio` ou um `email.subject` continuam a disparar, e um
#   atributo que guardasse o valor com um nome da lista (`phone.id` a guardar
#   o numero) seria excluido. O caso portugues mais provavel é o NIF: em
#   codigo portugues o `id` de um contribuinte é muitas vezes o proprio NIF,
#   e `log(contribuinte.id)` ou `log(nif.id)` sao excluidos como se fossem um
#   id interno. Nenhuma mudança da regra separa os dois casos: o Django, o
#   Rails, o Laravel e o EF dao a cada entidade um `id` substituto, e é esse
#   id interno que a mensagem destas regras manda registar; um NIF guardado
#   como chave chama-se quase sempre `nif`, e `log(contribuinte.nif)`
#   continua a disparar. Do mesmo lado do guarda fica um metodo com um nome
#   da lista que devolve o proprio elemento: so o `ElementAt` do LINQ é
#   reconhecido, e `emails.findById(x)` ou o `objectAt` do Ember nao.
# - Log: o limite do `$V` le o TEXTO. Um corpo de função sem `=>`,
#   `function`, `lambda` ou `delegate` (no PHP, `fn` ou `function`) — o
#   metodo abreviado de um objeto JS, `{ m() { ... } }` — continua a ser
#   excluido, e um `$V` com uma dessas palavras numa string perde o guarda:
#   um falso positivo possivel, nunca um achado escondido.
# - Log: o `print()` de um comando de gestao do Django nao conta, mesmo num
#   comando que corre como daemon e cuja saida vai para um ficheiro de log, e
#   tambem nao conta com `file=sys.stderr` ou outro `file=`; um logger dentro
#   do mesmo comando conta. Um comando que estende outro importado com um
#   ALIAS (`from ...runserver import Command as RunserverCommand`) nao é
#   reconhecido como comando, e o `print()` dele dispara; o `modulo.Command`
#   é reconhecido.
# - Rastreadores: GA carregado por codigo JS que monta o `<script>`
#   (`s.src = '...gtag/js'`), `react-ga4`, o Google Tag Manager (o GTM pode
#   gerir o consentimento por dentro), `wp_register_script` seguido de
#   `wp_enqueue_script('handle')`, um `src={CONSTANTE}` em JSX, o `:src`
#   do Vue, e ficheiros `.svelte`, `.astro`, `.erb`, `.liquid`, `.njk` — que
#   o `paths.include` nao lista porque nao ha fixture que o prove. Um
#   rastreador comentado (`<!-- <script src=...gtag/js> -->`) dispara.
# - O Consent Mode v2 com `analytics_storage` a `denied` e o `fbq('consent',
#   'revoke')` sao tratados como guarda por decisao documentada, e as
#   mensagens dizem que isso é uma decisao juridica e nao uma correção (ver
#   as regras). O template do pack usa o modo basico: nada carrega antes do
#   consentimento.
# - Uma condição que SIGNIFICA "sem consentimento" sem usar `!` nem `not`
#   conta como guarda: `if (consent === 'denied')`, `{% if cookie_consent ==
#   'rejected' %}`. O guarda só lê a palavra "consent" e a ausencia de
#   negação; o valor comparado fica fora do seu alcance. O ramo ELSE dessas
#   condições é acusado (ronda 2), o ramo ENTAO nao.
# - O limite é o FICHEIRO. Desde que o `*.js` é lido (ronda 1), um modulo
#   auxiliar como `export function loadMetaPixel() { fbq('init', ...) }`
#   dispara mesmo que so seja chamado de dentro de um callback de
#   consentimento noutro ficheiro: a regra nao segue chamadas entre
#   ficheiros. Suprima o achado nesse modulo, ou mova o init para o callback.
#
# ---------------------------------------------------------------------------
# CINCO CARACTERES SAO PROIBIDOS NESTE FICHEIRO, incluindo nos comentarios: o A
# maiusculo com acento agudo (U+00C1), o I maiusculo com acento agudo
# (U+00CD), e mais tres que o portugues nao usa (U+00CF, U+00D0, U+00DD). O
# carregador de configuração do Semgrep descodifica este ficheiro com o codec
# do LOCALE e nao em UTF-8; num locale cp1252 UM deles derruba o ficheiro
# inteiro e o scan devolve `results: 0`, `paths.scanned: 0`, `errors: 0`. O
# `semgrepPacks.test.ts` apanha isto em todos os packs. Os acentos minusculos
# sao todos seguros, e `Ã À Â É Ê Ó Ô Õ Ú Ç` tambem.

# metadata.cwe / metadata.owasp: o CWE de cada regra (MITRE, CWE 4.20) e a
# categoria OWASP Top 10:2025 que o mapeamento oficial da OWASP atribui a
# esse CWE (https://owasp.org/Top10/2025/, lido em 2026-09-28). Uma regra
# cujo CWE não consta de nenhuma categoria fica com `owasp: []`; uma falha
# que nenhum CWE descreve com rigor fica com `cwe: []`. Os valores são
# listas, nunca texto solto: o parser do Semgrep deriva a subcategoria de um
# `owasp` em texto, e as findings destas regras não podem mudar por isso.
# O Semgrep não usa `metadata` para casar padrões, logo nada do que as
# regras apanham muda (medido: as mesmas findings antes e depois, fixture a
# fixture).
#
# Dados pessoais num log são CWE-532 (o Base exato: informação sensível
# escrita num log), o que a OWASP arruma em A09. Um tracker ou um embed
# carregado antes do consentimento é CWE-359, cuja própria definição fala de
# informação pessoal exposta sem o consentimento da pessoa, e a OWASP
# arruma-o em A01 — a categoria da finding é a oficial. Isso não faz deste
# pack um teste de controlo de acessos: o cálculo de cobertura
# (`frameworks/coverage.ts`) conta as regras por linguagem de código, e as
# quatro regras `generic` sobre templates não contam para nenhuma.

rules:
  # ---------------------------------------------------------------------------
  # DADOS PESSOAIS EM LOGS
  #
  # Forma comum as quatro: o recetor e o metodo de log sao filtrados por
  # regex, o valor é um de tres (ou quatro) ramos — membro, identificador,
  # subscrito com chave literal, e `.get('chave')` onde a linguagem o usa —,
  # e dois guardas de mascaramento excluem o valor que ja nao identifica
  # ninguem.
  #
  # O RESULTADO É O IDENTIFICADOR, nao a chamada: `logger.info({email,
  # nif})` da dois resultados, cada um na expressão que o causa. Isso é o que
  # deixa o guarda de mascaramento atuar por valor — `log(mask(email), nif)`
  # acusa o nif e nao o email — em vez de absolver a chamada inteira.
  #
  # O FILTRO DO METODO nao é decorativo: `log.push(email)` é um ARRAY chamado
  # log, e `Math.log(x)` é matematica. Os dois estao em misses/.
  #
  # O GUARDA DO VALOR DERIVADO casa uma chamada cujo nome COMEÇA por um verbo
  # de mascaramento (`mask`, `redact`, `hash`, `anonymize`, `mascarar`...),
  # é um hash conhecido (`md5`, `sha256`, `wp_hash`, o `createHash(...)
  # .update(x)` do Node), ou devolve um tamanho ou um booleano (`len`,
  # `strlen`, `count`, `exists`, `has`, `includes`, `test`, `isX`,
  # `Boolean`). O regex é o mesmo nas quatro regras, com `.`, `->` e `::`
  # como separadores. Sem o filtro do nome, `$MASK(...)` casaria a PROPRIA
  # chamada de log e a regra deixava de encontrar fosse o que fosse.
  #
  # `truncate` SAIU da lista na ronda 1: `truncate(email, 30)` escreve o
  # email inteiro quase sempre, e esta em hits/.
  #
  # O verbo tem de estar no ULTIMO segmento — o nome da função chamada — e
  # nao em qualquer segmento do caminho (ronda 2): antes,
  # `this.hashing.logger.info('x', user.email)` contava como uma chamada de
  # mascaramento por causa do `hashing` do recetor, e a linha ficava muda.
  # Esta em hits/.
  #
  # O GUARDA DOS ULTIMOS DIGITOS (`iban.slice(-4)`, `iban[-4:]`,
  # `substr($iban, -4)`, `iban[^4..]`) existe porque é a pratica bancaria
  # corrente para identificar uma conta num log sem a expor.
  #
  # O GUARDA DA LEITURA DE ATRIBUTO (ronda de codigo de aplicação): um valor
  # que so aparece como o OBJETO de uma leitura de um atributo cujo NOME diz
  # que é um identificador, uma data ou um tamanho — `email.id`,
  # `email.scheduled_timestamp`, `obter_bot(dados["email"]).id`,
  # `user.email.length` — nao é o que chega ao log: chega o id, a data, o
  # tamanho. O `email` ali é um objeto (uma mensagem agendada) ou uma chave de
  # pesquisa. Medido no Zulip: tres falsos positivos com esta forma e nenhum
  # verdadeiro. O `focus-metavariable: $V` é o que impede o guarda de excluir
  # o proprio membro: `user.email` nao esta DENTRO de `user`.
  #
  # O regex do `$ATTR` (o mesmo nas quatro regras, e o teste exige-o) é uma
  # lista de NOMES, de proposito. Uma versao medida na mesma ronda, e nunca
  # publicada, excluia QUALQUER leitura de atributo que nao fosse uma chamada
  # de metodo; custava o mesmo tempo e perdia verdadeiros
  # positivos que o ramo do membro nao ve: `user.phone.as_e164` (o
  # django-phonenumber-field), `email.address`, `cliente.telefone.numero` —
  # atributos de nome neutro que guardam o proprio valor. Esses continuam em
  # hits/, e uma chamada de metodo (`email.lower()`, `email.toLowerCase()`,
  # `$email->toString()`) tambem, porque nenhum destes nomes esta na lista.
  # A lista: `id`, `pk`, `uuid`, `guid` e os sufixos `_id`/`Id`/`ID`,
  # `_uuid`/`Uuid`, `Guid`; as datas `_at`/`At`, `_em`/`Em` (`enviado_em`),
  # `_date`/`Date`, `_time`/`Time`, `timestamp`; e `length`, `size`, `count`.
  # O `At` nao conta depois de `Element`: o `ElementAt` do LINQ devolve o
  # proprio elemento (`emails.ElementAt(0)`), esta em hits/ (revisao desta
  # ronda). Efeito lateral: `email.Length` do C#, que era um ponto cego, sai
  # tambem.
  #
  # O `$V` NAO PODE CONTER O CORPO DE UMA FUNÇAO (revisao desta ronda). O
  # `$V` é aquilo em que o atributo é lido, e nao tem tamanho maximo: em
  # `users.filter((u) => { logger.warn(u.email) }).length` é a chamada
  # `users.filter(...)` inteira, com o callback e a chamada de log la
  # dentro, e o guarda excluia o achado que estava dentro dela. A primeira
  # versao perdeu assim quatro verdadeiros positivos, um por linguagem — um
  # `.length` depois de um `filter` com callback, o `.Count()` depois de um
  # `Where` do LINQ, o `.id` do job de um `add_job(lambda: ...)`, o `->id`
  # de um `fn () =>` do PHP —, todos em hits/. Por isso um `metavariable-regex`
  # sobre o `$V` recusa o guarda quando o texto do `$V` tem `=>`, `function`,
  # `lambda` ou `delegate`. No PHP a copia é outra: `=>` é o separador dos
  # arrays (`['e' => $email]`), e ali o corpo de uma função é `fn` ou
  # `function`. O teste avalia os dois regexes contra textos que tem e nao
  # tem corpo.
  #
  # O EIXO 2 DA ABLAÇAO VAI ACUSAR os dois guardas, e é o guarda a funcionar:
  # as duas ultimas linhas de cada fixture de hits poem um bug AO LADO de um
  # valor mascarado, para que uma exclusao larga de mais tenha onde aparecer.
  # Remover o guarda revela o valor mascarado nessa linha. Uma revelação
  # numa linha `(excluded: ...)` é o clause a fazer o seu trabalho.
  #
  # JS/TS: `console`, qualquer `logger`/`log`/`Logger` (incluindo o `Logger`
  # estatico do NestJS e o `req.log` do fastify), winston, pino — com o
  # `child({...})` do pino, que carimba o valor em todas as linhas seguintes
  # — e bunyan.
  - id: rgpd-pii-in-log-js
    metadata:
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - "A09:2025 - Security Logging and Alerting Failures"
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Dado pessoal num log (NIF, NISS, Cartão de Cidadão, IBAN, telefone ou
      email, reconhecido pelo nome da variavel ou do campo). Os logs sao
      copiados para agregadores, backups e terceiros (Sentry, Datadog,
      CloudWatch, as breadcrumbs da consola no browser) e ficam fora do
      controlo de acesso e do prazo de conservação dos dados de origem — isto
      contraria a minimização (RGPD, art. 5.º, n.º 1, al. c)) e torna o
      apagamento (art. 17.º) impraticavel. Registe um identificador interno ou
      uma forma mascarada (`mask(email)`, os ultimos 4 digitos do IBAN). Se o
      valor nao é de uma pessoa (a caixa de suporte, o telefone da loja), o
      nome engana e este aviso é ruido.
    patterns:
      - patterns:
          - pattern-inside: $LOGGER.$METHOD(...)
          - metavariable-regex:
              metavariable: $LOGGER
              regex: '^(?:.*\.)?(?:console|_?[Ll]ogger|_?log|winston|pino|bunyan)$'
          - metavariable-regex:
              metavariable: $METHOD
              regex: '^(?:log|info|warn|warning|error|debug|trace|fatal|verbose|silly|notice|critical|child)$'
      - pattern-either:
          - patterns:
              - pattern: $OBJ.$FIELD
              - metavariable-regex:
                  metavariable: $FIELD
                  regex: '^(?![A-Z][A-Z0-9]*_[A-Z0-9_]*$)(?!(?:[Ii]s|[Hh]as|[Ss]hould|[Cc]an|[Vv]alid|[Ii]nvalid|[Vv]alidate|[Vv]erify|[Cc]heck|[Pp]arse|[Nn]ormalize|[Nn]ormalise|[Ff]ormat|[Ss]end|[Ss]et|[Uu]pdate|[Ff]ind|[Ll]ookup|[Ss]earch|[Bb]uild|[Rr]ender|[Cc]ompose|[Rr]esolve|[Mm]ask|[Mm]asked|[Hh]ash|[Hh]ashed|[Rr]edact|[Rr]edacted|[Ee]ncrypt|[Ee]ncrypted|[Aa]non|[Aa]nonymize|[Aa]nonymise|[Aa]nonymized|[Aa]nonymised|[Pp]seudonymized|[Pp]seudonymised|[Oo]bfuscated|[Tt]runcated|[Ss]afe|[Pp]artial|[Tt]emplate|[Dd]efault)[_A-Z0-9])(?:(?:[A-Za-z0-9]*_)+|[A-Za-z][A-Za-z0-9]*?[a-z0-9](?=[A-Z]))?(?:nif|Nif|NIF|niss|Niss|NISS|iban|Iban|IBAN|email|Email|EMAIL|e_mail|E_MAIL|telefone|Telefone|TELEFONE|telemovel|Telemovel|TELEMOVEL|telephone|Telephone|TELEPHONE|phone|Phone|PHONE|cartao_(?:de_)?cidadao|CARTAO_(?:DE_)?CIDADAO|[Cc]artao(?:De)?Cidadao|cc_number|CC_NUMBER|[Cc]cNumber|contribuinte|Contribuinte|CONTRIBUINTE|seguranca_social|SEGURANCA_SOCIAL|[Ss]egurancaSocial)(?:_?(?:[Nn]umber|NUMBER|[Nn]umero|NUMERO|[Aa]ddress|ADDRESS|[Cc]liente|CLIENTE|[Uu]tilizador|UTILIZADOR|[Uu]tente|UTENTE|[Tt]itular|TITULAR|[Cc]ontacto|CONTACTO))?(?:es|s)?$'
              # O estado de um formulario (Formik, react-hook-form) tem um
              # membro por campo: `formik.errors.email` é a mensagem de erro
              # do campo, nao o email.
              - metavariable-regex:
                  metavariable: $OBJ
                  regex: '^(?!(?:.*\.)?(?:errors|touched|dirty|dirtyFields|touchedFields|validationErrors|env|[A-Z][A-Z0-9_]*)$)'
          - patterns:
              - pattern: $RECEIVER.$CALL(..., <... $NAME ...>, ...)
              - metavariable-regex:
                  metavariable: $NAME
                  regex: '^(?![A-Z][A-Z0-9_]*$)(?!(?:[Ii]s|[Hh]as|[Ss]hould|[Cc]an|[Vv]alid|[Ii]nvalid|[Vv]alidate|[Vv]erify|[Cc]heck|[Pp]arse|[Nn]ormalize|[Nn]ormalise|[Ff]ormat|[Ss]end|[Ss]et|[Uu]pdate|[Ff]ind|[Ll]ookup|[Ss]earch|[Bb]uild|[Rr]ender|[Cc]ompose|[Rr]esolve|[Mm]ask|[Mm]asked|[Hh]ash|[Hh]ashed|[Rr]edact|[Rr]edacted|[Ee]ncrypt|[Ee]ncrypted|[Aa]non|[Aa]nonymize|[Aa]nonymise|[Aa]nonymized|[Aa]nonymised|[Pp]seudonymized|[Pp]seudonymised|[Oo]bfuscated|[Tt]runcated|[Ss]afe|[Pp]artial|[Tt]emplate|[Dd]efault)[_A-Z0-9])(?:(?:[A-Za-z0-9]*_)+|[A-Za-z][A-Za-z0-9]*?[a-z0-9](?=[A-Z]))?(?:nif|Nif|NIF|niss|Niss|NISS|iban|Iban|IBAN|email|Email|EMAIL|e_mail|E_MAIL|telefone|Telefone|TELEFONE|telemovel|Telemovel|TELEMOVEL|telephone|Telephone|TELEPHONE|phone|Phone|PHONE|cartao_(?:de_)?cidadao|CARTAO_(?:DE_)?CIDADAO|[Cc]artao(?:De)?Cidadao|cc_number|CC_NUMBER|[Cc]cNumber|contribuinte|Contribuinte|CONTRIBUINTE|seguranca_social|SEGURANCA_SOCIAL|[Ss]egurancaSocial)(?:_?(?:[Nn]umber|NUMBER|[Nn]umero|NUMERO|[Aa]ddress|ADDRESS|[Cc]liente|CLIENTE|[Uu]tilizador|UTILIZADOR|[Uu]tente|UTENTE|[Tt]itular|TITULAR|[Cc]ontacto|CONTACTO))?(?:es|s)?$'
              - focus-metavariable: $NAME
          - patterns:
              - pattern: $OBJ[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: '^[''"](?!(?:[Ii]s|[Hh]as|[Ss]hould|[Cc]an|[Vv]alid|[Ii]nvalid|[Vv]alidate|[Vv]erify|[Cc]heck|[Pp]arse|[Nn]ormalize|[Nn]ormalise|[Ff]ormat|[Ss]end|[Ss]et|[Uu]pdate|[Ff]ind|[Ll]ookup|[Ss]earch|[Bb]uild|[Rr]ender|[Cc]ompose|[Rr]esolve|[Mm]ask|[Mm]asked|[Hh]ash|[Hh]ashed|[Rr]edact|[Rr]edacted|[Ee]ncrypt|[Ee]ncrypted|[Aa]non|[Aa]nonymize|[Aa]nonymise|[Aa]nonymized|[Aa]nonymised|[Pp]seudonymized|[Pp]seudonymised|[Oo]bfuscated|[Tt]runcated|[Ss]afe|[Pp]artial|[Tt]emplate|[Dd]efault)[_A-Z0-9])(?:(?:[A-Za-z0-9]*_)+|[A-Za-z][A-Za-z0-9]*?[a-z0-9](?=[A-Z]))?(?:nif|Nif|NIF|niss|Niss|NISS|iban|Iban|IBAN|email|Email|EMAIL|e_mail|E_MAIL|telefone|Telefone|TELEFONE|telemovel|Telemovel|TELEMOVEL|telephone|Telephone|TELEPHONE|phone|Phone|PHONE|cartao_(?:de_)?cidadao|CARTAO_(?:DE_)?CIDADAO|[Cc]artao(?:De)?Cidadao|cc_number|CC_NUMBER|[Cc]cNumber|contribuinte|Contribuinte|CONTRIBUINTE|seguranca_social|SEGURANCA_SOCIAL|[Ss]egurancaSocial)(?:_?(?:[Nn]umber|NUMBER|[Nn]umero|NUMERO|[Aa]ddress|ADDRESS|[Cc]liente|CLIENTE|[Uu]tilizador|UTILIZADOR|[Uu]tente|UTENTE|[Tt]itular|TITULAR|[Cc]ontacto|CONTACTO))?(?:es|s)?[''"]$'
          - patterns:
              - pattern: $OBJ.get($KEY)
              - metavariable-regex:
                  metavariable: $KEY
                  regex: '^[''"](?!(?:[Ii]s|[Hh]as|[Ss]hould|[Cc]an|[Vv]alid|[Ii]nvalid|[Vv]alidate|[Vv]erify|[Cc]heck|[Pp]arse|[Nn]ormalize|[Nn]ormalise|[Ff]ormat|[Ss]end|[Ss]et|[Uu]pdate|[Ff]ind|[Ll]ookup|[Ss]earch|[Bb]uild|[Rr]ender|[Cc]ompose|[Rr]esolve|[Mm]ask|[Mm]asked|[Hh]ash|[Hh]ashed|[Rr]edact|[Rr]edacted|[Ee]ncrypt|[Ee]ncrypted|[Aa]non|[Aa]nonymize|[Aa]nonymise|[Aa]nonymized|[Aa]nonymised|[Pp]seudonymized|[Pp]seudonymised|[Oo]bfuscated|[Tt]runcated|[Ss]afe|[Pp]artial|[Tt]emplate|[Dd]efault)[_A-Z0-9])(?:(?:[A-Za-z0-9]*_)+|[A-Za-z][A-Za-z0-9]*?[a-z0-9](?=[A-Z]))?(?:nif|Nif|NIF|niss|Niss|NISS|iban|Iban|IBAN|email|Email|EMAIL|e_mail|E_MAIL|telefone|Telefone|TELEFONE|telemovel|Telemovel|TELEMOVEL|telephone|Telephone|TELEPHONE|phone|Phone|PHONE|cartao_(?:de_)?cidadao|CARTAO_(?:DE_)?CIDADAO|[Cc]artao(?:De)?Cidadao|cc_number|CC_NUMBER|[Cc]cNumber|contribuinte|Contribuinte|CONTRIBUINTE|seguranca_social|SEGURANCA_SOCIAL|[Ss]egurancaSocial)(?:_?(?:[Nn]umber|NUMBER|[Nn]umero|NUMERO|[Aa]ddress|ADDRESS|[Cc]liente|CLIENTE|[Uu]tilizador|UTILIZADOR|[Uu]tente|UTENTE|[Tt]itular|TITULAR|[Cc]ontacto|CONTACTO))?(?:es|s)?[''"]$'
      - pattern-not-inside:
          patterns:
            - pattern: $MASK(...)
            - metavariable-regex:
                metavariable: $MASK
                regex: '^(?:(?:.*(?:\.|->|::))?(?:(?:[Mm]ask|[Rr]edact|[Aa]nonymi[sz]e|[Pp]seudonymi[sz]e|[Hh]ash|[Oo]bfuscate|[Ee]ncrypt|[Mm]ascar|[Oo]cultar|[Aa]nonimizar|[Cc]ifrar|md5|sha1|sha256|wp_hash)\w*|len|strlen|mb_strlen|count|sizeof|[Bb]ool|[Bb]oolean|exists?|has|includes|test|is[A-Z]\w*)$|.*\bcreateH(?:ash|mac)\()'
      - pattern-not-inside: $S.slice(-$N)
      # Um booleano (`!!email`, `!email`) é um valor derivado que em JS é um
      # no proprio e nao uma chamada. O tamanho (`email.length`) tinha aqui
      # um `pattern-not-inside: $X.length` so dele ate à ronda de codigo de
      # aplicação; é uma leitura de atributo, e o guarda abaixo cobre-o — o
      # clause saiu por ser um caso particular dele, e a fixture ficou.
      - pattern-not-inside: '!$X'
      # O GUARDA DA LEITURA DE ATRIBUTO (ver o comentario das quatro regras).
      - pattern-not-inside:
          patterns:
            - pattern: $V.$ATTR
            - metavariable-regex:
                metavariable: $V
                regex: '^(?![\s\S]*(?:\blambda\b|=>|\bfunction\b|\bdelegate\b))'
            - metavariable-regex:
                metavariable: $ATTR
                regex: '^(?:[A-Za-z0-9_]*(?:_id|_ids|Id|Ids|ID|_pk|_uuid|Uuid|UUID|Guid|GUID|_at|(?<!Element)At|_em|Em|_date|Date|_time|Time|[Tt]imestamp)|id|pk|uuid|guid|length|Length|size|Size|count|Count)$'
            - focus-metavariable: $V

  # PHP: WordPress primeiro, porque é onde o PHP escreve dados pessoais em
  # logs — `error_log()` com `$user->user_email`, e o `wc_get_logger()` do
  # WooCommerce com `$order->get_billing_email()`. Depois PSR-3 (Monolog,
  # Symfony), o Laravel — a facade `Log::` (tambem com o namespace completo
  # `\Illuminate\Support\Facades\Log::`), `Log::channel(...)->`,
  # `logger()->` e `logger(...)` — e o `syslog()`.
  #
  # O `$NAME` do PHP inclui o `$` no texto, por isso o regex do nome abre com
  # `^\$` em vez de `^`; o corpo é o mesmo.
  - id: rgpd-pii-in-log-php
    metadata:
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - "A09:2025 - Security Logging and Alerting Failures"
    languages: [php]
    severity: WARNING
    message: >-
      Dado pessoal num log (NIF, NISS, Cartão de Cidadão, IBAN, telefone ou
      email, reconhecido pelo nome da variavel ou do campo). O `error_log()` e
      os ficheiros do WooCommerce ficam no servidor e nos backups muito para
      la do prazo de conservação dos dados de origem, fora do controlo de
      acesso da aplicação — isto contraria a minimização (RGPD, art. 5.º,
      n.º 1, al. c)) e torna o apagamento (art. 17.º) impraticavel. Registe o
      ID interno (`$user->ID`, `$order->get_id()`) ou uma forma mascarada.
      Se o valor nao é de uma pessoa (o `admin_email` do site), o nome engana
      e este aviso é ruido.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: $LOGGER->$METHOD(...)
              - metavariable-regex:
                  metavariable: $LOGGER
                  regex: '^(?:.*->)?\$?_?(?:logger|log)$|^(?:wc_get_)?logger\(\)$|^\\?(?:Illuminate\\Support\\Facades\\)?Log::\w+\(.*\)$'
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: '^(?:emergency|alert|critical|error|warning|notice|info|debug|log)$'
          # A facade NAO filtra o metodo, e foi a ablação a decidir: o filtro
          # dos niveis PSR-3 aqui leu DEAD, e a forma que ele excluiria é um
          # dado pessoal num log na mesma — `Log::withContext(['email' =>
          # $email])` junta o valor a TODAS as linhas seguintes. Tudo o que a
          # facade `Log::` faz é registar.
          - patterns:
              - pattern-inside: $FACADE::$METHOD(...)
              - metavariable-regex:
                  metavariable: $FACADE
                  regex: '^\\?(?:Illuminate\\Support\\Facades\\)?(?:Log|Logger)$'
          - pattern-inside: error_log(...)
          - pattern-inside: syslog(...)
          # O helper `logger('mensagem', [...])` do Laravel regista ao nivel
          # debug; `logger()->info(...)` passa pelo recetor acima.
          - pattern-inside: logger(...)
      - pattern-either:
          - patterns:
