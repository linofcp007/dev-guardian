    message: >-
      Dado pessoal num log (NIF, NISS, Cartão de Cidadão, IBAN, telefone ou
      email, reconhecido pelo nome da variavel ou da propriedade). O template
      estruturado guarda o valor como campo pesquisavel no Seq, Application
