    message: >-
      Hotjar carregado antes do consentimento: o script grava a sessao do
      visitante (cliques, movimento, scroll) e define cookies `_hj*` no
      carregamento da pagina. Exige consentimento previo (Diretiva
      2002/58/CE, art. 5.º, n.º 3, transposta pela Lei n.º 41/2004; RGPD,
      art. 7.º). Bloqueie o snippet com `type="text/plain"` gerido por uma
      CMP, ou execute-o dentro do callback de consentimento. Ver
      configs/compliance/cookie-banner/.
