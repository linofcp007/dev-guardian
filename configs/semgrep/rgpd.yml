      art. 5.º, n.º 1, al. c)) e torna o apagamento (art. 17.º) impraticavel.
      Registe o Id interno ou uma forma mascarada, ou use a redação do
      Microsoft.Extensions.Compliance. Se o valor nao é de uma pessoa, o nome
      engana e este aviso é ruido.
    patterns:
