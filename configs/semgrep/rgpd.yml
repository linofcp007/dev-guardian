  # ---------------------------------------------------------------------------
  # RASTREADORES SEM CONSENTIMENTO
  #
  # Regras de texto (`generic`), restritas por `paths.include` a ficheiros de
  # markup. Sem essa lista uma regra generic le TODOS os ficheiros — bundles
  # .js, documentação .md, lock files — e um URL de rastreador num README nao
  # é um rastreador. O teste exige uma fixture de hits por cada extensao da
  # lista, para que um glob com erro nao passe despercebido.

  # GA4: o loader `gtag/js` numa tag `<script src>`, o componente
  # `<GoogleAnalytics>` do `@next/third-parties`, ou um `wp_enqueue_script`
  # do WordPress. Quatro guardas: o elemento `text/plain`, o Consent Mode v2
  # com `denied` declarado no ficheiro, uma condição JSX que fala de
  # consentimento (`{consent.analytics && <Script .../>}`), e o bloco de
  # consentimento. O `type="text/javascript"` executa, e esta em hits/ a
  # prova-lo; o Consent Mode com `granted` por omissao nao é guarda, e tambem
  # esta em hits/.
  - id: rgpd-tracker-ga4-without-consent
    languages: [generic]
    severity: WARNING
    paths:
      include: ['*.html', '*.htm', '*.php', '*.jsx', '*.tsx', '*.vue', '*.twig']
    message: >-
      Google Analytics (gtag.js) carregado antes do consentimento: o script é
      pedido no carregamento da pagina e define os cookies `_ga`/`_ga_*`
      antes de o visitante escolher. Cookies de analitica nao sao
      estritamente necessarios e exigem consentimento previo (Diretiva
      2002/58/CE, art. 5.º, n.º 3, transposta pela Lei n.º 41/2004; RGPD,
      art. 7.º). Bloqueie-o ate ao consentimento — `type="text/plain"` gerido
      por uma CMP, ou carregamento dentro do callback de consentimento — ou
      declare o Google Consent Mode v2 com `gtag('consent', 'default', ...)` a
      `denied` antes de qualquer `config`. Ver
      configs/compliance/cookie-banner/.
    patterns:
      - pattern-either:
          - pattern-regex: '(?i)<script\b[^>]*?\ssrc\s*=\s*\{?\s*[`"'']?(?:https?:)?//(?:www\.)?googletagmanager\.com/gtag/js'
          - pattern-regex: '<GoogleAnalytics\b[^>]*?\sgaId\s*='
          - pattern-regex: '\bwp_enqueue_script\s*\(\s*[^,()]+,\s*[`"''](?:https?:)?//(?:www\.)?googletagmanager\.com/gtag/js'
      - pattern-not-regex: '(?is)<script\b[^>]*?\stype\s*=\s*["'']text/plain["''][^>]*>.*?</script\s*>'
      - pattern-not-regex: '(?s)\A.*?gtag\(\s*["'']consent["'']\s*,\s*["'']default["'']\s*,\s*\{[^}]*?["'']denied["''].*\z'
      - pattern-not-regex: '(?is)\{[^{}]*?consent[^{}]*?(?:&&|\?)\s*\(?\s*<(?:script|GoogleAnalytics)\b[^>]*?(?:googletagmanager\.com/gtag/js|gaId\s*=)'
      - pattern-not-regex: '(?is)consent[^{};\n]*\{(?:[^{}]|(\{(?:[^{}]|(?1))*\}))*?googletagmanager\.com/gtag/js'

  # Meta Pixel: o `fbq('init', ...)` é o momento em que o pixel passa a
  # enviar eventos ligados a um cookie `_fbp`. Tres guardas: o elemento
  # `text/plain`, a API de consentimento da propria Meta
  # (`fbq('consent', 'revoke')` antes do init), e o bloco de consentimento.
  # Um bloco de consentimento que ja FECHOU antes do init nao conta, e a
  # fixture de hits tem essa forma.
  - id: rgpd-tracker-meta-pixel-without-consent
    languages: [generic]
    severity: WARNING
    paths:
      include: ['*.html', '*.htm', '*.php', '*.jsx', '*.tsx', '*.vue', '*.twig']
    message: >-
      Meta Pixel iniciado antes do consentimento: `fbq('init', ...)` corre no
      carregamento da pagina, define o cookie `_fbp` e envia eventos para a
      Meta antes de o visitante escolher. Cookies de marketing exigem
      consentimento previo (Diretiva 2002/58/CE, art. 5.º, n.º 3, transposta
      pela Lei n.º 41/2004; RGPD, art. 7.º). Chame `fbq('consent',
      'revoke')` antes do init e `fbq('consent', 'grant')` quando o visitante
      aceitar, ou carregue o pixel dentro do callback de consentimento. Ver
      configs/compliance/cookie-banner/.
    patterns:
      - pattern-regex: 'fbq\(\s*[`"'']init[`"'']'
      - pattern-not-regex: '(?is)<script\b[^>]*?\stype\s*=\s*["'']text/plain["''][^>]*>.*?</script\s*>'
      - pattern-not-regex: '(?s)\A.*?fbq\(\s*[`"'']consent[`"'']\s*,\s*[`"'']revoke[`"'']\s*\).*\z'
      - pattern-not-regex: '(?is)consent[^{};\n]*\{(?:[^{}]|(\{(?:[^{}]|(?1))*\}))*?fbq\(\s*[`"'']init[`"'']'

  # Hotjar: o URL do loader `static.hotjar.com/c/hotjar-` aparece no snippet
  # oficial e em qualquer `<script src>` para ele. O Hotjar grava sessoes —
  # cliques, scroll, texto escrito — e nao tem API de consentimento propria,
  # por isso so ha dois guardas: o elemento `text/plain` e o bloco de
  # consentimento. O URL esta nos ARGUMENTOS da IIFE, depois do corpo dela, e
  # é por isso que o guarda do bloco salta chavetas equilibradas em vez de
  # parar na primeira.
  - id: rgpd-tracker-hotjar-without-consent
    languages: [generic]
    severity: WARNING
    paths:
      include: ['*.html', '*.htm', '*.php', '*.jsx', '*.tsx', '*.vue', '*.twig']
    message: >-
      Hotjar carregado antes do consentimento: o script grava a sessao do
      visitante (cliques, movimento, scroll) e define cookies `_hj*` no
      carregamento da pagina. Exige consentimento previo (Diretiva
      2002/58/CE, art. 5.º, n.º 3, transposta pela Lei n.º 41/2004; RGPD,
      art. 7.º). Bloqueie o snippet com `type="text/plain"` gerido por uma
      CMP, ou execute-o dentro do callback de consentimento. Ver
      configs/compliance/cookie-banner/.
    patterns:
      - pattern-regex: 'static\.hotjar\.com/c/hotjar-'
      - pattern-not-regex: '(?is)<script\b[^>]*?\stype\s*=\s*["'']text/plain["''][^>]*>.*?</script\s*>'
      - pattern-not-regex: '(?is)consent[^{};\n]*\{(?:[^{}]|(\{(?:[^{}]|(?1))*\}))*?static\.hotjar\.com/c/hotjar-'

  # YouTube: um `<iframe src>` para `youtube.com/embed` define cookies do
  # YouTube (YSC, VISITOR_INFO1_LIVE) mal a pagina carrega, sem o visitante
  # tocar no video. O dominio `youtube-nocookie.com` (modo de privacidade
  # melhorada) adia-os ate ao play, e o regex nem o casa: depois de
  # `youtube` vem `-nocookie`, nao `.com`.
  #
  # O `\s` antes do `src` é um guarda ESTRUTURAL: `data-src` — o atributo em
  # que as CMP guardam o URL ate ao consentimento — tem um hifen antes do
  # `src`, nao um espaço, e fica de fora sem clause nenhum. Um `<a href>` para
  # o mesmo URL é uma ligação e nao um embed, e tambem fica de fora por nao
  # ser um `<iframe>`. O unico guarda ablatavel é a condição JSX.
  - id: rgpd-youtube-embed-without-nocookie
    languages: [generic]
    severity: WARNING
    paths:
      include: ['*.html', '*.htm', '*.php', '*.jsx', '*.tsx', '*.vue', '*.twig']
    message: >-
      Video do YouTube incorporado a partir de youtube.com/embed: o iframe
      define cookies do YouTube (YSC, VISITOR_INFO1_LIVE) no carregamento da
      pagina, antes de qualquer consentimento (Diretiva 2002/58/CE, art. 5.º,
      n.º 3, transposta pela Lei n.º 41/2004). Use
      https://www.youtube-nocookie.com/embed/ (modo de privacidade melhorada,
      sem cookies ate ao play) e, idealmente, so carregue o iframe depois do
      consentimento de marketing (`data-src` gerido por uma CMP, ou uma
      imagem de pre-visualizacao que o substitui ao clicar).
    patterns:
      - pattern-regex: '(?i)<iframe\b[^>]*?\ssrc\s*=\s*\{?\s*[`"'']?(?:https?:)?//(?:www\.)?youtube\.com/embed/'
      - pattern-not-regex: '(?is)\{[^{}]*?consent[^{}]*?(?:&&|\?)\s*\(?\s*<iframe\b[^>]*?youtube\.com/embed/'
