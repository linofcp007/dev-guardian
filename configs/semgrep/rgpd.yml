  # C#: `ILogger` (os `LogX` de extensao e o `Log(level, ...)`), o `Log`
  # estatico do Serilog, log4net/NLog, e `Console`/`Debug`/`Trace`. O
  # template estruturado (`"Login {Email}"`) é uma string e nao conta; o
  # argumento a seguir é que conta.
  - id: rgpd-pii-in-log-cs
    metadata:
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - "A09:2025 - Security Logging and Alerting Failures"
    languages: [csharp]
    severity: WARNING
    message: >-
      Dado pessoal num log (NIF, NISS, Cartão de Cidadão, IBAN, telefone ou
      email, reconhecido pelo nome da variavel ou da propriedade). O template
      estruturado guarda o valor como campo pesquisavel no Seq, Application
      Insights ou Elastic, fora do controlo de acesso e do prazo de
      conservação dos dados de origem — isto contraria a minimização (RGPD,
      art. 5.º, n.º 1, al. c)) e torna o apagamento (art. 17.º) impraticavel.
      Registe o Id interno ou uma forma mascarada, ou use a redação do
      Microsoft.Extensions.Compliance. Se o valor nao é de uma pessoa, o nome
      engana e este aviso é ruido.
    patterns:
      - patterns:
          - pattern-inside: $LOGGER.$METHOD(...)
          - metavariable-regex:
              metavariable: $LOGGER
              regex: '^(?:.*\.)?(?:_?[Ll]ogger|_?[Ll]og|Debug|Trace)$|^(?:System\.)?Console(?:\.Error|\.Out)?$'
          - metavariable-regex:
              metavariable: $METHOD
              regex: '^(?:Log(?:Trace|Debug|Information|Warning|Error|Critical)?|Verbose|Debug|Information|Warning|Error|Fatal|Trace|Info|Warn|WriteLine|Write|TraceInformation|TraceWarning|TraceError)$'
      - pattern-either:
          - patterns:
              - pattern: $OBJ.$FIELD
              - metavariable-regex:
                  metavariable: $FIELD
