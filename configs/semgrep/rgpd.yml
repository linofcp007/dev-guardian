# de teste. O pack corrigido, re-corrido nas mesmas onze aplicações no mesmo
# commit, da os MESMOS 38 resultados no mesmo ficheiro, linha e coluna — 35
# verdadeiros, 3 falsos, 92,1 % — e nenhum resultado novo: nenhuma das
# formas que a revisao encontrou aparece nestas onze, e a prova de cada uma
# é a sua fixture em hits/.
#
# LEIA TAMBEM ESTE NUMERO COM CUIDADO: é pequeno (72 resultados), dois terços vêm
# de uma aplicação, e as regras da Meta e do Hotjar nao dispararam em nenhuma
