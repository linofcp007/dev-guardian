          patterns:
            - pattern: $V.$ATTR
            - metavariable-regex:
                metavariable: $V
                regex: '^(?![\s\S]*(?:\blambda\b|=>|\bfunction\b|\bdelegate\b))'
            - metavariable-regex:
                metavariable: $ATTR
                regex: '^(?:[A-Za-z0-9_]*(?:_id|_ids|Id|Ids|ID|_pk|_uuid|Uuid|UUID|Guid|GUID|_at|(?<!Element)At|_em|Em|_date|Date|_time|Time|[Tt]imestamp)|id|pk|uuid|guid|length|Length|size|Size|count|Count)$'
            - focus-metavariable: $V

  # ---------------------------------------------------------------------------
  # RASTREADORES SEM CONSENTIMENTO
  #
  # Regras de texto (`generic`), restritas por `paths.include` a ficheiros de
  # markup e de templates. Sem essa lista uma regra generic le TODOS os
  # ficheiros — documentação .md, lock files — e um URL de rastreador num
  # README nao é um rastreador. O teste exige uma fixture de hits por cada
  # extensao da lista, para que um glob com erro nao passe despercebido. O
  # `*.js` entrou na ronda 1 por causa dos layouts do Next.js em JavaScript
  # (`app/layout.js`), e foi medido sobre misses/ e sobre codigo real antes
  # de entrar.
  #
  # O `paths.exclude` tira o codigo de TESTE: `*.test.js`, `*.spec.js`, as
  # stories do Storybook (`*.stories.js`), cada um com `.js`, `.jsx` e
  # `.tsx`, e as pastas `__tests__`, `__mocks__`, `__fixtures__`,
  # `__factories__`. O markup ali é a ENTRADA de um teste ou uma
  # demonstração para quem desenvolve, e nunca é servido a um visitante.
  # Medido em codigo de aplicação: todos os 8 falsos positivos das regras de
  # rastreadores eram isto (um plugin WordPress e o Ghost), e todos os
  # verdadeiros ficaram. O `.semgrepignore` por omissao do Semgrep ja salta
  # `test/` e `tests/`, mas nao os testes ao lado do codigo. O `*.test.js`
  # exige o ponto dos dois lados: uma pagina `stories.html` é servida e esta
  # em hits/.
  #
  # POR QUE A EXTENSAO ESTA ESCRITA (revisao desta ronda). Medido no Semgrep
  # 1.176: um glob sem `/` casa QUALQUER segmento do caminho, pastas
  # incluidas, e nao ha sintaxe para "so ficheiros" (`**/x/**` casa so
  # pastas, o contrario do que se quer); `{js,jsx}` nao é expandido — um
  # glob assim nao excluiu nada. A primeira versao, `*.test.*`, saltava por
  # isso uma pasta inteira `sites/loja.test.pt/`, e esse site esta em hits/.
  # Com a extensao no glob so uma pasta chamada como um ficheiro de teste
  # (`x.test.js/`) é saltada. So a familia JS esta na lista: as outras
  # extensoes que estas regras leem nao tem convenção de teste desta forma,
  # e um `x.test.html` volta a ser lido — o erro possivel é um falso
  # positivo, nunca um rastreador escondido.
  #
  # Nao é um clause, e a ablação nunca o retira: o `rgpdRules.test.ts` tira
  # as treze exclusoes e exige que disparem exatamente as fixtures de misses/
  # que elas cobrem, pelo menos uma por exclusao, e modela o glob como o
  # Semgrep o aplica — a todos os segmentos do caminho.
  #
  # OS GUARDAS SAO OS MESMOS NAS QUATRO REGRAS, e cada um casa o BLOCO
  # INTEIRO que protege, nunca o caminho ate ao alvo: o Semgrep so exclui um
  # resultado contido no intervalo do `pattern-not-regex`, e um bloco inteiro
  # contem tudo o que esta dentro dele, a qualquer profundidade de chavetas.
  # A primeira versao casava "da abertura ate ao alvo" e perdia o alvo mal
  # ele estava dentro de um `{...}` aninhado (o template literal de um
  # `<Script>`, um `if` dentro do callback).
  #
  #   - ELEMENTO: `<script type="text/plain">...</script>`.
  #   - JSX: `{...consent... && ...}` inteiro, ou o ramo ENTAO de
  #     `{...consent... ? A : B}` ate ao `:` (o ramo SENAO carrega
  #     precisamente quando nao ha consentimento, e esta em hits/).
  #   - BLOCO: `if (...consent...) {...}` (e `@if` do Razor, `<% if %>` do
  #     EJS, que guardam as chavetas), ou um callback de uma chamada que fala
  #     de consentimento — `onConsent('x', () => {...})`,
  #     `addEventListener('consent:x', function () {...})`. Uma função que
  #     apenas se CHAMA `iniciarConsentimento()` nao é uma verificação, e esta
  #     em hits/ — era o falso guarda T9 da revisao.
  #   - TEMPLATE: as condições que nao usam chavetas — `if (...) : ...
  #     endif;` do PHP/WordPress, `{% if %}...{% endif %}` do Twig, `@if(...)
  #     ... @endif` do Blade, `{{#if}}...{{/if}}` do Handlebars, e `v-if` do
  #     Vue (num elemento que envolve o alvo, ou no proprio alvo, fechado ou
  #     auto-fechado). Um so clause com as seis alternativas; a ablação so ve
  #     o clause, por isso cada alternativa foi retirada a mao, uma de cada
  #     vez, sobre misses/: todas tem uma fixture que so ela exclui (a do
  #     `<iframe v-if=... />` auto-fechado nao tinha, e foi acrescentada), e o
  #     teste de misses falha se alguma for removida.
  #
  # O RAMO ELSE NAO É GUARDADO. As quatro formas de template acabam no
  # PRIMEIRO `else`/`elseif` (`else :`, `{% else %}`, `{% elseif %}`,
  # `@else`, `@elseif`, `{{else}}`) e nao so no fecho: um template de
  # opt-out — `{% if cookie_consent == 'rejected' %}{% else %}<pixel>{%
  # endif %}` — carrega o pixel antes de qualquer escolha. A primeira versao
  # corria ate ao `endif` e tratava o ramo else como guardado: é o defeito
  # que o CLAUDE.md regista ("um guarda escrito para um `if` engoliu o ramo
  # `else`"), achado I1 da revisao da ronda 2, com um hit por forma. No JSX
  # o ternario ja parava no `:`, e no EJS/Razor o `} else {` fecha o bloco.
  #
  # NEGAÇAO: um `!`, um `!=` ou um `not` na condição desliga o guarda — `if
  # (!temConsentimento())`, `{% if not consent %}`, `{% if consent != true
  # %}`, `{!consent && ...}` carregam exatamente quando NAO ha
  # consentimento, e estao todos em hits/. O preço é conservador: `consent
  # !== 'denied'` tambem deixa de contar como guarda, e da um falso
  # positivo.
  #
  # PONTOS CEGOS DOS GUARDAS: uma chaveta desequilibrada dentro de uma string
  # no bloco (`'{'`) estende ou parte o bloco; um `v-if` aninhado dentro de
  # outro elemento com o mesmo nome fecha no primeiro fecho; um `endif` ou um
  # `else` de um `if` interior — ou a palavra "else" num texto — fecham o
  # bloco de template cedo de mais. Nos tres casos o erro possivel é um
  # falso positivo, com uma exceção: a chaveta a mais numa string pode
  # estender o bloco para la do seu fim.

  # GA4: o loader `gtag/js` numa tag `<script src>`, o componente
  # `<GoogleAnalytics>` do `@next/third-parties`, ou um `wp_enqueue_script`
  # do WordPress. Cinco guardas: os quatro comuns e o Consent Mode v2.
  #
  # O CONSENT MODE É UMA DECISAO JURIDICA ACEITE, NAO UMA CORREÇAO. Com
  # `analytics_storage` a `denied` declarado no ficheiro, o gtag.js carrega e
  # envia pedidos sem cookies ate ao consentimento (o "modo avançado"). As
  # Diretrizes 2/2023 do CEPD tratam esses pedidos como acesso ao terminal
  # abrangido pelo art. 5.º, n.º 3 da Diretiva ePrivacy, por isso a mensagem
  # prescreve o modo BASICO — nada carrega antes do consentimento, que é o
  # que o template do pack faz — e diz que o modo avançado nao é tratado como
  # achado. O guarda exige `analytics_storage` a `denied`: negar so os sinais
  # de anuncios deixa o `_ga` a ser escrito, e esta em hits/. O guarda salta
  # comentarios HTML e `//`: uma declaração comentada nao declara nada, e
  # tambem esta em hits/.
  - id: rgpd-tracker-ga4-without-consent
    metadata:
      cwe:
        - "CWE-359: Exposure of Private Personal Information to an Unauthorized Actor"
      owasp:
        - "A01:2025 - Broken Access Control"
    languages: [generic]
    severity: WARNING
    paths:
      include: ['*.html', '*.htm', '*.php', '*.jsx', '*.tsx', '*.js', '*.vue', '*.twig', '*.cshtml', '*.razor', '*.ejs', '*.hbs']
      exclude: ['*.test.js', '*.test.jsx', '*.test.tsx', '*.spec.js', '*.spec.jsx', '*.spec.tsx', '*.stories.js', '*.stories.jsx', '*.stories.tsx', '__tests__', '__mocks__', '__fixtures__', '__factories__']
    message: >-
      Google Analytics (gtag.js) carregado antes do consentimento: o script é
      pedido no carregamento da pagina e define os cookies `_ga`/`_ga_*`
      antes de o visitante escolher. Cookies de analitica nao sao
      estritamente necessarios e exigem consentimento previo (Diretiva
      2002/58/CE, art. 5.º, n.º 3, transposta pela Lei n.º 41/2004; RGPD,
      art. 7.º). Correção (modo basico): nao carregue o gtag.js antes do
      consentimento — `type="text/plain"` gerido por uma CMP, ou
      carregamento dentro do callback de consentimento; ver
      configs/compliance/cookie-banner/. O Google Consent Mode v2 com
      `analytics_storage` a `denied` antes do tag (modo avançado) nao é
      tratado como achado por este pack, mas é uma decisao juridica e nao
      uma correção: segundo as Diretrizes 2/2023 do CEPD, os pedidos que o
      tag envia antes do consentimento continuam abrangidos pelo art. 5.º,
      n.º 3.
    patterns:
      - pattern-either:
          - pattern-regex: '(?i)<script\b[^>]*?\ssrc\s*=\s*\{?\s*[`"'']?(?:https?:)?//(?:www\.)?googletagmanager\.com/gtag/js'
          - pattern-regex: '<GoogleAnalytics\b[^>]*?\sgaId\s*='
          - pattern-regex: '\bwp_enqueue_script\s*\(\s*[^,()]+,\s*[`"''](?:https?:)?//(?:www\.)?googletagmanager\.com/gtag/js'
      - pattern-not-regex: '(?is)<script\b[^>]*?\stype\s*=\s*["'']text/plain["''][^>]*>.*?</script\s*>'
      - pattern-not-regex: '(?s)\A(?:(?><!--.*?-->|(?<![\w/*"''=:])/\*.*?\*/|(?<![:"''=\w])//[^\n]*|.))*?gtag\(\s*["'']consent["'']\s*,\s*["'']default["'']\s*,\s*\{[^}]*?\banalytics_storage["'']?\s*:\s*["'']denied["''].*\z'
      - pattern-not-regex: '(?is)\{[^{}!\n]*?consent[^{}!\n]*?(?:&&(?:[^{}]++|(\{(?:[^{}]++|(?1))*\}))*\}|\?(?=\s)(?:[^{}:]++|(?1)|:(?=//))*)'
      - pattern-not-regex: '(?is)(?:\b(?:else)?if\s*\([^{};\n!]*consent[^{};\n!]*\)\s*|(?:consent\w*(?:\.\w+)*\s*\(|consent[^''"\n]*[''"]\s*,)[^{};\n]*(?:\bfunction\b[^{};\n]*|=>\s*))(\{(?:[^{}]++|(?1))*\})'
      - pattern-not-regex: '(?is)\bif\s*\((?:[^()\n!]|\([^()\n!]*\))*consent(?:[^()\n!]|\([^()\n!]*\))*\)\s*:.*?\b(?:endif|else|elseif)\b|\{%-?\s*if\s(?![^%]*(?:\bnot\b|!=))[^%]*consent[^%]*%\}.*?\{%-?\s*(?:endif|else|elseif)\b|@if\s*\((?:[^()\n!]|\([^()\n!]*\))*consent(?:[^()\n!]|\([^()\n!]*\))*\).*?@(?:endif|else|elseif)\b|\{\{#if\s[^}]*consent[^}]*\}\}.*?\{\{~?\s*(?:/if|else)\b|<\w+\b[^>]*\sv-if\s*=\s*["''][^"''!]*consent[^"''!]*["''][^>]*/>|<(?<vtag>\w+)\b[^>]*\sv-if\s*=\s*["''][^"''!]*consent[^"''!]*["''][^>]*>.*?</\k<vtag>\s*>'

  # Meta Pixel: o `fbq('init', ...)` é o momento em que o pixel passa a
  # enviar eventos ligados a um cookie `_fbp`. Cinco guardas: os quatro
  # comuns e a API de consentimento da propria Meta (`fbq('consent',
  # 'revoke')` antes do init), que é aceite pela mesma razao e com a mesma
  # ressalva que o Consent Mode: o fbevents.js carrega e comunica com a Meta
  # na mesma, e a mensagem prescreve o modo basico. O guarda salta
  # comentarios — um revoke dentro de `<!-- -->` nao revoga nada (T8 da
  # revisao, em hits/).
  - id: rgpd-tracker-meta-pixel-without-consent
    metadata:
      cwe:
        - "CWE-359: Exposure of Private Personal Information to an Unauthorized Actor"
      owasp:
        - "A01:2025 - Broken Access Control"
    languages: [generic]
    severity: WARNING
    paths:
      include: ['*.html', '*.htm', '*.php', '*.jsx', '*.tsx', '*.js', '*.vue', '*.twig', '*.cshtml', '*.razor', '*.ejs', '*.hbs']
      exclude: ['*.test.js', '*.test.jsx', '*.test.tsx', '*.spec.js', '*.spec.jsx', '*.spec.tsx', '*.stories.js', '*.stories.jsx', '*.stories.tsx', '__tests__', '__mocks__', '__fixtures__', '__factories__']
    message: >-
      Meta Pixel iniciado antes do consentimento: `fbq('init', ...)` corre no
      carregamento da pagina, define o cookie `_fbp` e envia eventos para a
      Meta antes de o visitante escolher. Cookies de marketing exigem
      consentimento previo (Diretiva 2002/58/CE, art. 5.º, n.º 3, transposta
      pela Lei n.º 41/2004; RGPD, art. 7.º). Correção (modo basico): so
      carregue o fbevents.js e chame o init depois do consentimento, dentro
      do callback de consentimento ou num `type="text/plain"` gerido por uma
      CMP; ver configs/compliance/cookie-banner/. Um `fbq('consent',
      'revoke')` antes do init nao é tratado como achado por este pack, mas é
      uma decisao juridica e nao uma correção: o fbevents.js continua a ser
      descarregado e a comunicar com a Meta, e segundo as Diretrizes 2/2023
      do CEPD esses pedidos continuam abrangidos pelo art. 5.º, n.º 3.
    patterns:
      - pattern-regex: 'fbq\(\s*[`"'']init[`"'']'
      - pattern-not-regex: '(?is)<script\b[^>]*?\stype\s*=\s*["'']text/plain["''][^>]*>.*?</script\s*>'
      - pattern-not-regex: '(?s)\A(?:(?><!--.*?-->|(?<![\w/*"''=:])/\*.*?\*/|(?<![:"''=\w])//[^\n]*|.))*?fbq\(\s*[`"'']consent[`"'']\s*,\s*[`"'']revoke[`"'']\s*\).*\z'
      - pattern-not-regex: '(?is)\{[^{}!\n]*?consent[^{}!\n]*?(?:&&(?:[^{}]++|(\{(?:[^{}]++|(?1))*\}))*\}|\?(?=\s)(?:[^{}:]++|(?1)|:(?=//))*)'
      - pattern-not-regex: '(?is)(?:\b(?:else)?if\s*\([^{};\n!]*consent[^{};\n!]*\)\s*|(?:consent\w*(?:\.\w+)*\s*\(|consent[^''"\n]*[''"]\s*,)[^{};\n]*(?:\bfunction\b[^{};\n]*|=>\s*))(\{(?:[^{}]++|(?1))*\})'
