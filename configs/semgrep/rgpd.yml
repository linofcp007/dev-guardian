  # Python: `logging` e qualquer recetor chamado logger/log (incluindo o
  # `_LOGGER` do Home Assistant e o `log` do structlog, com o `bind(...)` que
  # carimba o valor em todas as linhas seguintes), e o `print()` — que num
  # contentor vai direto para o agregador de logs.
  - id: rgpd-pii-in-log-py
    metadata:
      cwe:
        - "CWE-532: Insertion of Sensitive Information into Log File"
      owasp:
        - "A09:2025 - Security Logging and Alerting Failures"
    languages: [python]
    severity: WARNING
    message: >-
      Dado pessoal num log (NIF, NISS, Cartão de Cidadão, IBAN, telefone ou
      email, reconhecido pelo nome da variavel ou do campo). Os logs — e o
      `print()`, que num contentor acaba no mesmo agregador — sao copiados
      para backups e terceiros e ficam fora do controlo de acesso e do prazo
      de conservação dos dados de origem: isto contraria a minimização (RGPD,
      art. 5.º, n.º 1, al. c)) e torna o apagamento (art. 17.º) impraticavel.
      Registe um identificador interno ou uma forma mascarada. Se o valor nao
      é de uma pessoa, o nome engana e este aviso é ruido.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: $LOGGER.$METHOD(...)
              - metavariable-regex:
                  metavariable: $LOGGER
                  regex: '^(?:.*\.)?(?:logging|_?logger|_?log|_?LOGGER|LOG)$'
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: '^(?:debug|info|warning|warn|error|exception|critical|fatal|log|bind)$'
          # O `print()` de um comando de gestao do Django (`class Command`,
          # que é o nome que o Django carrega) é a saida do comando no
          # terminal de quem o correu — o mesmo canal que o
          # `self.stdout.write`, que a regra nunca leu como log. Medido em
          # codigo de aplicação: 23 dos 27 falsos positivos desta regra no
          # Zulip eram isto (`show_admins`, `deactivate_user`...). Um logger
          # dentro do comando continua a contar, e um modelo que por acaso se
          # chama `Command` tambem (hits/).
          #
          # A BASE tem de ser do Django: `BaseCommand`, `AppCommand`,
          # `LabelCommand`, `TemplateCommand` (a base do `startapp` e do
          # `startproject`), o `NoArgsCommand` anterior ao Django 1.10, a
          # base de um projeto que termina em `BaseCommand`
          # (`ZulipBaseCommand`), ou `modulo.Command` — um
          # comando que estende um dos do proprio Django, como o
          # `sendtestemail.Command` do Zulip. A primeira versao aceitava
          # qualquer base terminada em `Command` (`ProcessCommand`,
          # `ICommand`), que nao sao do Django (revisao desta ronda; em
          # hits/). O `file=sys.stderr` nao muda nada: o `print()` inteiro de
          # um comando fica de fora — ver os pontos cegos.
          - patterns:
              - pattern-inside: print(...)
              - pattern-not-inside:
                  patterns:
                    - pattern: |
                        class Command(..., $BASE, ...):
                          ...
                    - metavariable-regex:
                        metavariable: $BASE
                        regex: '^(?:(?:.*\.)?(?:App|Label|Template|NoArgs|\w*Base)Command|.+\.Command)$'
