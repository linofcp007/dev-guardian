  # YouTube: um `<iframe src>` para `youtube.com/embed` define cookies do
  # YouTube (YSC, VISITOR_INFO1_LIVE) mal a pagina carrega, sem o visitante
  # tocar no video. O regex nem casa `youtube-nocookie.com`: depois de
  # `youtube` vem `-nocookie`, nao `.com`. Mas o dominio nocookie nao é
  # "sem cookies ate ao play" — ao carregar ainda grava no localStorage do
  # navegador —, e a mensagem diz isso em vez de o prometer.
  #
  # O `\s` antes do `src` é um guarda ESTRUTURAL: `data-src` — o atributo em
  # que as CMP guardam o URL ate ao consentimento — tem um hifen antes do
  # `src`, nao um espaço, e fica de fora sem clause nenhum. Um `<a href>` para
  # o mesmo URL é uma ligação e nao um embed, e tambem fica de fora por nao
  # ser um `<iframe>`. Os guardas ablataveis sao os tres comuns que se
  # aplicam a um iframe: JSX, bloco (um iframe inserido por JS dentro do
  # callback) e template.
  - id: rgpd-youtube-embed-without-nocookie
    metadata:
      cwe:
        - "CWE-359: Exposure of Private Personal Information to an Unauthorized Actor"
      owasp:
        - "A01:2025 - Broken Access Control"
    languages: [generic]
    severity: WARNING
    paths:
      include: ['*.html', '*.htm', '*.php', '*.jsx', '*.tsx', '*.js', '*.vue', '*.twig', '*.cshtml', '*.razor', '*.ejs', '*.hbs']
      exclude: ['*.test.js', '*.test.jsx', '*.test.tsx', '*.spec.js', '*.spec.jsx', '*.spec.tsx', '*.stories.js', '*.stories.jsx', '*.stories.tsx', '__tests__', '__mocks__', '__fixtures__', '__factories__']
    message: >-
      Video do YouTube incorporado a partir de youtube.com/embed: o iframe
      define cookies do YouTube (YSC, VISITOR_INFO1_LIVE) no carregamento da
      pagina, antes de qualquer consentimento (Diretiva 2002/58/CE, art. 5.º,
      n.º 3, transposta pela Lei n.º 41/2004). Carregue o iframe so depois do
      consentimento de marketing (`data-src` gerido por uma CMP, ou uma
      imagem de pre-visualização que o substitui ao clicar) e prefira
      https://www.youtube-nocookie.com/embed/ (modo de privacidade
      melhorada). O dominio nocookie reduz os cookies mas nao dispensa o
      consentimento: ao carregar ainda grava dados no armazenamento local do
      navegador (localStorage).
