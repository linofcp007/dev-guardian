# dev-guardian Semgrep config mobile.
# Configuração de apps Android e iOS que o registo da Semgrep não vê — o
# manifesto Android, a network security config e o Info.plist — e as chamadas
# Java e Kotlin do WebView, do TLS e dos modos de ficheiro (medido em
# 2026-10-24 com --config auto: do registo só dispara
# `java.android.security.exported_activity`, por isso as activities
# exportadas ficam com essa regra e este pack trata dos services, receivers e
# providers). Corre dentro do `scan_sast` como o `llm.yml` e o `web-js.yml`
# (ficheiro do plugin, também no `local_only`).
#
#   | regra                              | CWE      | ficheiro                         |
#   | ---------------------------------- | -------- | -------------------------------- |
#   | mobile-android-debuggable          | CWE-489  | AndroidManifest.xml              |
#   | mobile-android-allow-backup        | CWE-530  | AndroidManifest.xml              |
#   | mobile-android-cleartext-traffic   | CWE-319  | AndroidManifest.xml              |
#   | mobile-android-exported-component  | CWE-926  | AndroidManifest.xml              |
#   | mobile-android-nsc-cleartext       | CWE-319  | res/xml/*.xml (network security) |
#   | mobile-android-nsc-user-ca         | CWE-295  | res/xml/*.xml (network security) |
#   | mobile-ios-ats-arbitrary-loads     | CWE-319  | Info.plist                       |
#   | mobile-ios-ats-insecure-exception  | CWE-319  | Info.plist                       |
#   | mobile-android-webview-debugging   | CWE-489  | *.java, *.kt                     |
#   | mobile-android-webview-file-url-access | CWE-200 | *.java, *.kt                  |
#   | mobile-android-webview-js-interface | CWE-749 | *.java, *.kt                     |
#   | mobile-android-world-accessible-mode | CWE-276 | *.java, *.kt                    |
#   | mobile-kotlin-trust-all-certificates | CWE-295 | *.kt                            |
#   | mobile-hostname-verifier-accepts-all | CWE-295 | *.java, *.kt                    |
#
# As regras de código Java e Kotlin são `generic` também: a Semgrep não analisa
# os ficheiros (um Kotlin que o parser não leia não é cobertura parcial), e o
# mesmo texto serve às duas linguagens (`setX(true)` e `x = true`). Medido em
# 2026-10-24 com --config auto: o registo apanha o TrustManager e o
# HostnameVerifier de Java escritos como CLASSE
# (`java.lang.security.audit.crypto.ssl.insecure-*`), e mais nada destas; por
# isso o TrustManager vazio fica so para Kotlin, e o HostnameVerifier so na
# forma lambda (Java e Kotlin), que o registo não vê.
#
# Todas as regras são `generic` com `paths.include`, de propósito: uma regra
# `xml` faria a Semgrep analisar todos os `.xml` do projeto (pom.xml,
# layouts, .csproj), e um ficheiro que ela não consiga ler é cobertura
# parcial no `scan_sast` (exit 2 no CI). Em modo generic só os ficheiros
# incluídos são lidos, e nunca falham a análise.
#
# O QUE O PACK NAO VÊ (lacunas conhecidas):
#   - O texto e lido como texto: um atributo dentro de um comentário XML
#     (`<!-- android:debuggable="true" -->`) dispara. O manifesto final que o
#     Gradle junta (bibliotecas, `buildTypes`, `manifestPlaceholders`) não é
#     lido: `android:debuggable="${debug}"` não dispara, nem o debuggable que o
#     build `debug` liga por omissão (esse nunca vai para a loja).
#   - `allowBackup` ausente vale `true` no Android, mas so o valor escrito
#     dispara (a ausência daria um achado em quase todas as apps).
#   - Um componente sem `android:exported` (o valor por omissão antes do
#     Android 12, com intent-filter) não dispara; a partir do Android 12
#     (API 31) o atributo e obrigatório.
#   - Um `android:permission` no `<application>` protege todos os
#     componentes que não tenham a sua: aqui o componente exportado sem
#     permissão própria dispara mesmo assim (falso positivo conhecido).
#   - Um provider com `readPermission` E `writePermission` não dispara; com
#     so uma das duas, sim (a outra direção fica aberta).
#   - A network security config e lida em qualquer `res/xml/*.xml`: o nome
#     vem do manifesto (`android:networkSecurityConfig`), que não é seguido.
#     `<certificates src="user">` dentro de `<debug-overrides>` (so builds
#     debuggable) não dispara.
#   - Um Info.plist binário (compilado) não é texto e não é lido; o pack lê
#     `Info.plist` e `<Alvo>-Info.plist` em XML, a forma do repositório.
#   - Nas regras de código o texto e lido como texto: uma chamada dentro de
#     um comentário dispara, e so o literal `true` conta (um valor calculado,
#     `setWebContentsDebuggingEnabled(enabled)`, não). A depuração do WebView
#     guardada por `BuildConfig.DEBUG` (na mesma linha, ou num bloco
#     `if (BuildConfig.DEBUG) { ... }`) não dispara; outra guarda
#     (`ApplicationInfo.FLAG_DEBUGGABLE`, uma flag própria) dispara.
#   - `addJavascriptInterface` e informativo: desde o Android 4.2 so os
#     métodos com `@JavascriptInterface` ficam expostos, e o risco depende de o
#     WebView carregar conteúdo de fora, que o pack não vê.
#   - Um TrustManager Kotlin que aceita tudo com outro corpo (um `return`
#     sozinho, um log) não dispara; so o corpo vazio ou `= Unit`.

rules:
  - id: mobile-android-debuggable
    metadata:
      cwe:
        - "CWE-489: Active Debug Code"
      owasp:
        - "A02:2025 - Security Misconfiguration"
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "**/AndroidManifest.xml"
    message: >-
      `android:debuggable="true"` no manifesto: qualquer pessoa com o
      aparelho pode ligar um depurador a app, ler a memória e correr código
      no processo dela (CWE-489). Retirar o atributo — o build `debug` do
      Gradle já liga a depuração so nesse build.
    pattern-regex: android:debuggable\s*=\s*["']true["']

  - id: mobile-android-allow-backup
    metadata:
      cwe:
        - "CWE-530: Exposure of Backup File to an Unauthorized Control Sphere"
    languages: [generic]
    severity: INFO
    paths:
      include:
        - "**/AndroidManifest.xml"
    message: >-
      `android:allowBackup="true"`: os dados privados da app entram nas
      cópias de segurança (na nuvem e entre aparelhos) e saem do controlo da
      app (CWE-530). Se a app guarda tokens ou dados pessoais, pôr
      `android:allowBackup="false"` ou excluí-los com
      `android:dataExtractionRules` / `android:fullBackupContent`.
    pattern-regex: android:allowBackup\s*=\s*["']true["']

  - id: mobile-android-cleartext-traffic
    metadata:
      cwe:
        - "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp:
        - "A04:2025 - Cryptographic Failures"
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "**/AndroidManifest.xml"
    message: >-
      `android:usesCleartextTraffic="true"`: a app aceita HTTP sem TLS em
      todos os domínios, e quem estiver na mesma rede lê e altera o tráfego
      (CWE-319). Usar HTTPS; se um domínio precisa mesmo de HTTP, abri-lo so a
      ele numa network security config (`<domain-config
      cleartextTrafficPermitted="true">`).
    pattern-regex: android:usesCleartextTraffic\s*=\s*["']true["']

  - id: mobile-android-exported-component
    metadata:
      cwe:
        - "CWE-926: Improper Export of Android Application Components"
      owasp:
        - "A08:2025 - Software or Data Integrity Failures"
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "**/AndroidManifest.xml"
    message: >-
      Service, receiver ou provider com `android:exported="true"` e sem
      `android:permission`: qualquer app do aparelho o pode iniciar, enviar-lhe
      broadcasts ou ler e escrever os dados do provider (CWE-926). Pôr
      `android:exported="false"` se so a própria app o usa; senão exigir uma
      permissão (`android:permission`, com `protectionLevel="signature"` para
      apps do mesmo autor).
    # Do `<` do elemento ao seu `>` (`[^>]*`): exportado e sem permissão
    # própria. Um provider com readPermission E writePermission fica de fora;
    # com so uma, não (lookaheads, PCRE).
    pattern-regex: >-
      <(?:service|receiver|provider)\b(?![^>]*\bandroid:permission\s*=)(?!(?=[^>]*\bandroid:readPermission\s*=)(?=[^>]*\bandroid:writePermission\s*=))[^>]*\bandroid:exported\s*=\s*["']true["']

  - id: mobile-android-nsc-cleartext
    metadata:
      cwe:
        - "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp:
        - "A04:2025 - Cryptographic Failures"
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "**/res/xml/*.xml"
    message: >-
      A network security config permite HTTP sem TLS
      (`cleartextTrafficPermitted="true"`): quem estiver na mesma rede lê e
      altera esse tráfego (CWE-319). Usar HTTPS; um `<domain-config>` aberto
      deve nomear so os domínios que não têm TLS (nunca na `<base-config>`).
    pattern-regex: \bcleartextTrafficPermitted\s*=\s*["']true["']

  - id: mobile-android-nsc-user-ca
    metadata:
      cwe:
        - "CWE-295: Improper Certificate Validation"
      owasp:
        - "A07:2025 - Authentication Failures"
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "**/res/xml/*.xml"
    message: >-
      A network security config confia nas autoridades de certificação que o
      utilizador instalou (`<certificates src="user">`): um CA instalado no
      aparelho (por um proxy, um MDM ou malware) intercepta o TLS da app
      (CWE-295). Confiar so nas do sistema; para testar com um proxy, pôr esta
      linha dentro de `<debug-overrides>`.
    patterns:
      - pattern-regex: <certificates\s+[^>]*\bsrc\s*=\s*["']user["']
      # So nos builds debuggable: o Android ignora `<debug-overrides>` nos outros.
      # O `...` do padrão generic casa também zero atributos: `<debug-overrides>`
      # sem nada cabe aqui (a ablação mostrou um segundo padrão sem `...`
      # redundante com este, e foi apagado).
      - pattern-not-inside: |
          <debug-overrides ...>
          ...
          </debug-overrides>

  - id: mobile-ios-ats-arbitrary-loads
    metadata:
      cwe:
        - "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp:
        - "A04:2025 - Cryptographic Failures"
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "**/Info.plist"
        - "**/*-Info.plist"
    message: >-
      O App Transport Security está desligado (`NSAllowsArbitraryLoads`,
      `...InWebContent` ou `...ForMedia` a `true`): a app aceita HTTP sem TLS
      e certificados fracos em todos os domínios (CWE-319). Usar HTTPS; se um
      domínio precisa mesmo de HTTP, abri-lo so a ele em `NSExceptionDomains`.
    pattern-regex: <key>\s*NSAllowsArbitraryLoads(?:InWebContent|ForMedia)?\s*</key>\s*<true\s*/>

  - id: mobile-ios-ats-insecure-exception
    metadata:
      cwe:
        - "CWE-319: Cleartext Transmission of Sensitive Information"
      owasp:
        - "A04:2025 - Cryptographic Failures"
    languages: [generic]
    severity: INFO
    paths:
      include:
        - "**/Info.plist"
        - "**/*-Info.plist"
    message: >-
      Um domínio de `NSExceptionDomains` aceita HTTP sem TLS
      (`NSExceptionAllowsInsecureHTTPLoads` a `true`): esse tráfego pode ser
      lido e alterado na rede (CWE-319). Confirmar que o domínio não leva
      dados de utilizadores, ou servi-lo por HTTPS.
    pattern-regex: <key>\s*NS(?:Temporary)?ExceptionAllowsInsecureHTTPLoads\s*</key>\s*<true\s*/>

  - id: mobile-android-webview-debugging
    metadata:
      cwe:
        - "CWE-489: Active Debug Code"
      owasp:
        - "A02:2025 - Security Misconfiguration"
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    message: >-
      `WebView.setWebContentsDebuggingEnabled(true)`: o Chrome de qualquer
      computador ligado por USB inspeciona e altera o conteúdo dos WebViews da
      app — cookies, tokens, o JavaScript da página (CWE-489). Ligar so no
      build debug: `setWebContentsDebuggingEnabled(BuildConfig.DEBUG)`.
    patterns:
      # A linha da chamada sem `BuildConfig.DEBUG` (a guarda na mesma linha).
      - pattern-regex: (?m)^(?![^\n]*BuildConfig\.DEBUG)[^\n]*?\bsetWebContentsDebuggingEnabled\s*\(\s*true\s*\)
      - pattern-not-inside: |
          if (BuildConfig.DEBUG) { ... }

  - id: mobile-android-webview-file-url-access
    metadata:
      cwe:
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp:
        - "A01:2025 - Broken Access Control"
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    message: >-
      O WebView deixa uma página `file://` ler outros ficheiros ou outras
      origens (`allowUniversalAccessFromFileURLs` / `allowFileAccessFromFileURLs`
      a `true`): um HTML guardado pela app, ou trazido por outra, lê os
      ficheiros privados da app e envia-os para fora (CWE-200). Deixar o valor
      por omissão (`false`); para conteúdo local usar o `WebViewAssetLoader`.
    pattern-regex: \b(?:setAllow(?:Universal|File)AccessFromFileURLs\s*\(\s*true\s*\)|allow(?:Universal|File)AccessFromFileURLs\s*=\s*true\b)

  - id: mobile-android-webview-js-interface
    metadata:
      cwe:
        - "CWE-749: Exposed Dangerous Method or Function"
      owasp:
        - "A01:2025 - Broken Access Control"
    languages: [generic]
    severity: INFO
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    message: >-
      `addJavascriptInterface`: os métodos `@JavascriptInterface` do objeto
      ficam ao alcance de todo o JavaScript que o WebView carregar (CWE-749).
      Confirmar que o WebView so carrega conteúdo da própria app ou de um
      domínio fixo em HTTPS, e que nenhum desses métodos devolve dados
      sensíveis ou executa ações sem confirmação.
    pattern-regex: \baddJavascriptInterface\s*\(

  - id: mobile-android-world-accessible-mode
    metadata:
      cwe:
        - "CWE-276: Incorrect Default Permissions"
      owasp:
        - "A01:2025 - Broken Access Control"
    languages: [generic]
    severity: WARNING
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    message: >-
      `MODE_WORLD_READABLE` / `MODE_WORLD_WRITEABLE`: qualquer app do aparelho
      lê ou escreve o ficheiro ou as preferências (CWE-276); desde o Android 7
      lança `SecurityException`. Usar `MODE_PRIVATE` e, para partilhar, um
      `FileProvider`.
    pattern-regex: \bMODE_WORLD_(?:READABLE|WRITEABLE)\b

  - id: mobile-kotlin-trust-all-certificates
    metadata:
      cwe:
        - "CWE-295: Improper Certificate Validation"
      owasp:
        - "A07:2025 - Authentication Failures"
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "**/*.kt"
    message: >-
      Um `X509TrustManager` cujo `checkServerTrusted` não faz nada aceita
      qualquer certificado: quem estiver na rede intercepta e altera o TLS da
      app (CWE-295). Usar o TrustManager do sistema; para fixar o certificado,
      um `CertificatePinner` (OkHttp) ou `<pin-set>` na network security config.
    pattern-regex: \bfun\s+checkServerTrusted\s*\([^)]*\)\s*(?:\{\s*\}|=\s*Unit\b)

  - id: mobile-hostname-verifier-accepts-all
    metadata:
      cwe:
        - "CWE-295: Improper Certificate Validation"
      owasp:
        - "A07:2025 - Authentication Failures"
    languages: [generic]
    severity: ERROR
    paths:
      include:
        - "**/*.java"
        - "**/*.kt"
    message: >-
      Um `HostnameVerifier` que devolve sempre `true` aceita o certificado de
      qualquer servidor para qualquer nome: o TLS deixa de provar com quem a
      app fala (CWE-295). Usar o verificador por omissão
      (`HttpsURLConnection.getDefaultHostnameVerifier()`) ou comparar o nome.
    # Lambdas Java (`(h, s) -> true`) e Kotlin (`{ _, _ -> true }`); a forma de
    # classe Java e a regra do registo `insecure-hostname-verifier`.
    pattern-regex: \bHostnameVerifier\b[^;{]*?(?:\{\s*\w+\s*,\s*\w+\s*->\s*true\s*\}|=\s*\(\s*\w+\s*,\s*\w+\s*\)\s*->\s*true\b)
