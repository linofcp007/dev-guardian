# dev-guardian Semgrep config wordpress.
# Padrões de SQL do WordPress que a análise de taint do Psalm (o
# `configs/psalm/wordpress-taint.phpstub`) não decide: lá o `esc_sql` é um
# escape de SQL, como o WordPress o documenta para um valor ENTRE ASPAS. Fora
# de aspas não protege nada. Corre dentro do `scan_sast` (como o `llm.yml`,
# o `web-js.yml` e o `mobile.yml`) e do `scan_wordpress`.
#
#   | regra                       | CWE    | como decide                         |
#   | --------------------------- | ------ | ----------------------------------- |
#   | wordpress-esc-sql-unquoted  | CWE-89 | padrão: o literal imediatamente     |
#   |                             |        | antes do valor de `esc_sql` acaba   |
#   |                             |        | num contexto de valor sem aspas     |
#
# wordpress-esc-sql-unquoted
#   - O `esc_sql` só escapa aspas e barras: um valor posto FORA de aspas
#     (`WHERE id = " . esc_sql($_GET['id'])`, o CVE-2021-24340 do
#     wp-statistics 13.0.7) continua a ser SQL. Dispara quando o literal que
#     precede `esc_sql(...)` acaba num contexto de valor: `=`, `<`, `>`,
#     `IN (`, `VALUES (`, `LIKE`, `LIMIT`, `OFFSET`, `BETWEEN` ou `AND`, com
#     ou sem espaços. Decide pelo literal que precede, nunca contando aspas na
#     cadeia: num `" ... LIKE '%" . esc_sql($s) . "%' OR b LIKE '%" .
#     esc_sql($s)` a aspa abre-se num literal anterior (medido no WooCommerce
#     11.2.1: contar aspas dava 19 achados, contra os 3 de agora).
#   - Decide pela FORMA, nunca pela origem do valor: um id que o código já
#     converteu para inteiro antes (`absint`, `is_numeric`, o id que um hook
#     do WordPress passa) dispara na mesma, e a correção é a mesma: `(int)`,
#     `absint` ou `$wpdb->prepare` com `%d`, e o `esc_sql` sai. Um valor
#     convertido DENTRO do `esc_sql(...)` (`(int)`, `(float)`, `absint`,
#     `intval`, `floatval`) não dispara.
#   - Medido em 2026-10-24 sobre o WooCommerce 11.2.1, o wp-statistics 13.0.7
#     e o Contact Form 7 6.2.3 (3 379 ficheiros PHP): 6 achados, nenhum fora
#     da forma — a linha do CVE-2021-24340, 2 ids de hooks do WordPress
#     (wp-statistics) e 3 listas ou números que o WooCommerce já converteu
#     (`absint`, `is_numeric`).
#   - Não vê uma variável atribuída de `esc_sql(...)` e usada depois, nem
#     concatenada (`"... id = " . $id`) nem interpolada (`"... id = $id"`).
#     Concatenada, o padrão com `pattern-inside` sobrepõe-se ao da chamada
#     direta (o mesmo sítio com outro intervalo); interpolada, o Semgrep 1.176
#     não liga o nome lido na string à variável atribuída (medido: um padrão
#     por regex dispara também para uma variável que não veio do `esc_sql`).
#     No corpus acima nenhuma das duas formas dava um achado: as 14
#     interpolações candidatas eram de outras variáveis ou entre aspas.
#   - Não vê um identificador (entre crases, `ORDER BY`) nem um operador: o
#     `esc_sql` também não escapa uma crase, mas o nome de uma coluna é quase
#     sempre do próprio código; para um identificador há o `%i` do
#     `$wpdb->prepare` (WordPress 6.2).
#   - Um `sprintf` com `%s` sem aspas não é visto: só a concatenação.

rules:
  - id: wordpress-esc-sql-unquoted
    metadata:
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      owasp:
        - "A05:2025 - Injection"
    languages: [php]
    severity: WARNING
    message: >-
      O valor de `esc_sql` fica fora de aspas no SQL: o `esc_sql` só escapa aspas
      e barras, e um valor como `1 OR 1=1` passa inteiro (CWE-89; o
      CVE-2021-24340 do wp-statistics tinha esta forma). Para um número usar
      `(int)` ou `absint` e tirar o `esc_sql`; em geral, `$wpdb->prepare` com
      `%d` ou `%s` (que põe as aspas). Para uma lista `IN (...)`, um `%d` por
      elemento.
    patterns:
      - pattern: $S . esc_sql($X)
      - pattern-not: $S . esc_sql((int) $Y)
      - pattern-not: $S . esc_sql((float) $Y)
      - pattern-not: $S . esc_sql(absint(...))
      - pattern-not: $S . esc_sql(intval(...))
      - pattern-not: $S . esc_sql(floatval(...))
      # O literal que precede acaba num contexto de valor sem aspas. Aspas e
      # barras em hexadecimal (\x22, \x27, \x5c): nenhuma camada de escape as
      # pode reduzir. O `^(?:.*\.\s*)?` deixa passar uma cadeia antes do
      # literal (o Semgrep dá-a inteira, com o `.` final).
      - metavariable-regex:
          metavariable: $S
          regex: '(?s)^(?:.*\.\s*)?(?:\x22(?:[^\x22\x5c]|\x5c.)*(?i:[=<>]|\b(?:in|values)\s*\(|\b(?:like|limit|offset|between|and))\s*\x22|\x27(?:[^\x27\x5c]|\x5c.)*(?i:[=<>]|\b(?:in|values)\s*\(|\b(?:like|limit|offset|between|and))\s*\x27)\s*\.?\s*$'
