# Generated by `dev-guardian ci-init github` — do not hand-edit the pinned
# SHAs/versions/checksums below; re-run the generator after a dev-guardian
# release instead. It reads .claude-plugin/plugin.json (the release tag) and
# configs/ci/pinned.json (every action SHA and scanner checksum) — bump
# those and every value here refreshes together in one command.
#
# What this job does, and why each step exists:
#   1. Checks out THIS repository (the project being scanned).
#   2. Installs Node.js >= 22.13 — dev-guardian's own floor (`node:sqlite`
#      with no `--experimental-sqlite` flag).
#   3. Clones dev-guardian itself at a pinned release tag — into
#      `$RUNNER_TEMP`, OUTSIDE this checkout, never into a subdirectory of
#      it. dev-guardian is NOT a dependency of this repository (there is no
#      package.json entry for `npm install` to fetch it from), and cloning
#      it INTO the checkout would make step 6's `dev-guardian scan
#      --project .` scan dev-guardian's own source, history and its
#      deliberately-vulnerable test fixtures as if they were part of THIS
#      project — polluting the SARIF report, the baseline and the gate with
#      findings that have nothing to do with this repository. `$RUNNER_TEMP`
#      is the runner's own documented scratch directory: writable, and
#      never checked out into, on every GitHub-hosted and self-hosted
#      runner.
#   4. `npm ci --omit=dev` inside the clone's mcp/ directory. mcp/dist/ is
#      committed to the dev-guardian repo (its own convention: the repo IS
#      the distribution, no build step at install time) but its RUNTIME
#      dependencies (execa, zod, yaml, the MCP SDK) are ordinary npm
#      packages, not vendored, so they still need installing once per run.
#   5. Installs the scanner binaries `dev-guardian scan` drives underneath —
#      Trivy, gitleaks and actionlint — each pinned by exact version and
#      verified against a sha256 fetched from that tool's own GitHub
#      release (never "latest"). Semgrep and zizmor are Python-distributed
#      (pipx); pip's own hash-verified resolution against the PyPI index is
#      the applicable integrity mechanism for those two, so they are pinned
#      by exact version instead of a hand-fetched checksum.
#   6. Runs `dev-guardian scan`, gated against the COMMITTED baseline
#      (.guardian/baseline.json). If this repository has never run
#      `dev-guardian baseline update`, every existing finding reads as
#      "new" and this job will very likely fail on its first run — do that
#      once locally and commit the result before relying on this gate.
#   7. Uploads the SARIF report to GitHub code scanning. `if: always()` so
#      the upload still runs when step 6 fails the gate (the SARIF file was
#      still written — dev-guardian's own `scan` command never skips
#      writing it just because the gate failed); `continue-on-error: true`
#      because a repository without GitHub Advanced Security enabled must
#      not fail the whole job over the upload alone — step 6's own gate is
#      what decides pass/fail here, not this step.
name: dev-guardian

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  DEV_GUARDIAN_HOME: ${{ runner.temp }}/dev-guardian

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@{{CHECKOUT_SHA}} # {{CHECKOUT_VERSION}}

      - name: Set up Node.js
        uses: actions/setup-node@{{SETUP_NODE_SHA}} # {{SETUP_NODE_VERSION}}
        with:
          node-version: '22'

      - name: Clone dev-guardian (outside this checkout — see the header comment)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "{{DEV_GUARDIAN_TAG}}" "{{DEV_GUARDIAN_REPO}}.git" "$DEV_GUARDIAN_HOME"

      - name: Install dev-guardian's runtime dependencies
        run: npm ci --omit=dev --prefix "$DEV_GUARDIAN_HOME/mcp"

      - name: Install scanners (Trivy, gitleaks, actionlint checksum-verified; semgrep/zizmor pinned by version)
        run: |
          set -euo pipefail
          # $1=binary name  $2=download URL  $3=expected sha256  $4=member path inside the tarball
          install_checked() {
            local name="$1" url="$2" sha256="$3" member="$4"
            curl -sSfL -o "$name.tar.gz" "$url"
            echo "$sha256  $name.tar.gz" | sha256sum -c -
            tar -xzf "$name.tar.gz" "$member"
            sudo install -m 0755 "$member" "/usr/local/bin/$name"
          }
          install_checked trivy "{{TRIVY_URL}}" "{{TRIVY_SHA256}}" "{{TRIVY_MEMBER}}"
          install_checked gitleaks "{{GITLEAKS_URL}}" "{{GITLEAKS_SHA256}}" "{{GITLEAKS_MEMBER}}"
          install_checked actionlint "{{ACTIONLINT_URL}}" "{{ACTIONLINT_SHA256}}" "{{ACTIONLINT_MEMBER}}"
          pipx install "semgrep=={{SEMGREP_VERSION}}"
          pipx install "zizmor=={{ZIZMOR_VERSION}}"
          # `run:` steps do not share a shell, so `export PATH=...` here
          # would not reach the later "dev-guardian scan" step — pipx's own
          # install directory has to be persisted the GitHub Actions way.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: dev-guardian scan
        run: |
          node "$DEV_GUARDIAN_HOME/cli/dev-guardian.mjs" scan \
            --project . \
            --fail-on high \
            --format human \
            --sarif dev-guardian-results.sarif

      - name: Upload SARIF to code scanning
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@{{UPLOAD_SARIF_SHA}} # {{UPLOAD_SARIF_VERSION}}
        with:
          sarif_file: dev-guardian-results.sarif
