# Generated by `dev-guardian ci-init bitbucket` — do not hand-edit the
# pinned versions/checksums below; re-run the generator after a
# dev-guardian release instead. It reads .claude-plugin/plugin.json (the
# release tag, resolved to its exact commit — see below) and
# configs/ci/pinned.json (every scanner checksum) — bump those and every
# value here refreshes together in one command.
#
# What this pipeline does, and why each step exists:
#   1. Runs in a plain node:22-trixie image (Debian 13) — dev-guardian's own floor is
#      Node >= 22.13 (`node:sqlite` with no `--experimental-sqlite` flag).
#      `clone: depth: full` below clones FULL history, not Bitbucket's own
#      shallow default (the last 50 commits): gitleaks' own finding
#      identity includes the commit a secret was introduced in, and a
#      shallow clone has no such commit for anything older than its own
#      boundary — it attributes every pre-existing secret to the grafted
#      boundary commit instead, which moves with every push, so every
#      finding looks "new" on every run and the gate never passes twice in
#      a row. Bitbucket's own documented limitation, primary source —
#      support.atlassian.com/bitbucket-cloud/kb/clone-depth-not-applying-for-pull-request-pipelines/
#      — quoted rather than guessed: "configuring a clone depth in
#      pipelines does not take effect for pull request pipelines"; the KB's
#      own "Cause" section explains why — a PR pipeline's build setup MERGES
#      the destination branch into the source branch to mimic the
#      post-merge state, and "the clone depth is not considered for the
#      merge. Otherwise, the destination branch commits would not be cloned
#      and no merge would be possible." So only the `default` (branch push)
#      pipeline below is guaranteed a true full clone by this setting; a PR
#      pipeline's own clone depth is whatever that merge step needs — not a
#      fixed shallow default this template can name, and not something
#      `depth: full` controls — and there is no config-only way to change
#      that.
#   2. Installs curl/git/python3-venv from Debian's own apt repo — the trixie
#      base image does not carry them by default. A .NET project also
#      needs the .NET SDK for scan_sast's .NET analyzers (the identical
#      gate `hasRootDotnetSignal` applies on the GitHub template — a root
#      .csproj/.fsproj/.sln/.slnx); this template does NOT install it
#      (Microsoft's own dotnet-install.sh has no per-release checksum this
#      task could verify the way it did for the Go binaries below) —
#      a .NET project needs `dotnet` on the image or PATH already, or
#      `dev-guardian scan` will report `dotnet-sdk` as a named gap and the
#      pipeline's own gate will exit 2 (incomplete scan, never a silent
#      pass) until it does. A Go project likewise needs the Go
#      toolchain gosec loads its packages through (`go` on PATH, at the
#      version its go.mod names — Debian's own `golang` is too old for
#      most), or `dev-guardian scan` reports `go` as a named gap and exits 2.
#      A C or C++ project gets Debian trixie's cppcheck (2.17.1; scan_sast
#      needs 2.13 or newer — bookworm's 2.10 skipped a file it could not
#      configure without saying so), only when the checkout has a C or C++
#      source. A PHP project gets this image's PHP (Debian trixie's 8.4:
#      php-cli, php-xml, php-mbstring) and Psalm's release PHAR,
#      sha256-checked like the binaries of step 5, only when the checkout
#      has a PHP source outside vendor/.
#   3. Clones dev-guardian itself at a pinned release tag, resolved to its
#      exact commit SHA when this pipeline was GENERATED (ci-init: `git
#      ls-remote`/a local tag lookup) and verified again with `git
#      rev-parse HEAD` right after cloning — a moving tag between
#      generation and this run is a supply-chain red flag, and the build
#      refuses rather than trust it silently. Cloned into `/tmp`, OUTSIDE
#      `$BITBUCKET_CLONE_DIR` (this checkout), never into a subdirectory of
#      it: dev-guardian is NOT a dependency of this repository, and cloning
#      it INTO the checkout would make step 6's `dev-guardian scan
#      --project .` scan dev-guardian's own source, history and
#      deliberately-vulnerable test fixtures as if they were part of THIS
#      project — polluting the SARIF report, the baseline and the gate with
#      findings that have nothing to do with this repository.
#   4. Installs nothing for dev-guardian itself — no `npm ci`. Its CLI runs
#      on the bundle the clone holds, mcp/dist/engine.js (committed: the
#      repo IS the distribution), which esbuild built with every npm package
#      it uses inlined and which imports Node's builtins alone — so no
#      package from the npm registry, nor an install script of one, runs in
#      this job.
#   5. Installs the scanner binaries `dev-guardian scan` drives — Trivy,
#      gitleaks, actionlint and gosec — each pinned by exact version and verified
#      against a sha256 fetched from that tool's own GitHub release (never
#      "latest"), downloaded and extracted into a SCRATCH directory under
#      `/tmp`, never into this checkout (an earlier version wrote the
#      downloaded tarballs and extracted binaries straight into the working
#      directory, which gitleaks' own working-tree pass then saw as
#      untracked files well over its size limit — a self-inflicted coverage
#      gap on every run). gosec too, the same way, and bandit — both
#      unconditionally (cheap; scan_sast only attempts each on a repo with
#      Go or Python files, but a template cannot know that in advance).
#      bandit, Semgrep and zizmor are Python packages: they are installed
#      with EVERY dependency of theirs pinned by version and sha256, from the
#      lock the dev-guardian clone of step 3 holds for the image's Python
#      (configs/ci/python/<X.Y>/requirements.txt — the commit verified there
#      fixes its content), into a venv of Debian's python3, whose pip is
#      Debian's (never one from PyPI), in hash-checking mode
#      (`--require-hashes`) and from wheels only (`--only-binary :all:`: no
#      package's build code runs). A download whose sha256 the lock does not
#      list — a dependency's new release, or another file served under the
#      same version — is refused, and the job stops. So does an image whose
#      Python has no lock in the clone. (pipx, before 3.7.0, pinned the three
#      packages alone: their dependencies, and the pip that installed them —
#      pipx upgrades its own from PyPI — were the newest on every run.)
#   6. Runs `dev-guardian scan`, gated against the COMMITTED baseline
#      (.guardian/baseline.json). If this repository has never run
#      `dev-guardian baseline update`, every existing finding reads as
#      "new" and this pipeline will very likely fail on its first run — do
#      that once locally and commit the result before relying on this gate.
#      In a pull-request pipeline the baseline, the project's Semgrep rules
#      and its .guardianignore/.trivyignore/.bandit are read from the
#      destination branch (`--baseline-ref`/`--rules-ref`
#      origin/$BITBUCKET_PR_DESTINATION_BRANCH, fetched first), never from
#      the pull request's own tree, which could otherwise adopt its own
#      findings or delete the rule that catches them (docs/ci.md); every
#      .semgrepignore, .gitleaksignore and .gitleaks.toml of this disposable
#      checkout is put back to the destination's (`--reset-exclusions-from`). On a
#      branch pipeline nothing is passed and the committed files are the
#      gate. This file itself is the pull request's too: protect it (a
#      required reviewer on bitbucket-pipelines.yml).
#   7. Declares the SARIF report as a Bitbucket artifact, collected whether
#      the script step succeeds or fails. Bitbucket Pipelines has no native
#      SARIF/code-scanning ingestion the way GitHub does — this is a plain
#      downloadable artifact, attached to the build.
#
# Shell and reuse: `set -eu`, no `pipefail`, no `local` — same reasoning as
# the GitLab template (portability, not a claim about which shell actually
# runs the script; see that template's own header for the full
# explanation). The step itself is defined ONCE, under `definitions.steps`,
# and referenced by YAML alias (`*dev-guardian-scan`) from both `default`
# and `pull-requests` — Bitbucket's own documented mechanism for exactly
# this (support.atlassian.com/bitbucket-cloud/docs/yaml-anchors) — rather
# than duplicating the whole step twice in this file.
image: node:22-trixie

clone:
  depth: full

definitions:
  steps:
    - step: &dev-guardian-scan
        name: dev-guardian scan
        script:
          - set -eu
          - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git python3-venv
          - export DEV_GUARDIAN_HOME=/tmp/dev-guardian
          - git clone --depth 1 --branch "{{DEV_GUARDIAN_TAG}}" "{{DEV_GUARDIAN_REPO}}.git" "$DEV_GUARDIAN_HOME"
          - |
            actual_sha="$(git -C "$DEV_GUARDIAN_HOME" rev-parse HEAD)"
            if [ "$actual_sha" != "{{DEV_GUARDIAN_SHA}}" ]; then
              echo "dev-guardian clone at {{DEV_GUARDIAN_TAG}} resolved to $actual_sha, expected {{DEV_GUARDIAN_SHA}} -- the tag may have moved since this pipeline was generated (a supply-chain red flag). Re-run 'dev-guardian ci-init' after checking why, then commit the refreshed pipeline." >&2
              exit 1
            fi
          - |
            mkdir -p /tmp/dev-guardian-scanners
            install_checked() {
              name="$1"; url="$2"; sha256="$3"; member="$4"; dir="/tmp/dev-guardian-scanners"
              curl -sSfL -o "$dir/$name.tar.gz" "$url"
              echo "$sha256  $dir/$name.tar.gz" | sha256sum -c -
              tar -xzf "$dir/$name.tar.gz" -C "$dir" "$member"
              install -m 0755 "$dir/$member" "/usr/local/bin/$name"
            }
            install_checked trivy "{{TRIVY_URL}}" "{{TRIVY_SHA256}}" "{{TRIVY_MEMBER}}"
            install_checked gitleaks "{{GITLEAKS_URL}}" "{{GITLEAKS_SHA256}}" "{{GITLEAKS_MEMBER}}"
            install_checked actionlint "{{ACTIONLINT_URL}}" "{{ACTIONLINT_SHA256}}" "{{ACTIONLINT_MEMBER}}"
            install_checked gosec "{{GOSEC_URL}}" "{{GOSEC_SHA256}}" "{{GOSEC_MEMBER}}"
            if find . -path './.*' -prune -o -type f \( -iname '*.c' -o -iname '*.cc' -o -iname '*.cpp' -o -iname '*.cxx' -o -iname '*.c++' \) -print -quit | grep -q .; then
              apt-get install -y --no-install-recommends cppcheck
            fi
            if find . -path './.*' -prune -o -name vendor -prune -o -name node_modules -prune -o -type f \( -iname '*.php' -o -iname '*.phtml' \) -print -quit | grep -q .; then
              apt-get install -y --no-install-recommends php-cli php-xml php-mbstring
              curl -sSfL -o /tmp/dev-guardian-scanners/psalm.phar "{{PSALM_URL}}"
              echo "{{PSALM_SHA256}}  /tmp/dev-guardian-scanners/psalm.phar" | sha256sum -c -
              install -m 0755 /tmp/dev-guardian-scanners/psalm.phar /usr/local/bin/psalm.phar
            fi
          - |
            # bandit {{BANDIT_VERSION}}, semgrep {{SEMGREP_VERSION}} and zizmor {{ZIZMOR_VERSION}}, each dependency
            # pinned by version and sha256 in the verified clone's lock (header, step 5).
            # `-I` everywhere: the build runs in the checkout, and `python3 -m venv`
            # would otherwise import a `venv` package the checkout holds.
            py="$(python3 -I -c 'import sys; print("%d.%d" % sys.version_info[:2])')"
            lock="$DEV_GUARDIAN_HOME/configs/ci/python/$py/requirements.txt"
            if [ ! -f "$lock" ]; then
              echo "dev-guardian {{DEV_GUARDIAN_TAG}} has no hashed lock for Python $py ($lock): run this step on node:22-trixie, or re-run 'dev-guardian ci-init' from a release that has one." >&2
              exit 1
            fi
            python3 -I -m venv /tmp/dev-guardian-scanners/python
            /tmp/dev-guardian-scanners/python/bin/python -I -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary :all: -r "$lock"
            # Only the scanners' own commands on PATH — not the venv's python or pip.
            mkdir -p /tmp/dev-guardian-scanners/bin
            for tool in bandit semgrep pysemgrep zizmor; do ln -s "/tmp/dev-guardian-scanners/python/bin/$tool" "/tmp/dev-guardian-scanners/bin/$tool"; done
          - export PATH="/tmp/dev-guardian-scanners/bin:$PATH"
          - |
            set --
            if [ -n "${BITBUCKET_PR_DESTINATION_BRANCH:-}" ]; then
              dest="$BITBUCKET_PR_DESTINATION_BRANCH"
              git fetch --quiet --no-tags origin "+refs/heads/$dest:refs/remotes/origin/$dest"
              set -- --baseline-ref "origin/$dest" --rules-ref "origin/$dest" --reset-exclusions-from "origin/$dest"
            fi
            node "$DEV_GUARDIAN_HOME/cli/dev-guardian.mjs" scan --project . --fail-on high --format human --sarif dev-guardian-results.sarif "$@"
        artifacts:
          - dev-guardian-results.sarif

pipelines:
  default:
    - step: *dev-guardian-scan
  pull-requests:
    '**':
      - step: *dev-guardian-scan
