# Generated by `dev-guardian ci-init bitbucket` — do not hand-edit the
# pinned versions/checksums below; re-run the generator after a
# dev-guardian release instead. It reads .claude-plugin/plugin.json (the
# release tag) and configs/ci/pinned.json (every scanner checksum) — bump
# those and every value here refreshes together in one command.
#
# What this pipeline does, and why each step exists:
#   1. Runs in a plain node:22-bookworm image — dev-guardian's own floor is
#      Node >= 22.13 (`node:sqlite` with no `--experimental-sqlite` flag),
#      and Bitbucket checks out this repository into it automatically;
#      there is no separate "checkout" action to pin the way GitHub Actions
#      has.
#   2. Installs curl/git/pipx from Debian's own apt repo — the bookworm
#      base image does not carry them by default.
#   3. Clones dev-guardian itself at a pinned release tag — into `/tmp`,
#      OUTSIDE `$BITBUCKET_CLONE_DIR` (this checkout), never into a
#      subdirectory of it. dev-guardian is NOT a dependency of this
#      repository, and cloning it INTO the checkout would make step 6's
#      `dev-guardian scan --project .` scan dev-guardian's own source,
#      history and its deliberately-vulnerable test fixtures as if they
#      were part of THIS project — polluting the SARIF report, the baseline
#      and the gate with findings that have nothing to do with this
#      repository.
#   4. `npm ci --omit=dev` inside the clone's mcp/ directory. mcp/dist/ is
#      committed (dev-guardian's own convention: the repo IS the
#      distribution) but its RUNTIME dependencies (execa, zod, yaml, the
#      MCP SDK) still need installing once per run.
#   5. Installs the scanner binaries `dev-guardian scan` drives — Trivy,
#      gitleaks and actionlint — each pinned by exact version and verified
#      against a sha256 fetched from that tool's own GitHub release (never
#      "latest"). Semgrep and zizmor are Python-distributed (pipx); pip's
#      own hash-verified resolution against the PyPI index is the
#      applicable integrity mechanism for those two, so they are pinned by
#      exact version instead of a hand-fetched checksum.
#   6. Runs `dev-guardian scan`, gated against the COMMITTED baseline
#      (.guardian/baseline.json). If this repository has never run
#      `dev-guardian baseline update`, every existing finding reads as
#      "new" and this pipeline will very likely fail on its first run — do
#      that once locally and commit the result before relying on this gate.
#   7. Declares the SARIF report as a Bitbucket artifact, collected whether
#      the script step succeeds or fails. Bitbucket Pipelines has no native
#      SARIF/code-scanning ingestion the way GitHub does — this is a plain
#      downloadable artifact, attached to the build.
#
# Shell and reuse: same `set -eu`, no `pipefail`, no `local` reasoning as
# the GitLab template (node:22-bookworm's default shell is dash, which has
# neither) — see that template's own header for the full explanation. The
# step itself is defined ONCE, under `definitions.steps`, and referenced by
# YAML alias (`*dev-guardian-scan`) from both `default` and `pull-requests`
# — Bitbucket's own documented mechanism for exactly this
# (support.atlassian.com/bitbucket-cloud/docs/yaml-anchors) — rather than
# duplicating the whole step twice in this file.
image: node:22-bookworm

definitions:
  steps:
    - step: &dev-guardian-scan
        name: dev-guardian scan
        script:
          - set -eu
          - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git pipx
          - export DEV_GUARDIAN_HOME=/tmp/dev-guardian
          - git clone --depth 1 --branch "{{DEV_GUARDIAN_TAG}}" "{{DEV_GUARDIAN_REPO}}.git" "$DEV_GUARDIAN_HOME"
          - npm ci --omit=dev --prefix "$DEV_GUARDIAN_HOME/mcp"
          - |
            install_checked() {
              name="$1"; url="$2"; sha256="$3"; member="$4"
              curl -sSfL -o "$name.tar.gz" "$url"
              echo "$sha256  $name.tar.gz" | sha256sum -c -
              tar -xzf "$name.tar.gz" "$member"
              install -m 0755 "$member" "/usr/local/bin/$name"
            }
            install_checked trivy "{{TRIVY_URL}}" "{{TRIVY_SHA256}}" "{{TRIVY_MEMBER}}"
            install_checked gitleaks "{{GITLEAKS_URL}}" "{{GITLEAKS_SHA256}}" "{{GITLEAKS_MEMBER}}"
            install_checked actionlint "{{ACTIONLINT_URL}}" "{{ACTIONLINT_SHA256}}" "{{ACTIONLINT_MEMBER}}"
          - pipx install "semgrep=={{SEMGREP_VERSION}}"
          - pipx install "zizmor=={{ZIZMOR_VERSION}}"
          - export PATH="$HOME/.local/bin:$PATH"
          - node "$DEV_GUARDIAN_HOME/cli/dev-guardian.mjs" scan --project . --fail-on high --format human --sarif dev-guardian-results.sarif
        artifacts:
          - dev-guardian-results.sarif

pipelines:
  default:
    - step: *dev-guardian-scan
  pull-requests:
    '**':
      - step: *dev-guardian-scan
