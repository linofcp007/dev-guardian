# Generated by `dev-guardian ci-init gitlab` — do not hand-edit the pinned
# versions/checksums below; re-run the generator after a dev-guardian
# release instead. It reads .claude-plugin/plugin.json (the release tag) and
# configs/ci/pinned.json (every scanner checksum) — bump those and every
# value here refreshes together in one command.
#
# What this job does, and why each step exists:
#   1. Runs in a plain node:22-bookworm image — dev-guardian's own floor is
#      Node >= 22.13 (`node:sqlite` with no `--experimental-sqlite` flag),
#      and GitLab checks out this repository into it automatically; there
#      is no separate "checkout" action to pin the way GitHub Actions has.
#   2. Installs curl/git/pipx from Debian's own apt repo — the bookworm
#      base image does not carry them by default.
#   3. Clones dev-guardian itself at a pinned release tag — into `/tmp`,
#      OUTSIDE `$CI_PROJECT_DIR` (this checkout), never into a subdirectory
#      of it. dev-guardian is NOT a dependency of this repository, and
#      cloning it INTO the checkout would make step 6's `dev-guardian scan
#      --project .` scan dev-guardian's own source, history and its
#      deliberately-vulnerable test fixtures as if they were part of THIS
#      project — polluting the SARIF report, the baseline and the gate with
#      findings that have nothing to do with this repository.
#   4. `npm ci --omit=dev` inside the clone's mcp/ directory. mcp/dist/ is
#      committed (dev-guardian's own convention: the repo IS the
#      distribution) but its RUNTIME dependencies (execa, zod, yaml, the
#      MCP SDK) still need installing once per run.
#   5. Installs the scanner binaries `dev-guardian scan` drives — Trivy,
#      gitleaks and actionlint — each pinned by exact version and verified
#      against a sha256 fetched from that tool's own GitHub release (never
#      "latest"). Semgrep and zizmor are Python-distributed (pipx); pip's
#      own hash-verified resolution against the PyPI index is the
#      applicable integrity mechanism for those two, so they are pinned by
#      exact version instead of a hand-fetched checksum.
#   6. Runs `dev-guardian scan`, gated against the COMMITTED baseline
#      (.guardian/baseline.json). If this repository has never run
#      `dev-guardian baseline update`, every existing finding reads as
#      "new" and this job will very likely fail on its first run — do that
#      once locally and commit the result before relying on this gate.
#   7. Archives the SARIF report as a job artifact either way (`when:
#      always`), so it survives a failed gate. Unlike GitHub's code
#      scanning, GitLab's own Security Dashboard does not ingest a plain
#      SARIF file — its `artifacts:reports:*` types (`sast`,
#      `secret_detection`, …) each expect GitLab's OWN JSON schema, which
#      dev-guardian does not produce. This is a plain downloadable artifact,
#      not a native Security Dashboard integration.
#
# Shell: deliberately `set -eu`, never `set -o pipefail`, and no `local` in
# `install_checked` — all three are bash-only or bash-safer-but-not-POSIX
# extensions. GitLab's Docker executor runs `script:`/`before_script:`
# through the image's `/bin/sh` — on a Debian-based image such as
# node:22-bookworm that is `dash`, and `set -o pipefail` there is a hard
# "Illegal option" failure that aborts the job on its very first line,
# before anything else runs. This script's one pipe (`echo … | sha256sum -c
# -`) does not need it anyway: a pipeline's exit status is always its LAST
# command's, with or without pipefail, and `sha256sum -c -` — the one
# command whose failure must fail the job — already is the last one;
# `echo` essentially cannot fail. `install_checked`'s variables are plain
# (unprefixed) rather than `local` for the identical reason: `local` is
# widely supported (dash included) but is not itself POSIX, and nothing
# here needs the extra scoping badly enough to depend on it.
stages:
  - scan

dev-guardian:
  stage: scan
  image: node:22-bookworm
  variables:
    DEV_GUARDIAN_HOME: /tmp/dev-guardian
  before_script:
    - set -eu
    - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates git pipx
  script:
    - set -eu
    - git clone --depth 1 --branch "{{DEV_GUARDIAN_TAG}}" "{{DEV_GUARDIAN_REPO}}.git" "$DEV_GUARDIAN_HOME"
    - npm ci --omit=dev --prefix "$DEV_GUARDIAN_HOME/mcp"
    - |
      install_checked() {
        name="$1"; url="$2"; sha256="$3"; member="$4"
        curl -sSfL -o "$name.tar.gz" "$url"
        echo "$sha256  $name.tar.gz" | sha256sum -c -
        tar -xzf "$name.tar.gz" "$member"
        install -m 0755 "$member" "/usr/local/bin/$name"
      }
      install_checked trivy "{{TRIVY_URL}}" "{{TRIVY_SHA256}}" "{{TRIVY_MEMBER}}"
      install_checked gitleaks "{{GITLEAKS_URL}}" "{{GITLEAKS_SHA256}}" "{{GITLEAKS_MEMBER}}"
      install_checked actionlint "{{ACTIONLINT_URL}}" "{{ACTIONLINT_SHA256}}" "{{ACTIONLINT_MEMBER}}"
    - pipx install "semgrep=={{SEMGREP_VERSION}}"
    - pipx install "zizmor=={{ZIZMOR_VERSION}}"
    - export PATH="$HOME/.local/bin:$PATH"
    - node "$DEV_GUARDIAN_HOME/cli/dev-guardian.mjs" scan --project . --fail-on high --format human --sarif dev-guardian-results.sarif
  artifacts:
    when: always
    paths:
      - dev-guardian-results.sarif
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
