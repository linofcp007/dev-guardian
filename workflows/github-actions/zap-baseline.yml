# dev-guardian — OWASP ZAP baseline scan (DAST)
# Corre contra uma URL de staging. Configurar STAGING_URL como secret.
name: ZAP Baseline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 2'  # weekly Tue 3am UTC

permissions:
  contents: read

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ secrets.STAGING_URL }}
          cmd_options: '-a -j -m 5 -T 10'
          allow_issue_writing: false
