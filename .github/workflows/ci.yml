name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: markdownlint (docs in scope)
        run: >
          npx --yes markdownlint-cli2
          "README.md" "CONTRIBUTING.md" "SECURITY.md" "CHANGELOG.md" "CLAUDE.md"
          "skills/**/*.md" "commands/**/*.md"

  test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  dist-sync:
    name: dist matches a fresh build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: mcp/dist must equal the committed artifact
        working-directory: .
        run: |
          if ! git diff --exit-code -- mcp/dist; then
            echo "::error::mcp/dist is out of sync with src. Run 'cd mcp && npm run build' and commit mcp/dist."
            exit 1
          fi

  coverage:
    name: coverage thresholds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run test:coverage

  e2e:
    name: e2e (real Semgrep, offline ruleset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install Semgrep
        run: pipx install semgrep
      - name: Version
        run: semgrep --version
      - name: Build
        working-directory: mcp
        run: npm ci && npm run build
      - name: Run e2e
        working-directory: mcp
        run: npx vitest run test/e2e

  self-audit:
    name: dogfood (SBOM + self-scan)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dev-guardian.sbom.spdx.json
      - name: Secret scan (gitleaks)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks detect --no-banner --redact --report-path gitleaks.json || true
      - name: SAST (Semgrep)
        run: |
          pipx install semgrep
          semgrep --config auto --sarif --output semgrep.sarif . || true
      - name: Upload audit artifacts
        uses: actions/upload-artifact@v4
        with:
          name: self-audit
          path: |
            dev-guardian.sbom.spdx.json
            gitleaks.json
            semgrep.sarif
          if-no-files-found: ignore
